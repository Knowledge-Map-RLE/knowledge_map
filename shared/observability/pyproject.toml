[tool.poetry]
name = "knowledge-map-observability"
version = "0.1.0"
description = "Shared OpenTelemetry (traces/metrics) + logfmt logging for Knowledge Map microservices"
authors = ["Dobrosvet <dimaprokofev@yandex.ru>"]
readme = "README.md"
packages = [{ include = "observability" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
opentelemetry-api = "1.29.0"
opentelemetry-sdk = "1.29.0"
opentelemetry-exporter-otlp-proto-grpc = "1.29.0"
opentelemetry-instrumentation-fastapi = "0.50b0"
opentelemetry-instrumentation-grpc = "0.50b0"
opentelemetry-instrumentation-httpx = "0.50b0"
opentelemetry-instrumentation-asyncio = "0.50b0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"