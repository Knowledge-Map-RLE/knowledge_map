name: Build and Deploy to Kubernetes

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: ./auth
            needs_shared: true
          - service: api
            context: ./api
            needs_shared: true
          - service: billing
            context: ./billing
            needs_shared: true
          - service: ai
            context: ./ai
            needs_shared: true
          - service: nlp
            context: ./nlp
            needs_shared: true
          - service: laying
            context: ./laying
            needs_shared: false
          - service: knowledge_map_core
            context: ./knowledge_map_core
            needs_shared: false
          - service: pdf_to_md
            context: ./pdf_to_md
            needs_shared: false
          - service: client
            context: ./client
            needs_shared: false
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set registry prefix
        id: registry
        env:
          REGISTRY_NAME: ${{ secrets.CLOUDRU_REGISTRY_NAME }}
        run: |
          if [ -z "$REGISTRY_NAME" ]; then
            echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          else
            echo "prefix=${REGISTRY_NAME}.cr.cloud.ru/km" >> $GITHUB_OUTPUT
          fi

      - name: Login to cloud.ru Artifact Registry
        if: ${{ secrets.CLOUDRU_REGISTRY_NAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.prefix }}
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_SECRET_ID }}

      - name: Login to GHCR (fallback registry)
        if: ${{ secrets.CLOUDRU_REGISTRY_NAME == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.prefix }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ steps.registry.outputs.prefix }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-contexts: ${{ matrix.needs_shared && 'shared: ./shared' || '' }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set registry prefix
        id: registry
        env:
          REGISTRY_NAME: ${{ secrets.CLOUDRU_REGISTRY_NAME }}
        run: |
          if [ -z "$REGISTRY_NAME" ]; then
            echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          else
            echo "prefix=${REGISTRY_NAME}.cr.cloud.ru/km" >> $GITHUB_OUTPUT
          fi

      - name: Prepare production secrets
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          CLOUDRU_API_KEY: ${{ secrets.CLOUDRU_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENCITATIONS_ACCESS_TOKEN: ${{ secrets.OPENCITATIONS_ACCESS_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: |
          ./deploy/scripts/prepare-secrets.sh

      - name: Simulate kubectl apply (DRY_RUN)
        run: |
          echo "Building manifests with kubectl kustomize"
          kubectl kustomize deploy/k8s/overlays/prod > /tmp/prod-manifests.yaml
          echo "Manifests rendered, total lines: $(wc -l < /tmp/prod-manifests.yaml)"

      - name: Setup kubeconfig for cloud.ru Managed Kubernetes
        if: ${{ env.DRY_RUN == 'false' }}
        env:
          KUBECONFIG_B64: ${{ secrets.CLOUDRU_KUBECONFIG_B64 }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: |
          if [ -n "$KUBECONFIG_B64" ]; then
            echo "$KUBECONFIG_B64" | base64 --decode > /tmp/kubeconfig.yaml
            echo "KUBECONFIG=/tmp/kubeconfig.yaml" >> $GITHUB_ENV
          fi

      - name: Apply manifests
        if: ${{ env.DRY_RUN == 'false' && secrets.CLOUDRU_KUBECONFIG_B64 != '' }}
        run: |
          kubectl apply -f /tmp/prod-manifests.yaml
          kubectl -n knowledge-map rollout status deployment --timeout=600s

      - name: DRY_RUN notice
        if: ${{ env.DRY_RUN == 'true' || secrets.CLOUDRU_KUBECONFIG_B64 == '' }}
        run: |
          echo "DRY_RUN=true: manifests rendered, deployment to cloud.ru not performed."
          echo "Remove DRY_RUN / set CLOUDRU_KUBECONFIG_B64 and re-tag to deploy for real."