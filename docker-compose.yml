services:
  neo4j:
    image: neo4j:5.15.0
    container_name: knowledge_map_neo4j
    ports:
      - "7575:7474"   # HTTP для Neo4j Browser (7474 reserved by Windows/Hyper-V)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: "4G"
      NEO4J_server_memory_heap_max__size: "4G"
      NEO4J_server_memory_pagecache_size: "2G"
      NEO4J_server_bolt_advertised__address: "127.0.0.1:7687"
      NEO4J_db_memory_transaction_total_max: "2G"
      NEO4J_db_transaction_timeout: "300m"
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
      NEO4J_PLUGINS: '["apoc", "n10s"]'
      NEO4J_dbms_memory_transaction_total_max: "2G"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*,n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*,n10s.*"
      NEO4J_server_directories_import: "/var/lib/neo4j/import"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      NEO4J_server_http_enabled: "true"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    volumes:
      - D:/Data/Data_Knowledge_Map/neo4j_data:/data
      - D:/Data/Data_Knowledge_Map/neo4j_logs:/logs
      - D:/Data/Data_Knowledge_Map/neo4j_import:/var/lib/neo4j/import
      - D:/Data/Data_Knowledge_Map/neo4j_plugins:/plugins
    networks:
      - knowledge_map_network
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 6G
          cpus: '2.0'
    healthcheck:
      test: cypher-shell --username neo4j --password password 'MATCH () RETURN count(*) as count'
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: knowledge_map_auth
    restart: unless-stopped
    ports:
      - "50052:50051"  # gRPC порт для auth сервиса
    environment:
      - NEO4J_URI=bolt://neo4j:password@neo4j:7687
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
      - SECRET_KEY=your-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - PASSWORD_MIN_LENGTH=8
      - RECOVERY_KEYS_COUNT=10
      - RECOVERY_KEY_LENGTH=16
      - LOGIN_ATTEMPTS_LIMIT=5
      - LOGIN_ATTEMPTS_WINDOW=300
    networks:
      - knowledge_map_network
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - auth_proto:/shared/proto
      - ./auth:/app
      - /app/__pycache__
      - /app/src/__pycache__
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: knowledge_map_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - LAYOUT_SERVICE_HOST=layout
      - LAYOUT_SERVICE_PORT=50051
      - AUTH_SERVICE_HOST=auth
      - AUTH_SERVICE_PORT=50051
      - AI_MODEL_SERVICE_HOST=ai
      - AI_MODEL_SERVICE_PORT=50054
      - NLP_SERVICE_HOST=nlp
      - NLP_SERVICE_PORT=50055
      - S3_ENDPOINT_URL=http://s3:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123456
      - S3_REGION=us-east-1
      - DEBUG=true
    networks:
      - knowledge_map_network
    depends_on:
      neo4j:
        condition: service_healthy
      auth:
        condition: service_started
      ai:
        condition: service_started
      nlp:
        condition: service_started
    volumes:
      - auth_proto:/shared/proto
      - ./api:/app
      - /app/__pycache__
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: knowledge_map_ai
    restart: unless-stopped
    ports:
      - "50054:50054"  # gRPC port for AI service
    environment:
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50054
      - MODEL_CACHE_DIR=/app/models
      - DEFAULT_MODEL=Qwen/Qwen2.5-0.5B-Instruct
      - MODEL_DEVICE=auto
      - LOG_LEVEL=INFO
      - DEFAULT_MAX_TOKENS=2048
      - DEFAULT_TEMPERATURE=0.7
      - MAX_CONTEXT_LENGTH=18000
      - CHUNK_OVERLAP=200
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - knowledge_map_network
    volumes:
      - D:/Data/Data_Knowledge_Map/ai_models:/app/models
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    # Enable GPU support if available
    runtime: nvidia
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50054'); channel.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # More time for model download

  nlp:
    build:
      context: ./nlp
      dockerfile: Dockerfile
    container_name: knowledge_map_nlp
    restart: unless-stopped
    ports:
      - "50055:50055"
    environment:
      - NLP_HOST=0.0.0.0
      - NLP_PORT=50055
      - NLP_MAX_WORKERS=10
      - NLP_ENABLE_SPACY=true
      - NLP_ENABLE_NLTK=true
      - NLP_ENABLE_STANZA=true
      - NLP_ENABLE_UDPIPE=true
      - NLP_MIN_AGREEMENT=2
      - NLP_ENABLE_VOTING=true
      - NLP_SPACY_MODEL=ru_core_news_sm
      - NLP_STANZA_LANG=ru
      - NLP_MAX_TEXT_LENGTH=1000000
      - NLP_BATCH_SIZE=32
      - NLP_LOG_LEVEL=INFO
      - MODEL_CACHE_DIR=/app/models
    networks:
      - knowledge_map_network
    volumes:
      - D:/Data/Data_Knowledge_Map/nlp_models:/app/models
      - ./nlp:/app
      - /app/__pycache__
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50055'); channel.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: knowledge_map_client
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - knowledge_map_network
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  s3:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: knowledge_map_s3
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
      MINIO_CONSOLE_ADDRESS: ":9001"
    command: server /data --console-address ":9001"
    volumes:
      - s3_data:/data
    networks:
      - knowledge_map_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  s3_data:
  auth_proto:
  ai_models:

networks:
  knowledge_map_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
