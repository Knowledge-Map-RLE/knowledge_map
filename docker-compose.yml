services:
  neo4j:
    image: neo4j:5.15.0
    container_name: knowledge_map_neo4j
    ports:
      - "7575:7474"   # HTTP для Neo4j Browser (7474 reserved by Windows/Hyper-V)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: "3G"
      NEO4J_server_memory_heap_max__size: "3G"
      NEO4J_server_memory_pagecache_size: "3G"
      NEO4J_db_memory_transaction_total_max: "1G"
      NEO4J_db_transaction_timeout: "300s"
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
      NEO4J_PLUGINS: '["apoc", "n10s"]'
      NEO4J_dbms_memory_transaction_total_max: "2G"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*,n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*,n10s.*"
      NEO4J_server_directories_import: "/var/lib/neo4j/import"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      NEO4J_server_http_enabled: "true"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./data/neo4j_data:/data
      - ./data/neo4j_logs:/logs
      - ./data/neo4j_import:/var/lib/neo4j/import
      - ./data/neo4j_plugins:/plugins
    networks:
      - knowledge_map_network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
    container_name: knowledge_map_auth
    restart: unless-stopped
    ports:
      - "50057:50057"  # gRPC порт для auth сервиса
    environment:
      - NEO4J_URI=bolt://neo4j:password@neo4j:7687
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50057
      - SECRET_KEY=your-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - PASSWORD_MIN_LENGTH=8
      - RECOVERY_KEYS_COUNT=10
      - RECOVERY_KEY_LENGTH=16
      - LOGIN_ATTEMPTS_LIMIT=5
      - LOGIN_ATTEMPTS_WINDOW=300
    networks:
      - knowledge_map_network
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - auth_proto:/shared/proto
      - ./auth:/app
      - /app/__pycache__
      - /app/src/__pycache__
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
    container_name: knowledge_map_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - LAYOUT_SERVICE_HOST=layout
      - LAYOUT_SERVICE_PORT=50051
      - AUTH_SERVICE_HOST=auth
      - AUTH_SERVICE_PORT=50057
      - AI_MODEL_SERVICE_HOST=ai
      - AI_MODEL_SERVICE_PORT=50059
      - AI_UI_MODEL=${AI_UI_MODEL:-gpt://b1gulkghbtm74u59sakh/deepseek-v4-flash/latest}
      - LLM_EXTRACT_MODEL=${LLM_EXTRACT_MODEL:-gpt://b1gulkghbtm74u59sakh/deepseek-v4-flash/latest}
      - NLP_SERVICE_HOST=nlp
      - NLP_SERVICE_PORT=50055
      - S3_ENDPOINT_URL=http://s3:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123456
      - S3_REGION=us-east-1
      - QDRANT_URL=http://qdrant:6333
      - DEBUG=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=api
      - LOG_FORMAT=logfmt
    networks:
      - knowledge_map_network
    depends_on:
      neo4j:
        condition: service_healthy
      auth:
        condition: service_started
      ai:
        condition: service_started
      nlp:
        condition: service_started
    volumes:
      - auth_proto:/shared/proto
      - ./api:/app
      - /app/__pycache__
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  billing:
    build:
      context: ./billing
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
    container_name: knowledge_map_billing
    restart: unless-stopped
    ports:
      - "50058:50058"
    environment:
      - BILLING_HOST=0.0.0.0
      - BILLING_PORT=50058
      - LOG_LEVEL=INFO
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=billing
      - LOG_FORMAT=logfmt
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - AUTH_SERVICE_HOST=auth
      - AUTH_SERVICE_PORT=50057
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - YOOKASSA_API_URL=https://api.yookassa.ru/v3
      - YOOKASSA_RETURN_URL=${YOOKASSA_RETURN_URL:-http://localhost:5555/subscription}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - RECONCILIATION_INTERVAL_SECONDS=${RECONCILIATION_INTERVAL_SECONDS:-300}
    networks:
      - knowledge_map_network
    depends_on:
      neo4j:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50058/billing/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
    container_name: knowledge_map_ai
    restart: unless-stopped
    ports:
      - "50059:50059"  # OpenAI-совместимый HTTP-шлюз AI-микросервиса
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AI_HOST=0.0.0.0
      - AI_PORT=50059
      - DEFAULT_PROVIDER=${AI_DEFAULT_PROVIDER:-yandex-ai}
      - DEFAULT_MODEL=${AI_DEFAULT_MODEL:-gpt://b1gulkghbtm74u59sakh/deepseek-v4-flash/latest}
      - YANDEX_CLOUD_FOLDER=${YANDEX_CLOUD_FOLDER:-b1gulkghbtm74u59sakh}
      - YANDEX_CLOUD_API_KEY=${YANDEX_CLOUD_API_KEY:-}
      - YANDEX_CLOUD_MODEL=${YANDEX_CLOUD_MODEL:-deepseek-v4-flash/latest}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Local GGUF-провайдер регистрируется только при ENVIRONMENT=development.
      - HF_MODEL_REPO=${HF_MODEL_REPO:-}
      - HF_GGUF_FILE=${HF_GGUF_FILE:-}
      - HUGGING_FACE_TOKEN=${HUGGING_FACE_TOKEN:-}
      - MODEL_CACHE_DIR=/app/models
      - LOCAL_CONTEXT_LENGTH=${LOCAL_CONTEXT_LENGTH:-32768}
      - LOCAL_N_GPU_LAYERS=${LOCAL_N_GPU_LAYERS:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=ai
      - LOG_FORMAT=logfmt
    networks:
      - knowledge_map_network
    volumes:
      - ./data/ai_models:/app/models
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:50059/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nlp:
    build:
      context: ./nlp
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
    container_name: knowledge_map_nlp
    restart: unless-stopped
    ports:
      - "50055:50055"
    environment:
      - NLP_HOST=0.0.0.0
      - NLP_PORT=50055
      - NLP_MAX_WORKERS=10
      - NLP_ENABLE_SPACY=true
      - NLP_ENABLE_NLTK=true
      - NLP_ENABLE_STANZA=true
      - NLP_ENABLE_UDPIPE=true
      - NLP_MIN_AGREEMENT=2
      - NLP_ENABLE_VOTING=true
      - NLP_SPACY_MODEL=ru_core_news_sm
      - NLP_STANZA_LANG=ru
      - NLP_MAX_TEXT_LENGTH=1000000
      - NLP_BATCH_SIZE=32
      - NLP_LOG_LEVEL=INFO
      - MODEL_CACHE_DIR=/app/models
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=nlp
      - LOG_FORMAT=logfmt
    networks:
      - knowledge_map_network
    volumes:
      - ./data/nlp_models:/app/models
      - ./nlp:/app
      - /app/__pycache__
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50055'); channel.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: knowledge_map_client
    restart: unless-stopped
    environment:
      OTEL_COLLECTOR_HOST: alloy
    ports:
      - "3000:80"
    networks:
      - knowledge_map_network
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo qdrant_ok >&3 && head -c0 <&3 &>/dev/null; exec 3<&-; exec 3>&-; true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  s3:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: knowledge_map_s3
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    command: server /s3_data --console-address ":9001"
    volumes:
      - ./data/s3_data:/s3_data
    networks:
      - knowledge_map_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: knowledge_map_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    networks:
      - knowledge_map_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Observability stack (OpenTelemetry → Loki / Prometheus / Tempo / Grafana) ──
  loki:
    image: grafana/loki:3.4.2
    container_name: knowledge_map_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./data/monitoring/loki:/loki
    networks:
      - knowledge_map_network

  tempo:
    image: grafana/tempo:2.7.1
    container_name: knowledge_map_tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./data/monitoring/tempo:/var/tempo
    networks:
      - knowledge_map_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: knowledge_map_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/monitoring/prometheus:/prometheus
    networks:
      - knowledge_map_network

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: knowledge_map_alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC (только localhost — для dev-процессов вне docker)
      - "127.0.0.1:4318:4318"   # OTLP HTTP (browser + dev)
      - "12345:12345"           # UI Alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/dev_logs:/dev_logs:ro
      - ./data/monitoring/alloy:/var/lib/alloy/data
    networks:
      - knowledge_map_network
    depends_on:
      - loki
      - prometheus
      - tempo

  grafana:
    image: grafana/grafana:11.3.1
    container_name: knowledge_map_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/monitoring/grafana:/var/lib/grafana
    networks:
      - knowledge_map_network
    depends_on:
      - loki
      - prometheus
      - tempo

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  s3_data:
  auth_proto:
  ai_models:

networks:
  knowledge_map_network:
    driver: bridge
