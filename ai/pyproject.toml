[project]
name = "ai"
version = "0.1.0"
description = "AI Agent microservice - OpenAI-compatible chat gateway (LM Studio, DeepSeek, ...)"
authors = [{ name = "Dobrosvet", email = "dimaprokofev@yandex.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai"
version = "0.1.0"
description = "AI Agent microservice - OpenAI-compatible chat gateway"
authors = ["Dobrosvet <dimaprokofev@yandex.ru>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.0"
uvicorn = { extras = ["standard"], version = "^0.24.0" }
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^0.23.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
