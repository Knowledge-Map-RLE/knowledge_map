apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: knowledge-map
spec:
  template:
    spec:
      containers:
        - name: neo4j
          resources:
            requests:
              memory: "8Gi"
              cpu: "4"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
