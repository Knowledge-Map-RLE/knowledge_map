apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-to-md
  namespace: knowledge-map
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: pdf-to-md
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: S3_SECRET_KEY
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: config-common
                  key: S3_BUCKET_NAME
            - name: HUGGING_FACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: HUGGING_FACE_TOKEN
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
