apiVersion: apps/v1
kind: Deployment
metadata:
  name: layout
  namespace: knowledge-map
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: layout
          resources:
            requests:
              memory: "512Mi"
              cpu: "0.5"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 60
            periodSeconds: 30
