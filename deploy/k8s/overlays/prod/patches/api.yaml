apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: knowledge-map
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: api
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DEBUG
              value: "false"
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INTERNAL_TOKEN
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: S3_SECRET_KEY
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: config-common
                  key: S3_BUCKET_NAME
            - name: BILLING_SERVICE_URL
              value: "http://billing:50058"
            - name: PDF_TO_MD_SERVICE_URL
              value: "http://pdf-to-md:8002"
            - name: API_BASE_URL
              value: "https://knowledge-map.ru"
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: config-common
                  key: ALLOWED_ORIGINS
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
