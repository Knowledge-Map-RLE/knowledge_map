apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: knowledge-map
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: client
          resources:
            requests:
              memory: "64Mi"
              cpu: "0.1"
            limits:
              memory: "128Mi"
              cpu: "0.25"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
