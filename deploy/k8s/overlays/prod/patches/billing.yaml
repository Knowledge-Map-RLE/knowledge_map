apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: knowledge-map
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: billing
          env:
            - name: YOOKASSA_SHOP_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: YOOKASSA_SHOP_ID
            - name: YOOKASSA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: YOOKASSA_SECRET_KEY
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INTERNAL_TOKEN
          resources:
            requests:
              memory: "1Gi"
              cpu: "0.5"
            limits:
              memory: "2Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /billing/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /billing/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
