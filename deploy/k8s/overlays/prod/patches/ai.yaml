apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: knowledge-map
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: ai
          env:
            - name: CLOUDRU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CLOUDRU_API_KEY
            - name: DEFAULT_PROVIDER
              value: "cloudru"
            - name: DEFAULT_MODEL
              value: "deepseek-ai/DeepSeek-V4-Flash"
            - name: CLOUDRU_MODEL
              value: "deepseek-ai/DeepSeek-V4-Flash"
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
