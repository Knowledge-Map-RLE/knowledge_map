apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-to-md
  namespace: knowledge-map
spec:
  template:
    spec:
      containers:
        - name: pdf-to-md
          resources:
            requests:
              memory: "512Mi"
              cpu: "0.25"
            limits:
              memory: "1Gi"
              cpu: "0.5"
