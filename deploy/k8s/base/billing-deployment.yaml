apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: knowledge-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
        - name: billing
          image: billing:latest
          ports:
            - containerPort: 50058
              name: http
          envFrom:
            - configMapRef:
                name: config-common
            - secretRef:
                name: app-secrets
          env:
            - name: YOOKASSA_API_URL
              value: "https://api.yookassa.ru/v3"
            - name: YOOKASSA_RETURN_URL
              value: "https://knowledge-map.ru/subscription"
            - name: RECONCILIATION_INTERVAL_SECONDS
              value: "300"
          readinessProbe:
            httpGet:
              path: /billing/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /billing/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "1Gi"
              cpu: "0.5"
            limits:
              memory: "2Gi"
              cpu: "1"
