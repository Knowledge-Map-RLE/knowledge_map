apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: knowledge-map
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.15.0
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          envFrom:
            - configMapRef:
                name: config-common
          env:
            - name: NEO4J_AUTH
              value: "neo4j/$(NEO4J_PASSWORD)"
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
            - name: NEO4J_PLUGINS
              value: '["apoc","n10s"]'
            - name: NEO4J_server_memory_heap_initial__size
              value: "3G"
            - name: NEO4J_server_memory_heap_max__size
              value: "3G"
            - name: NEO4J_server_memory_pagecache_size
              value: "3G"
            - name: NEO4J_server_bolt_tls__level
              value: "OPTIONAL"
            - name: NEO4J_dbms_security_allow__csv__import__from__file__urls
              value: "true"
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*,gds.*,n10s.*"
            - name: NEO4J_server_jvm_additional
              value: "-XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            requests:
              memory: "8Gi"
              cpu: "4"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
    - metadata:
        name: neo4j-logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
