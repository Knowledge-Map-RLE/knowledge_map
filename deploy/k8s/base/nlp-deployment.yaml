apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp
  namespace: knowledge-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nlp
  template:
    metadata:
      labels:
        app: nlp
    spec:
      containers:
        - name: nlp
          image: nlp:latest
          ports:
            - containerPort: 50055
              name: grpc
          envFrom:
            - configMapRef:
                name: config-common
            - secretRef:
                name: app-secrets
          env:
            - name: NLP_HOST
              value: "0.0.0.0"
            - name: NLP_PORT
              value: "50055"
            - name: NLP_MAX_WORKERS
              value: "10"
            - name: NLP_ENABLE_SPACY
              value: "true"
            - name: NLP_ENABLE_NLTK
              value: "false"
            - name: NLP_ENABLE_STANZA
              value: "false"
            - name: NLP_ENABLE_UDPIPE
              value: "false"
            - name: NLP_MIN_AGREEMENT
              value: "1"
            - name: NLP_ENABLE_VOTING
              value: "false"
            - name: NLP_SPACY_MODEL
              value: "en_core_sci_scibert"
            - name: NLP_MAX_TEXT_LENGTH
              value: "1000000"
            - name: NLP_BATCH_SIZE
              value: "32"
            - name: NLP_LOG_LEVEL
              value: "INFO"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: nlp-model-cache
              mountPath: /app/models
      volumes:
        - name: nlp-model-cache
          emptyDir:
            sizeLimit: 10Gi
