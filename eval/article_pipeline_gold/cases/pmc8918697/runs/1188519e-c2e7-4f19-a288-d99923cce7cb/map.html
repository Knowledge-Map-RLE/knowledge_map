 "Analysis", "start": 12698, "end": 13995}, {"id": "H11", "title": "RESULTS", "start": 13995, "end": 14011}, {"id": "H12", "title": "Study selection", "start": 14011, "end": 14651}, {"id": "H13", "title": "Study characteristics", "start": 14651, "end": 15787}, {"id": "H14", "title": "Diagnostic criteria for MCI", "start": 15787, "end": 27316}, {"id": "H15", "title": "Diagnostic criteria for dementia", "start": 27316, "end": 28048}, {"id": "H16", "title": "Conversion from MCI to dementia", "start": 28048, "end": 28968}, {"id": "H17", "title": "Risk factors for dementia", "start": 28968, "end": 29813}, {"id": "H18", "title": "Risk of bias assessment", "start": 29813, "end": 30070}, {"id": "H19", "title": "Meta‐analysis—risk of conversion to AD", "start": 30070, "end": 31412}, {"id": "H20", "title": "DISCUSSION", "start": 31412, "end": 40578}, {"id": "H21", "title": "CONFLICTS OF INTEREST", "start": 40578, "end": 43783}, {"id": "H22", "title": "AUTHOR CONTRIBUTIONS", "start": 43783, "end": 44291}, {"id": "H23", "title": "Supporting information", "start": 44291, "end": 44439}, {"id": "H24", "title": "ACKNOWLEDGMENTS", "start": 44439, "end": 45144}, {"id": "H25", "title": "DATA AVAILABILITY STATEMENT", "start": 45144, "end": 45493}], "units": [{"id": "U1", "start": 0, "end": 138, "section_id": "H1", "text": "# Risk of conversion from mild cognitive impairment to dementia in low‐ and middle‐income countries: A systematic review and meta‐analysis"}, {"id": "U2", "start": 140, "end": 232, "section_id": "H1", "text": "**Journal:** Alzheimer's & Dementia : Translational Research & Clinical Interventions (2022)"}, {"id": "U3", "start": 234, "end": 261, "section_id": "H1", "text": "**DOI:** 10.1002/trc2.12267"}, {"id": "U4", "start": 264, "end": 275, "section_id": "H2", "text": "## Abstract"}, {"id": "U5", "start": 277, "end": 578, "section_id": "H2", "text": "With no treatment for dementia, there is a need to identify high risk cases to focus preventive strategies, particularly in low‐ and middle‐income countries (LMICs) where the burden of dementia is greatest. We evaluated the risk of conversion from mild cognitive ompairment (MCI) to dementia in LMICs."}, {"id": "U6", "start": 580, "end": 919, "section_id": "H2", "text": "Medline, Embase, PsycINFO, and Scopus were searched from inception until June 30, 2020. The search was restricted to observational studies, conducted in population‐based samples, with at least 1 year follow‐up. There was no restriction on the definition of MCI used as long as it was clearly defined. PROSPERO registration: CRD42019130958."}, {"id": "U7", "start": 921, "end": 1758, "section_id": "H2", "text": "Ten thousand six hundred forty‐seven articles were screened; n = 11 retained. Of the 11 studies, most were conducted in China (n = 7 studies), with only two studies from countries classified as low income. A qualitative analysis of n = 11 studies showed that similar to high‐income countries the conversion rate to dementia from MCI was variable (range 6.0%–44.8%; average follow‐up 3.7 years [standard deviation = 1.2]). A meta‐analysis of studies using Petersen criteria (n = 6 studies), found a pooled conversion rate to Alzheimer's disease (AD) of 23.8% (95% confidence interval = 15.4%–33.4%); approximately one in four people with MCI were at risk of AD in LMICs (over 3.0–5.8 years follow‐up). Risk factors for conversion from MCI to dementia included demographic (e.g., age) and health (e.g., cardio‐metabolic disease) variables."}, {"id": "U8", "start": 1760, "end": 2305, "section_id": "H2", "text": "MCI is associated with high, but variable, conversion to dementia in LMICs and may be influenced by demographic and health factors. There is a notable absence of data from low‐income settings and countries outside of China. This highlights the urgent need for research investment into aging and dementia in LMIC settings. Being able to identify those individuals with cognitive impairment who are at highest risk of dementia in LMICs is necessary for the development of risk reduction strategies that are contextualized to these unique settings."}, {"id": "U9", "start": 2307, "end": 2400, "section_id": "H2", "text": "Keywords: dementia, low‐ and middle‐income countries, mild cognitive impairment, risk factors"}, {"id": "U10", "start": 2403, "end": 2418, "section_id": "H3", "text": "## INTRODUCTION"}, {"id": "U11", "start": 2420, "end": 2422, "section_id": "H3", "text": "1."}, {"id": "U12", "start": 2424, "end": 3609, "section_id": "H3", "text": "Mild cognitive impairment (MCI) defines an intermediate cognitive state between normal aging and dementia and is a target for dementia prevention and risk reduction research.\n1\n, \n2\n Numerous definitions for MCI exist and prevalence estimates vary (range \u003c 1% to > 50%) depending on the population sampled (e.g., the age/sex distribution of participants, clinical‐based sample vs. individuals recruited from population‐based settings), MCI case definition, and operationalization of the component criterion for an MCI case diagnosis.\n3\n, \n4\n, \n5\n, \n6\n, \n7\n, \n8\n Further, within high‐income countries (HICs), the rates of conversion from MCI (across different subtypes) to dementia vary (range 10%–15% annually).\n5\n, \n6\n, \n7\n Although some cases remain stable, others can revert to normal, with studies suggesting reversion ranges of 4% to 15% in clinic‐based samples\n8\n, \n9\n, \n10\n, \n11\n and 29% to 55% in population‐based samples.\n12\n, \n13\n, \n14\n, \n15\n In the absence of a cure for dementia, understanding the likelihood of, and risk factors associated with, conversion to dementia among MCI cases is important to help identify strategies for dementia risk reduction and prevention.\n16"}, {"id": "U13", "start": 3611, "end": 4426, "section_id": "H3", "text": "The definition of MCI can be a difficult concept to disentangle. One of the most widely applied set of criteria, in clinical and research practice, are those defined by Petersen et al., describing patients with subjective memory loss verified by neuropsychological testing, with no significant impairment in other cognitive domains, no functional impairments, and no dementia.\n17\n Other similar criteria have also been developed and applied including, for example, from the International Working Group,\n18\n National Institute on Aging–Alzheimer's Association (NIA‐AA),\n19\n and the American Psychiatric Association (Diagnostic and Statistical Manual of Mental Disorders, 4th Edition [DSM‐IV]).\n20\n MCI is therefore an evolving concept, with varying definitions, which can make cross‐study comparisons challenging.\n21"}, {"id": "U14", "start": 4428, "end": 5620, "section_id": "H3", "text": "While some have suggested that MCI as a method for classification of prodromal dementia can have a limited role in clinical and epidemiological settings, others argue that MCI could be a pragmatic tool for identifying individuals who could benefit from risk reduction.\n22\n Modifiable risk factors for MCI and its conversion to dementia include health and lifestyle factors such as an unhealthy diet (e.g., a diet high in saturated fat, sugar, and salt), physical inactivity, smoking, cardiometabolic diseases (e.g., coronary heart disease and diabetes) and their risks including obesity and hypertension.\n23\n, \n30\n The literature on risk of conversion to dementia predominantly refers to MCI classified using Petersen criteria. \n24\n As discussed, with the multiple definitions of MCI available, this can make comparisons challenging. That said, this evidence highlights the potential for risk reduction and possible prevention or delay of dementia onset in MCI cases. Indeed, a recent report indicated that 21.7% of MCI cases that progress to dementia are potentially preventable, by targeting diet (using obesity as a proxy) (8.7%), diabetes (1.5%), and neuropsychiatric symptoms (11.5%).\n23"}, {"id": "U15", "start": 5622, "end": 6292, "section_id": "H3", "text": "Compared to HICs, very few studies on MCI have been conducted in low‐ and middle‐income countries (LMICs).\n4\n Extending the findings from a recent systematic review on MCI prevalence in LMICs,\n4\n the aim of this systematic review and meta‐analysis was to identify and review longitudinal population‐based studies reporting on the risk of conversion from MCI to dementia in LMICs. The focus was on the rate of conversion and associated risk factors. Given that nearly two‐thirds of people with dementia live in LMICs\n25\n identifying those individuals at highest risk is important for targeted interventions focused on reducing the burden of dementia in these settings.\n26"}, {"id": "U16", "start": 6295, "end": 6305, "section_id": "H4", "text": "## METHODS"}, {"id": "U17", "start": 6307, "end": 6309, "section_id": "H4", "text": "2."}, {"id": "U18", "start": 6311, "end": 6612, "section_id": "H4", "text": "This systematic review and meta‐analysis was conducted according to the PRISMA (Preferred Reporting Items for Systematic Reviews and Meta‐Analyses) guidelines (Appendix A.1 in supporting information).\n27\n The study protocol was registered on the PROSPERO database (registration number CRD42019130958)."}, {"id": "U19", "start": 6614, "end": 6658, "section_id": "H5", "text": "### Search strategy and eligibility criteria"}, {"id": "U20", "start": 6660, "end": 6664, "section_id": "H5", "text": "2.1."}, {"id": "U21", "start": 6666, "end": 7104, "section_id": "H5", "text": "Four commonly used, comprehensive medical databases were searched electronically from inception until April 30, 2019. A second electronic database search was conducted from May 1, 2019 to June 30, 2020. The selected databases were: Medline; Embase; PsycINFO, assessed via Ovid (https://ovidsp.ovid.com); and Scopus (https://www.Scopus.com/home.uri). A detailed description of the search strategy is provided in the supporting information."}, {"id": "U22", "start": 7106, "end": 8827, "section_id": "H5", "text": "The search was restricted to observational studies, conducted in population‐based samples, with at least 1 year of follow‐up. Participants were those with a diagnosis of MCI according to internationally accepted and validated classifications.\n1\n, \n17\n, \n18\n, \n19\n, \n28\n, \n29\n Studies which included participants with “memory problems” or “self‐reported memory complaints” and no clear diagnosis of MCI were excluded. To be eligible, MCI participants had to be followed during the study period for risk of dementia; diagnosed according to established criteria, for example, National Institute of Neurological Disorders and Stroke–Alzheimer's Disease and Related Disorders Association (NINCDS‐ADRDA) criteria,\n30\n DSM‐IV criteria,\n20\n, \n31\n or Neuro‐epidemiology Branch of the International Workshop of the National Institute of Neurological Disorders and Stroke with support from the Association Internationale pour la Recherche et l'Enseignement en Neurosciences (NINDS‐AIREN) criteria.\n32\n All‐cause dementia and its subtypes (e.g., Alzheimer's disease [AD] and vascular dementia) were included. Studies that combined participants with MCI with another level of cognitive status at baseline (e.g., cognitively healthy or dementia), were only included if the MCI group data were analyzed and presented separately. Studies were excluded where the MCI sample was stratified by disease status (e.g., diabetes) and rates of conversion were not reported for the total population. Studies were required to be from a LMIC as per the Organisation for Economic Co‐operation and Development (OECD) criteria and World Bank classification, with inclusion based on the income status of the country at the time the study was conducted."}, {"id": "U23", "start": 8829, "end": 8853, "section_id": "H6", "text": "#### Research in context"}, {"id": "U24", "start": 8855, "end": 9234, "section_id": "H6", "text": "- Systematic Review: Medline, Embase, Scopus, and PsycINFO were searched for eligible articles reporting on conversion from mild cognitive impairment (MCI) to dementia in population‐ or community‐based studies from low and middle‐income countries (LMICs). The search strategy included terms that encompassed “dementia,” “mild cognitive impairment,” “incidence,” and “conversion.”"}, {"id": "U25", "start": 9236, "end": 9875, "section_id": "H6", "text": "- Interpretation: This is the first study to synthesize research on the risk of conversion to dementia in people with MCI in LMIC settings. We found that very few studies on risk of dementia in MCI cases have been undertaken in LMICs. Across the 11 studies, conversion to dementia was high and ranged from 6.0% to 44.8% over an average follow‐up of 3.7 years. A meta‐analysis of studies using Petersen criteria (n = 6 studies), found a pooled conversion rate to Alzheimer's disease (AD) of 23.8% (95% confidence interval = 15.4%–33.4%); approximately one in four people with MCI were at risk of AD in LMICs over 3.0 to 5.8 years follow‐up."}, {"id": "U26", "start": 9877, "end": 10518, "section_id": "H6", "text": "- Future Directions: Like findings from high‐income countries, MCI is associated with increased risk of conversion to dementia in LMIC. There was, however, large heterogeneity in study methodology including definition of MCI, operationalization of MCI criterion, follow‐up time, and diagnosis of dementia as well as a scarcity of studies from countries classed as low income. There is an urgent need for LMICs to invest in the collection of robust, population‐based data, to determine the best strategies for identifying those individuals at highest dementia risk to inform the development of dementia risk reduction plans in these settings."}, {"id": "U27", "start": 10523, "end": 10544, "section_id": "H7", "text": "### Screening process"}, {"id": "U28", "start": 10546, "end": 10550, "section_id": "H7", "text": "2.2."}, {"id": "U29", "start": 10552, "end": 11170, "section_id": "H7", "text": "Two reviewers independently assessed potentially relevant articles for eligibility (AMM and EP). The decision to include or exclude studies was hierarchical and initially made based on the study title and abstract to eliminate obviously irrelevant studies (see Figure 1). When a study's title/abstract could not be rejected with certainty, the full text of the article was obtained for evaluation. Discrepancies between reviewers were resolved by a third reviewer (BCMS). Next, full‐text articles were searched. In addition, the reference lists of all included articles were checked for any potentially missing papers."}, {"id": "U30", "start": 11173, "end": 11332, "section_id": "H7", "text": "\u003cfigure>\n  \u003cfigcaption>\u003cstrong>FIGURE 1\u003c/strong> Study selection. LMIC, low‐ and middle‐income countries; MCI, mild cognitive impairment\u003c/figcaption>\n\u003c/figure>"}, {"id": "U31", "start": 11335, "end": 11494, "section_id": "H7", "text": "\u003cfigure>\n  \u003cfigcaption>\u003cstrong>FIGURE 1\u003c/strong> Study selection. LMIC, low‐ and middle‐income countries; MCI, mild cognitive impairment\u003c/figcaption>\n\u003c/figure>"}, {"id": "U32", "start": 11497, "end": 11516, "section_id": "H8", "text": "### Data extraction"}, {"id": "U33", "start": 11518, "end": 11522, "section_id": "H8", "text": "2.3."}, {"id": "U34", "start": 11524, "end": 12224, "section_id": "H8", "text": "A standardized form was used to extract data from the included studies for assessment of study quality and evidence synthesis. Extracted data included information on: (1) author and year of publication, (2) country, (3) age, (4) sample size, (5) follow‐up duration, (6) MCI and dementia diagnostic criteria, (7) analytical method for determining rate of conversion including loss to follow‐up, (8) results of conversion from MCI to dementia, and (9) risk factors for conversion to dementia (including details of all risk factors assessed—both significant and non‐significant). One author extracted data (EP), and a second checked the extraction (AMM). A third author (BCM) reviewed any discrepancies."}, {"id": "U35", "start": 12227, "end": 12254, "section_id": "H9", "text": "### Risk of bias assessment"}, {"id": "U36", "start": 12256, "end": 12260, "section_id": "H9", "text": "2.4."}, {"id": "U37", "start": 12262, "end": 12695, "section_id": "H9", "text": "Quality assessment was guided by the Newcastle–Ottawa Scale for cohort studies.\n33\n Risk of bias was assessed on three main categories: selection, comparability, and outcome. The maximum possible score was 8; three stars for selection, two stars for comparability, and two stars for outcome. Two authors (AMM and EP) independently assessed risk of bias, with any disagreement resolved by discussion with a third assessor if required."}, {"id": "U38", "start": 12698, "end": 12710, "section_id": "H10", "text": "### Analysis"}, {"id": "U39", "start": 12712, "end": 12716, "section_id": "H10", "text": "2.5."}, {"id": "U40", "start": 12718, "end": 13113, "section_id": "H10", "text": "For each study, we report the proportion of MCI cases that converted to dementia for each definition of MCI separately. This was calculated as the ratio of those who converted to dementia over the total sample size. We also report on the key risk factors significantly associated with an increased risk of dementia. Details of all risk factors assessed are in Table S2 in supporting information."}, {"id": "U41", "start": 13115, "end": 13991, "section_id": "H10", "text": "Where there were multiple studies using the same criteria to diagnosis MCI and dementia, a meta‐analysis was undertaken. This was only possible for studies that diagnosed MCI using Petersen‐type criteria with an outcome of AD (n = 6 studies). The analysis was run in Stata using the Metaprop command to compute the meta‐analysis of pooled proportions. This allows computation of 95% confidence intervals (95% CI) using the score statistic and the exact binomial method and incorporates the Freeman‐Tukey double arcsine transformation of proportions to compute the weighted pooled estimate for normality assumptions. The program also allows the within‐study variability to be modeled using the binomial distribution.\n34\n Given large differences in the design and sampling across studies, the random effects model was computed. Heterogeneity was assessed using the I2 statistic."}, {"id": "U42", "start": 13995, "end": 14005, "section_id": "H11", "text": "## RESULTS"}, {"id": "U43", "start": 14007, "end": 14009, "section_id": "H11", "text": "3."}, {"id": "U44", "start": 14011, "end": 14030, "section_id": "H12", "text": "### Study selection"}, {"id": "U45", "start": 14032, "end": 14036, "section_id": "H12", "text": "3.1."}, {"id": "U46", "start": 14038, "end": 14648, "section_id": "H12", "text": "From the electronic search, the titles and abstracts of 8977 publications were screened, and the full texts of 87 articles reviewed. The screening and study selection process is illustrated in the PRISMA flow diagram (Figure 1). Nine articles met the eligibility criteria. The most common reasons for exclusion were that the study was not from a LMIC, the sample was not population‐based, and the study did not report incident dementia. A second search conducted in June 2020 identified a further 1670 articles, from which two studies were eligible for inclusion. Thus, 11 articles are included in this review."}, {"id": "U47", "start": 14651, "end": 14676, "section_id": "H13", "text": "### Study characteristics"}, {"id": "U48", "start": 14678, "end": 14682, "section_id": "H13", "text": "3.2."}, {"id": "U49", "start": 14684, "end": 15784, "section_id": "H13", "text": "Of the 11 studies, most were conducted in China (n = 7 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n39\n, \n40\n, \n41\n followed by Brazil (n = 2 studies),\n42\n, \n43\n Nigeria (n = 1 study\n44\n),\n44\n and Tanzania (n = 1 study).\n45\n Only one study was nationally representative using census data from Rio Grande do Sul, Brazil.\n42\n At the time of participant recruitment, two studies\n44\n, \n45\n were from low‐income countries while the majority (n = 9 studies)\n35\n, \n36\n, \n37\n, \n38\n, \n39\n, \n40\n, \n41\n, \n42\n, \n43\n were from middle‐income countries. MCI sample size at baseline ranged from n = 21\n42\n to n = 837,\n35\n with a mean of n = 370 (standard deviation [SD] = 295). Most studies included participants aged > 60 years (n = 6 studies),\n37\n, \n38\n, \n39\n, \n40\n, \n41\n, \n42\n while others included those > 55 years (n = 2 studies),\n35\n, \n36\n > 65 years (n = 1 study),\n44\n and > 70 years (n = 2 studies).\n43\n, \n45\n Duration of follow‐up ranged from 2 years\n44\n to 5.8 years,\n42\n with a mean of 3.7 years (SD = 1.1 year). At follow‐up, MCI sample size ranged from n = 21\n42\n to n = 638,\n35\n with a mean of n = 298 (SD = 238)."}, {"id": "U50", "start": 15787, "end": 15818, "section_id": "H14", "text": "### Diagnostic criteria for MCI"}, {"id": "U51", "start": 15820, "end": 15824, "section_id": "H14", "text": "3.3."}, {"id": "U52", "start": 15826, "end": 16015, "section_id": "H14", "text": "Most studies diagnosed MCI using Petersen criteria\n17\n, \n28\n, \n46\n, \n47\n (n = 5 studies).\n35\n, \n36\n, \n38\n, \n40\n, \n41\n Other criteria included the Clinical Dementia Rating scale (CDR 0.5;\n48"}, {"id": "U53", "start": 16017, "end": 17050, "section_id": "H14", "text": "n = 1 study),\n43\n Dubois 2004 criteria\n49\n (n = 1 study), \n42\n the criteria from the DSM‐IV\n31\n (n = 2 studies),\n37\n, \n39\n and the International Working Group on MCI criteria\n18\n (n = 1 study).\n45\n Only 1 study\n44\n used the Cognitive Impairment No Dementia (CIND) classification.\n50\n This paper\n44\n reports that of the n = 87 CIND participants, n = 74 were classed as having “medically unexplained memory loss” (MUML) described as comparable to MCI using Petersen criteria.\n51\n For this review, the total sample of n = 87 CIND participants were included. Table 1 shows a description of the MCI diagnostic criteria used across the different studies. The majority of studies classified participants as MCI (n = 9 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n40\n, \n41\n, \n42\n, \n43\n, \n45\n while others subtyped MCI into amnestic MCI (aMCI; n = 2 studies), \n39\n, \n41\n aMCI single domain (n = 1 study),\n41\n aMCI multiple domain (n = 1 study),\n41\n non‐amnestic MCI single domain (n = 1 study),\n41\n and non‐amnestic MCI multiple domain (n = 1 study).\n41"}, {"id": "U54", "start": 17053, "end": 17145, "section_id": "H14", "text": "**TABLE 1** Study characteristics (grouped by criteria for MCI diagnosis and ordered by age)"}, {"id": "U55", "start": 17148, "end": 26527, "section_id": "H14", "text": "\u003ctable>\n  \u003cthead>\n    \u003ctr>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"3\">Sample size\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n    \u003c/tr>\n    \u003ctr>\n      \u003cth rowspan=\"1\" colspan=\"1\">Reference\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Country\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Population characteristics\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Age (years)\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Total sample at baseline\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">MCI sample\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">MCI sample at follow up\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Mean Follow‐up (years)\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">MCI Type\u003c/th>\n      \u003cth after 3 year follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Yu et al. 38\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">8 geographically convenient communities in Taiyuan city, China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;60\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">6192\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">600\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">518\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">5\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">NINCDS‐ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">17·0% (89/518) (after 5 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">CIND based on Levy and Working Party of the International Psychogeriatric Association in collaboration with the WHO 50  (n = 1 study)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Baiyewu et al. 44\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Nigeria\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Idikan community and adjacent wards of the city of Ibadan, Nigeria\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;65\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">2487\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">152\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">87\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">2\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">CIND\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM III‐R ICD‐10 (all cause)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">16·1% (14/87) developed dementia (after 2 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">CDR 82  (n = 1 study)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Montano et al. 43\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Brazil\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">A community cohort living in an urban district, in São Paulo city\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;70\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">1667\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">80\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">40\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">2.6\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">CDR 0.5\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">NINCDS–ADRDA (all cause)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">37·5% (145.4 per 1,000 person‐years; 15/40) (after follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">IWG 18  (n = 1 study)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Paddick et al. 45\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Tanzania\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">6 randomly selected villages from the Hai District in Northern Tanzania.\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;70\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">296\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">46\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">46\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">4\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV (all cause) NINCDS‐ADRDA (AD) NINDS‐ AIREN (VaD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">37·0% (17/46) all cause (n = 9 AD, n = 4 VaD, n = 2 Parkinson disease dementia &amp; n = 2 mixed aetiology) (after 4 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">DSM‐IV Criteria 31  (n = 2 studies)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Yu et al. 37\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">26 military cadres’ sanatoriums of Shijiazhuang city\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;60\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">2674\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">216\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">209\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">3\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV (all cause) NINCDS‐ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">24·4% (51/209) all cause 15·7% (35/209) AD (per year)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Wang et al. 39\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">9 densely distributed elderly communities in Taiyuan\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;65\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">6152\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">600\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">557\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">3\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">aMCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">NINCDS‐ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">6% (34/557 per year)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">Dubois and Albert, 2004 49  (n = 1 study)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Godhino et al. 42\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Brazil\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Older community dwelling residents in the catchment area of the Hospital de Clinicas de Porto Alegre, Rio Grande do Sul, Brazil\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;60\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">245\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">21\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">21\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">5.8\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV &amp; NINCDS‐ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">38·1% (8/21) (after 5.8 years follow up)\u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>"}, {"id": "U56", "start": 26529, "end": 27313, "section_id": "H14", "text": "Abbreviations: AD, Alzheimer's disease; aMCI, amnestic mild cognitive impairment; CIND, cognitive impairment no dementia; CDR, Clinical Dementia Rating; DSM‐IV, Diagnostic and Statistical Manual of Mental Disorders Fourth Edition; ICD, International Classification of Diseases; IWG, International Working Group; MCI, mild cognitive impairment; NIA‐AA, National Institute on Aging and Alzheimer's Association; NINCDS‐ADRDA, National Institute of Neurological Disorders and Stroke‐Alzheimer's Disease and Related Disorders Association; NINDS‐AIREN, National Institute of Neurological Disorders and Stroke International Workshop with support from the Association Internationale pour la Recherche et l'Enseignement en Neurosciences; VaD, vascular dementia; WHO, World Health Organization."}, {"id": "U57", "start": 27316, "end": 27352, "section_id": "H15", "text": "### Diagnostic criteria for dementia"}, {"id": "U58", "start": 27354, "end": 27358, "section_id": "H15", "text": "3.4."}, {"id": "U59", "start": 27360, "end": 28045, "section_id": "H15", "text": "Most studies (n = 7 studies)\n35\n, \n36\n, \n37\n, \n40\n, \n41\n, \n42\n, \n45\n defined incident dementia using the DSM‐IV criteria.\n20\n, \n31\n This was followed by NINCDS‐ADRDA criteria\n49\n, \n52\n (n = 5 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n39\n the NINDS‐AIREN criteria\n32\n (n = 2 studies),\n35\n, \n36\n and DSM‐III‐R criteria\n20\n (n = 1 study\n44\n).\n44\n Studies defined dementia as either all‐cause (n = 7 studies),\n35\n, \n36\n, \n37\n, \n41\n, \n43\n, \n44\n, \n45\n AD (n = 8 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n39\n, \n40\n, \n42\n, \n45\n or vascular dementia (VaD; n = 2 studies). \n36\n, \n45\n One study\n44\n mentioned using International Classification of Diseases (ICD)‐10 criteria from the World Health Organization.\n53"}, {"id": "U60", "start": 28048, "end": 28083, "section_id": "H16", "text": "### Conversion from MCI to dementia"}, {"id": "U61", "start": 28085, "end": 28089, "section_id": "H16", "text": "3.5."}, {"id": "U62", "start": 28091, "end": 28965, "section_id": "H16", "text": "Rates of conversion from MCI to dementia ranged from 6.0%\n39\n to 44.8%\n35\n for all‐cause dementia (n = 11 studies) over an average follow‐up of 3.7 years (SD 1.2 years); 6.0%\n35\n, \n39\n to 46.7%\n25\n for AD (n = 8 studies) over an average follow‐up of 4.0 years (SD 1.1 years), and 8.7%\n45\n to 14.9%\n36\n for VaD (n = 2 studies) over an average follow‐up of 3.5 years (SD 0.7 years). Rates of conversion to all‐cause dementia were generally higher for those definitions that captured broader impairment; for example, range of conversion for all‐MCI (n = 8 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n40\n, \n41\n, \n42\n, \n45\n CIND (n = 1 study),\n44\n and CDR (n = 1 study)\n43\n (range 16.8% to 44.8% over 2.0–5.8 years follow‐up) compared to more restricted definitions of single domain MCI; for example, aMCI range 6.0% to 6.9% over an average of 3.5 years follow‐up (n = 2 studies).\n39\n, \n41"}, {"id": "U63", "start": 28968, "end": 28997, "section_id": "H17", "text": "### Risk factors for dementia"}, {"id": "U64", "start": 28999, "end": 29003, "section_id": "H17", "text": "3.6."}, {"id": "U65", "start": 29005, "end": 29810, "section_id": "H17", "text": "Risk factors for MCI conversion to dementia were investigated in 10 (out of 11) studies.\n35\n, \n36\n, \n38\n, \n39\n, \n40\n, \n41\n, \n42\n, \n43\n, \n44\n, \n45\n Significant risks included older age (n = 6/10 studies\n19\n, \n35\n, \n38\n, \n39\n, \n40\n, \n41\n, \n44\n), poor baseline performance on cognitive tests (n = 5/7 studies\n36\n, \n40\n, \n41\n, \n42\n, \n43\n), sex (being female; n = 3/10 studies\n35\n, \n38\n, \n44\n), hypertension (n = 3/6 studies\n35\n, \n38\n, \n39\n), low educational attainment (illiteracy or primary school; n = 2/10 studies\n35\n, \n36\n), anxiety and depression (n = 2/5 studies\n39\n, \n40\n), history of stroke (n = 1/4 studies\n36\n), diabetes (n = 2/4 studies\n35\n, \n39\n), and apolipoprotein E (APOE) ε4 status (n = 2/4 studies\n35\n, \n39\n). Full details of all risk factors assessed in each study are presented in Table S2."}, {"id": "U66", "start": 29813, "end": 29840, "section_id": "H18", "text": "### Risk of bias assessment"}, {"id": "U67", "start": 29842, "end": 29846, "section_id": "H18", "text": "3.7."}, {"id": "U68", "start": 29848, "end": 30067, "section_id": "H18", "text": "Full details of the risk of bias assessment can be found in Table S3 in supporting information. The included studies averaged 7.3 stars out of 10 (range 5–8). Eight studies (out of 11) scored the maximum of eight stars."}, {"id": "U69", "start": 30070, "end": 30112, "section_id": "H19", "text": "### Meta‐analysis—risk of conversion to AD"}, {"id": "U70", "start": 30114, "end": 30118, "section_id": "H19", "text": "3.8."}, {"id": "U71", "start": 30120, "end": 30896, "section_id": "H19", "text": "Six studies were included in the meta‐analysis; n = 4 from China\n35\n, \n36\n, \n38\n, \n40\n and n = 1 each from Tanzania\n45\n and Brazil.\n42\n Across the six studies, MCI sample size ranged from n = 21\n42\n to n = 837\n35\n and age from > 55 years\n35\n, \n36\n to > 70 years.\n45\n Figure 2 presents the study‐specific proportion of Petersen‐defined MCI cases that converted to AD over time with 95% CIs for each study as well as the Chinese subgroup and overall pooled estimate with 95% Wald confidence interval and the I2 statistics. As shown, significant intra‐group heterogeneity among China‐based studies was observed (P \u003c .0001 with I2 = 96.54%). When pooling the six studies together conversion to dementia was estimated at 23..8% (95% CI = 15.4%–33.4%) over a range of 3.0–5.8 years."}, {"id": "U72", "start": 30899, "end": 31152, "section_id": "H19", "text": "\u003cfigure>\n  \u003cfigcaption>\u003cstrong>FIGURE 2\u003c/strong> Forest plot showing the meta‐analysis of the proportion of the mild cognitive impairment converting to Alzheimer&#x27;s disease. CI, confidence interval; Effect Size (ES), xxxxxxxxx\u003c/figcaption>\n\u003c/figure>"}, {"id": "U73", "start": 31155, "end": 31408, "section_id": "H19", "text": "\u003cfigure>\n  \u003cfigcaption>\u003cstrong>FIGURE 2\u003c/strong> Forest plot showing the meta‐analysis of the proportion of the mild cognitive impairment converting to Alzheimer&#x27;s disease. CI, confidence interval; Effect Size (ES), xxxxxxxxx\u003c/figcaption>\n\u003c/figure>"}, {"id": "U74", "start": 31412, "end": 31425, "section_id": "H20", "text": "## DISCUSSION"}, {"id": "U75", "start": 31427, "end": 31429, "section_id": "H20", "text": "4."}, {"id": "U76", "start": 31431, "end": 32187, "section_id": "H20", "text": "In this systematic review and meta‐analysis, we found that very few studies on risk of MCI conversion to dementia have been undertaken in LMIC settings. This contrasts to the significant research investment into MCI (and more specially dementia) in HICs. Across the 11 studies, conversion to all‐cause dementia (including all dementia, AD, and VaD) was high and varied, ranging from 6.0% to 44.8% over an average follow‐up of 3,7 years. Similar variability in risk of conversion to dementia has been reported in studies from HICs.\n5\n, \n6\n, \n7\n For studies using Petersen criteria (n = 6), the pooled conversion rate to AD was 23.8% over 3.0 to 5.8 years. This suggesting that approximately one in four people with MCI are at risk of developing AD in LMICs."}, {"id": "U77", "start": 32189, "end": 33426, "section_id": "H20", "text": "While risk of dementia in MCI has been studied extensively in HICs, in contrast very little research has been undertaken in LMIC settings. Further, the majority of studies were from China (middle‐income) with data from only three other countries represented including Brazil\n42\n, \n43\n (upper middle income), Nigeria\n44\n (lower middle income), and Tanzania\n45\n (low income). Limited resources for research, including access to funding, and infrastructure to diagnose MCI/dementia in LMIC settings could be possible reasons for this scarcity. However, this is a significant research gap particularly considering the high burden of cognitive impairment and dementia in low‐income country settings.\n25\n Of the studies included in this review, there was also variability in terms of outcome measure (all‐cause dementia vs. AD vs. VaD), length of follow‐up, sample size, and diagnostic criteria for MCI. In addition, the examination of MCI conversion to other dementia subtypes was limited as only AD and VaD were investigated. Therefore, there is an urgent need for future studies to attempt to standardize the methodology used to allow for better cross‐study comparisons, aiming for studies to be population representative and generalizable."}, {"id": "U78", "start": 33428, "end": 34528, "section_id": "H20", "text": "Studies from HICs estimate annual conversion from MCI (irrespective of MCI definition used) to dementia at approximately 3% to 10% in community settings and 10% to 15% in clinical settings.\n5\n, \n16\n, \n17\n, \n18\n, \n54\n Similar to findings from HCIs, conversion rates were found to be variable across the different LMICs sites ranging from 6.0% to 44.8%. Rates of conversion to dementia were generally higher for those definitions that capture broader impairment (e.g., range of conversion for all‐MCI, CIND, and CDR: range 16.8% to 44.8% over 2.0–5.8 years follow‐up) compared to more restricted definitions of single domain MCI (e.g., aMCI range 6.0% to 6.9% over an average of 3.5 years follow‐up).\n55\n, \n56\n, \n57\n, \n58\n, \n59\n, \n60\n, \n61\n Given the high reported prevalence of MCI in LMIC settings\n4\n in addition to the high dementia conversion rates reported here, the development of strategies to prevent or delay dementia progression in those individuals with cognitive impairment could have a significant impact on the burden of disease associated with mental health conditions in these settings."}, {"id": "U79", "start": 34530, "end": 36215, "section_id": "H20", "text": "Similar to findings from HICs, non‐modifiable risk factors for progression to dementia from MCI included age\n62\n, \n63\n, \n64\n, \n65\n and APOE ε4 allele status.\n51\n, \n66\n, \n67\n Regarding sex, while being female has been found to be associated with increased risk of prevalent MCI,\n4\n and has been associated with higher risk of progression to dementia in HICs,\n68\n only 2 studies\n38\n, \n44\n out of 10 that investigated sex effects found that being female was a risk factor for conversion from MCI to dementia. Research evidence, predominantly from HICs, suggests a putative link between sex and/or educational attainment and cognition.\n69\n, \n70\n, \n71\n, \n72\n However, methodological weaknesses and potential of reverse causality within these studies adds limitations to their interpretation and warrants longitudinal studies with longer follow‐up.\n71\n Furthermore, key modifiable risk factors were also similar to those reported in HIC settings, including poor cardiometabolic health, the presence of vascular risk factors, and poor neuro‐psychiatric health such as the presence of depression.\n23\n, \n62\n, \n73\n Targeting these factors could be an early strategy for not only preventing MCI, but also reducing the burden of dementia. Research evidence suggests that up to 40% of dementia cases may be preventable through targeting 12 modifiable risk factors,\n74\n many of which can be influenced by diet and lifestyle practices.\n75\n, \n76\n Emerging evidence also indicates that non‐pharmacological interventions such as cognitive training may reduce dementia risk.\n77\n Further work is required to identify if these strategies are plausible for those with MCI, and feasible within LMIC settings."}, {"id": "U80", "start": 36217, "end": 39206, "section_id": "H20", "text": "This is the first study to synthesize research on the risk of dementia in people with MCI in LMIC settings. We undertook a wide literature search capturing many of the different definitions of MCI and included studies of all‐cause dementia and its subtypes. While there was variability in how dementia was diagnosed, most (63.6%) studies used DMS‐IV criteria. However, there are some limitations. The electronic search was undertaken in English and therefore studies published in other languages, including those common in LMICs such as Spanish, Portuguese, and French could have been missed. Although we used a wide search strategy to ensure that we captured all studies on the topic, we did not search the gray literature, which could have resulted in missing non‐published studies highlighting a risk of publication bias. Only a limited number of studies were identified and only one study was from a nationally representative sample.\n42\n This makes it hard to generalize the results especially across different LMIC settings particularly LMIC countries in Eastern Europe, the Middle East, and Global South where no data are currently available. While most studies were associated with low risk of bias, there was variability in study robustness, for example, in terms of MCI diagnosis (including cognitive test used), sample size, and participant selection. While all studies were population‐ or community‐based, there was large heterogeneity in study methodology including definition of MCI, operationalization of MCI criterion, follow‐up time, reporting of conversion rates (annually vs. after number of years of follow‐up), and diagnosis of dementia, all of which could impact the results. In addition, due to the small number of studies included it was not possible to stratify the meta‐analysis by age or follow‐up duration. Last, we should emphasize that the studies in the meta‐analysis are limited to a few studies from three countries only, with different characteristics and profiles of the population. Indeed, heterogeneity was high and possibly reflects differences in sample selection, sample characteristics (age and sex distribution), sample size, and operationalization of MCI criteria (Figure S1 in supporting information). The results support calls for an urgent need to harmonize methodology in MCI and dementia research to improve cross‐study comparability.\n78\n Indeed, future studies could draw on current recommendations\n78\n for harmonization in the methods of conducting dementia and MCI work and intelligent data synthesis in HICs as well as specifically in LMICs including the 10/66 Study protocol\n79\n and the Harmonized Cognitive Assessment Protocol (HCAP),\n80\n all of which outline recommendations for cognitive assessment tools and interviewing methods to improve cross‐study comparability. Until there is agreed‐upon methodology for MCI/dementia research globally, evidence synthesis findings, such as the findings here, should be interpreted with caution."}, {"id": "U81", "start": 39208, "end": 39823, "section_id": "H20", "text": "There is an urgent need for research investment into robust, population‐representative studies focused on risk of cognitive impairment and dementia in LMICs using harmonized methodology.\n78\n This is necessary to make it possible to campaign for prioritization of funding toward cognitive screening and risk reduction. This would also allow investment in better education and development of infrastructure in these settings to improve knowledge of diagnosis and risk factor management, but also facilitate the implementation of more population representative, robust studies, particularly in countries of low income."}, {"id": "U82", "start": 39825, "end": 40575, "section_id": "H20", "text": "Two‐thirds of people with dementia live in LMICs, where resources, services, research, and support for older age care are limited and often non‐existent. While dementia is currently incurable, results from HICs suggest that early interventions focused on reducing risk could lessen the number of people who develop dementia in the future. This would result in major health benefits and reduced public spending. As highlighted by this review little comparative data on MCI exists in LMIC settings. The results suggest that MCI is associated with risk of conversion to dementia in LMICs and may be influenced by demographic (e.g., age) and health (e.g., cardiometabolic disease) factors, but more research is needed particularly in low‐income settings."}, {"id": "U83", "start": 40578, "end": 40602, "section_id": "H21", "text": "## CONFLICTS OF INTEREST"}, {"id": "U84", "start": 40604, "end": 43780, "section_id": "H21", "text": "Andrea M. McGrattan, Eduwin Pakpahan, Mario Siervo, Daniel D. Reidpath, Matthew Prina, Yueping Zhu, Chen Shulin, and Louise Robinson report no relevant disclosures. Authors who have received grants or contracts from any entity in the past 36 months: Devi Mohan—(1) Dementia toolkit for carers (DeToC): A comprehensive toolkit to support carers of people living with dementia in rural communities. Monash University Malaysia ASEAN grant; Role: Principal investigator. (2) Salivary lactoferrin for early identification of sleep related cognitive decline: A potential target for dementia prevention. Monash University Malaysia, School Strategic Grant; Role: Principal investigator. (3) Pathways of Acquired Epilepsy and their Comorbidities: A Translational Crosstalk between HMGB1 Mechanisms and Gut Microbiome. Monash University Malaysia, School Strategic Grant; Role: Co‐Investigator. (4) Global dementias: Examining structural vulnerability and dementia outcomes. Australian Research Council: Discovery Projects; Role: Partner investigator. (5) Investigating Multimorbidity Through capacity building (MUTUAL). MRC UK‐ GCRF Global Multimorbidity—Seed Funding; Role: Co‐Investigator. (6) Improving early detection and diagnosis of breast cancer among multi‐ethnic rural communities in Malaysia—the implementation of the community education and navigation programme (CENP). Newton Fund Impact Scheme Grant; Role: Co‐investigator. (7) Dementia Prevention and Enhanced Care (DePEC). National Institute of Health Research, UK: Global Health Group (Dementia)‐ (16/137/62); Role: Co‐investigator (all payments made to the institution). Jennifer Yates—NIHR RfPB Co‐investigator Enhance project (all payments made to the institution). Stella‐Maria Paddick—British council science South Asia grant; Broadening our horizons scheme; GCRF funding (Leicester university) for biomarker analysis; all small grants competitively awarded for research costs (all payments made to the institution). All authors who have received funding to travel to attend meetings in the past 36 months: Stella‐Maria Paddick—Cumbria, Northumberland, Tyne and wear NHS foundation trust—travel to Dhaka for a work related meeting; Newcastle University broadening our horizons scheme 2018—reciprocal visit between UK and Chile for one researcher at each site (all payments made to the institution). Blossom C. M. Stephan—NIHR Funded Global Health Research Group on Dementia Prevention and Enhanced care to attend ADI2020 conference (virtual due to COVID‐19; all payments made to the institution). All authors who have been members of external committees (within the past 36 months): Blossom C. M. Stephan—member of the Alzheimer's Society Research Strategy Council (chair the Dementia Prevention Subcommittee); an invited participant to the World Dementia Council, Prevention Workshop, 2021. Stella‐Maria Paddick—on the executive committee of the Royal College of Psychiatrists International Psychiatry and Volunteering Special interest group and attended a number of online meetings. Other financial or non‐financial interests in the past 36 months: Stella‐Maria Paddick—employed by the UK National Health Service."}, {"id": "U85", "start": 43783, "end": 43806, "section_id": "H22", "text": "## AUTHOR CONTRIBUTIONS"}, {"id": "U86", "start": 43808, "end": 44288, "section_id": "H22", "text": "Blossom C. M. Stephan conceptualized the study. Andrea M. McGrattan and Eduwin Pakpahan undertook screening and data extraction. Blossom C. M. Stephan acted as third reviewer. Eduwin Pakpahan undertook the meta‐analysis. Andrea M. McGrattan drafted the initial manuscript, and Blossom C. M. Stephan and Eduwin Pakpahan critically reviewed and edited. All authors had full access to all the data in the study and had final responsibility for the decision to submit for publication."}, {"id": "U87", "start": 44291, "end": 44316, "section_id": "H23", "text": "## Supporting information"}, {"id": "U88", "start": 44318, "end": 44376, "section_id": "H23", "text": "SUPPORTING INFORMATIONClick here for additional data file."}, {"id": "U89", "start": 44378, "end": 44436, "section_id": "H23", "text": "SUPPORTING INFORMATIONClick here for additional data file."}, {"id": "U90", "start": 44439, "end": 44457, "section_id": "H24", "text": "## ACKNOWLEDGMENTS"}, {"id": "U91", "start": 44459, "end": 44804, "section_id": "H24", "text": "This research was funded by the National Institute for Health Research (NIHR) Global Group: DePEC (Grant Number: 16/137/62) using UK aid from the UK Government to support global health research. The views expressed in this publication are those of the authors and not necessarily those of the NIHR or the UK Department of Health and Social Care."}, {"id": "U92", "start": 44807, "end": 45073, "section_id": "H24", "text": "McGrattan AM, Pakpahan E, Siervo M, et al., the DePEC team\n. Risk of conversion from mild cognitive impairment (MCI) to dementia in low‐ and middle‐income countries (LMICs): A systematic review and meta‐analysis. Alzheimer's Dement. 2022;8:e12267. 10.1002/trc2.12267"}, {"id": "U93", "start": 45075, "end": 45139, "section_id": "H24", "text": "Andrea M. McGrattan and Eduwin Pakpahan are joint first authors."}, {"id": "U94", "start": 45144, "end": 45174, "section_id": "H25", "text": "## DATA AVAILABILITY STATEMENT"}, {"id": "U95", "start": 45176, "end": 45492, "section_id": "H25", "text": "This systematic review was registered via Prospero; PROSPERO registration number: CRD42019130958. A copy of the systematic review protocol is available on request and can be provided by the corresponding author. Requests for access to the data reported in this article will be considered by the corresponding author."}]}, "source_attachments": [], "input_fingerprint": "8c000fc820edb9c7dd89ad948bc2c2563009c256a19c20c7f6b7ab787c373fee", "prompt": {"id": "KM.TEXT_TO_MAP", "version": "3", "sha256": "71d626d5e892dfac0cef836170142e442928a9526982011c483f17ef94f90c1f"}, "dependency_prompt": {"id": "KM.TEXT_TO_MAP.DEPENDENCIES", "version": "15", "sha256": "21d56fba6683319b09e001faa3f91f637b1f28cecb6cadef9ef019b25d144915"}, "generation": {"kind": "codex_manual", "author": "Codex", "external_llm_calls": 0, "local_llm_calls": 0, "translation_llm_calls": 0, "embedding_calls": 0, "token_usage": null, "token_usage_note": "Codex session usage is unavailable; no provider usage is fabricated."}, "translations": {"ru": {"run_id": "1188519e-c2e7-4f19-a288-d99923cce7cb", "knowledge_labels": {"K1": "MCI — промежуточное когнитивное состояние между нормальным старением и деменцией, цель исследований профилактики/снижения риска.", "K2": "Оценки распространённости MCI от \u003c1% до >50% зависят от популяции, клинической/общинной выборки, определения и операциональных критериев.", "K3": "Цитируемый годовой переход MCI в деменцию в странах высокого дохода: 10–15% в общем/клиническом описании и 3–10% в общинных выборках; возврат к норме 4–15% в клинике против 29–55% в популяциях.", "K4": "Критерии Petersen: субъективная потеря памяти, подтверждённая тестами, без значимых нарушений других доменов, функций и без деменции; альтернативы IWG, NIA-AA и DSM-IV затрудняют сравнение.", "K5": "Практическая профилактическая ценность MCI обсуждается; предполагаемые изменяемые риски включают нездоровое питание, неактивность, курение, кардиометаболические болезни, ожирение и гипертензию, при несогласованных определениях.", "K6": "Цитируемая работа оценивает потенциально предотвращаемое прогрессирование MCI в 21,7%: ожирение как прокси питания 8,7%, диабет 1,5%, нейропсихиатрические симптомы 11,5%.", "K7": "Почти две трети людей с деменцией живут в странах низкого/среднего дохода с ограниченными ресурсами и услугами; источник описывает деменцию как неизлечимую, мотивируя снижение риска.", "K8": "Обобщить продольные популяционные исследования LMIC о переходе MCI в деменцию и факторах риска для контекстно пригодной профилактики.", "K9": "Следовать PRISMA и зарегистрировать протокол CRD42019130958 в PROSPERO.", "K10": "Искать в Medline, Embase, PsycINFO через Ovid и Scopus от начала до 30 апреля 2019, затем обновить 1 мая 2019 — 30 июня 2020 по терминам деменции/MCI/инцидентности/перехода.", "K11": "Включить наблюдательные популяционные когорты LMIC с ясным валидированным MCI, ≥1 года наблюдения и установленными критериями деменции; требовать отдельные исходные MCI-результаты, исключать жалобы без диагноза и стратифицированные болезни без общего перехода.", "K12": "Два рецензента независимо проверяют заголовки/аннотации и полные тексты; неопределённые тексты получают полностью, разногласия решает третий, проверяют библиографии.", "K13": "Извлечь стандартизированные метаданные, страну, возраст/размеры выборок, сроки, диагнозы, методы/потери наблюдения, переходы и значимые/незначимые риски; один извлекает, второй проверяет, третий решает расхождения.", "K14": "Независимо оценить отбор, сопоставимость и исходы по Newcastle–Ottawa; источник заявляет максимум 8 звёзд, но распределяет 3+2+2 по категориям. Формулировки сохранены раздельно.", "K15": "Сообщать число переходов в деменцию, делённое на полную выборку, отдельно по определению MCI и обобщать значимые риски; все оценённые риски отнесены к дополнительной таблице S2.", "K16": "Объединить только совместимые Petersen-подобные MCI→AD когорты (шесть) в Stata Metaprop: случайные эффекты, двойное арксинусное преобразование Freeman–Tukey, score/точные биномиальные 95% ДИ, биномиальная вариация внутри исследований и I².", "K17": "Проверить 8977 первых записей и 87 полных текстов, сохранить девять; обновление добавило 1670 записей и две работы: всего 10647 записей и 11 работ. Частые исключения: не LMIC, не популяция, нет инцидентной деменции.", "K18": "Из 11 исследований: семь Китай, два Бразилия, по одному Нигерия/Танзания; при наборе два низкого дохода и девять среднего. Лишь одно описано как национально представительное (перепись Rio Grande do Sul, Бразилия).", "K19": "Исходные MCI-выборки 21–837 (370±295), при наблюдении 21–638 (298±238). Срок 2–5,8 года, средний 3,7±1,1; возрастные пороги >60 (шесть), >55 (два), >65 (один), >70 (два).", "K20": "Критерии: Petersen пять работ, CDR 0,5 одна, Dubois одна, DSM-IV две, IWG одна, CIND одна. Включены все 87 CIND, хотя 74 с MUML описаны как сопоставимые с Petersen. Девять сообщают MCI, две aMCI, одна — каждый амнестический/неамнестический одно-/многодоменный подтип.", "K21": "Критерии деменции перекрываются: DSM-IV семь, NINCDS-ADRDA пять, NINDS-AIREN два, DSM-III-R один, ICD-10 упомянут один раз; семь работ оценивают всю деменцию, восемь AD, две VaD.", "K22": "Хуан: Пекин, 29 общин (12 городских, 17 сельских); возраст >55 лет; общая исходная выборка 5743, MCI 175, при наблюдении 121; срок 3 года. Критерии MCI Petersen, тип MCI; деменция DSM‐IV (all cause) NINCDS‐ADRDA (AD) NINDS‐AIREN (VaD).", "K23": "Ли: Чунцин, 10 случайных общин; возраст >55 лет; общая исходная выборка 26,481 (18,683 screened), MCI 837, при наблюдении 638; срок 5 года. Критерии MCI Petersen, тип MCI; деменция DSM‐IV (all cause) NINCDS/ADRDA (AD).", "K24": "Дин: община Jingansi в Шанхае; возраст >60 лет; общая исходная выборка 3141, MCI 655, при наблюдении 362; срок 4 года. Критерии MCI Petersen, тип MCI aMCI aMCI‐SD aMCI‐MD naMCI‐SD naMCI‐MD; деменция DSM‐IV (all cause).", "K25": "Ян: пожилые общинные жители Китая; возраст >60 лет; общая исходная выборка 652, MCI 465, при наблюдении 465; срок 3 года. Критерии MCI Petersen, тип MCI; деменция DSM‐ IV‐TR (AD).", "K26": "Ю: восемь удобных общин Тайюаня; возраст >60 лет; общая исходная выборка 6192, MCI 600, при наблюдении 518; срок 5 года. Критерии MCI Petersen, тип MCI; деменция NINCDS‐ADRDA (AD).", "K27": "Байеву: Idikan и соседние кварталы Ибадана, Нигерия; возраст >65 лет; общая исходная выборка 2487, MCI 152, при наблюдении 87; срок 2 года. Критерии MCI CIND (Levy/International Psychogeriatric Association/WHO), тип CIND; деменция DSM III‐R ICD‐10 (all cause).", "K28": "Монтано: городской район Сан-Паулу, Бразилия; возраст >70 лет; общая исходная выборка 1667, MCI 80, при наблюдении 40; срок 2.6 года. Критерии MCI CDR 0.5, тип CDR 0.5; деменция NINCDS–ADRDA (all cause).", "K29": "Паддик: шесть случайных деревень Hai, Танзания; возраст >70 лет; общая исходная выборка 296, MCI 46, при наблюдении 46; срок 4 года. Критерии MCI IWG, тип MCI; деменция DSM‐IV (all cause) NINCDS‐ADRDA (AD) NINDS‐ AIREN (VaD).", "K30": "Ю: 26 военных санаториев Шицзячжуана; возраст >60 лет; общая исходная выборка 2674, MCI 216, при наблюдении 209; срок 3 года. Критерии MCI DSM-IV, тип MCI; деменция DSM‐IV (all cause) NINCDS‐ADRDA (AD).", "K31": "Ван: девять плотных пожилых общин Тайюаня; возраст >65 лет; общая исходная выборка 6152, MCI 600, при наблюдении 557; срок 3 года. Критерии MCI DSM-IV, тип aMCI; деменция NINCDS‐ADRDA (AD).", "K32": "Годино: район Hospital de Clinicas Porto Alegre, Бразилия; возраст >60 лет; общая исходная выборка 245, MCI 21, при наблюдении 21; срок 5.8 года. Критерии MCI Dubois and Albert 2004, тип MCI; деменция DSM‐IV & NINCDS‐ADRDA (AD).", "K33": "Huang: переход MCI в деменцию всех причин: 42% (51/121): AD 29, VaD 18, другие 4; за 3 года.", "K34": "Li: переход MCI в болезнь Альцгеймера: 44,8% (298/638), все классифицированы как AD; за 5 года.", "K35": "Ding: переход MCI в деменцию всех причин: 6,0 на 100 человеко-лет (95% ДИ 4,7–7,3; 79/362); за 4 года.", "K36": "Yang: переход MCI в болезнь Альцгеймера: 16,8% (78/465); за 3 года.", "K37": "Yu_Taiyuan: переход MCI в болезнь Альцгеймера: 17,0% (89/518); за 5 года.", "K38": "Baiyewu: переход MCI в деменцию всех причин: 16,1% (14/87); за 2 года.", "K39": "Montano: переход MCI в деменцию всех причин: 37,5% (15/40), также 145,4 на 1000 человеко-лет; за 2.6 года.", "K40": "Paddick: переход MCI в деменцию всех причин: 37,0% (17/46): AD 9, VaD 4, Паркинсон 2, смешанные 2; за 4 года.", "K41": "Yu_Sanatorium: переход MCI в деменцию всех причин: 24,4% (51/209), в таблице обозначено за год; Table says per year; study mean follow-up 3 года.", "K42": "Yu_Sanatorium: переход MCI в болезнь Альцгеймера: 15,7% (35/209), обозначено за год; доля и дробь не согласовывались; Table says per year; study mean follow-up 3 года.", "K43": "Wang: переход MCI в болезнь Альцгеймера: 6% (34/557 за год); Table says per year; study mean follow-up 3 года.", "K44": "Godhino: переход MCI в болезнь Альцгеймера: 38,1% (8/21); за 5.8 года.", "K45": "Подтип Дин aMCI: переход 6.9 на 100 человеко-лет, 95% ДИ 5.2–8.6, 59/238 за четыре года.", "K46": "Подтип Дин aMCI одного домена: переход 3.0 на 100 человеко-лет, 95% ДИ 1.6–4.4, 17/156 за четыре года.", "K47": "Подтип Дин aMCI нескольких доменов: переход 14.2 на 100 человеко-лет, 95% ДИ 10.2–18.2, 42/82 за четыре года.", "K48": "Подтип Дин неамнестический MCI одного домена: переход 2.7 на 100 человеко-лет, 95% ДИ 1.0–4.5, 9/91 за четыре года.", "K49": "Подтип Дин неамнестический MCI нескольких доменов: переход 8.7 на 100 человеко-лет, 95% ДИ 3.8–13.7, 11/33 за четыре года.", "K50": "В тексте 11 исследований LMIC: переход MCI в деменцию всех причин 6,0–44,8% за средние 3,7±1,2 года; диапазон объединяет разные определения и периоды, а не единый годовой риск.", "K51": "Текст: переход в AD 6,0–46,7% в восьми работах за 4,0±1,1 года; VaD 8,7–14,9% в двух за 3,5±0,7 года.", "K52": "Широкие определения MCI/CIND/CDR: переход 16,8–44,8% за 2–5,8 года против ограниченного aMCI 6,0–6,9% за средние 3,5 года (две работы); авторы трактуют широкие нарушения как больший риск.", "K53": "Пожилой возраст значимо связан с переходом MCI в деменцию в 6/10 оценивших работ; риски изучены в 10/11 работах.", "K54": "Плохое исходное выполнение когнитивных тестов значимо связан с переходом MCI в деменцию в 5/7 оценивших работ; риски изучены в 10/11 работах.", "K55": "Женский пол значимо связан с переходом MCI в деменцию в 3/10 оценивших работ; риски изучены в 10/11 работах.", "K56": "Гипертензия значимо связан с переходом MCI в деменцию в 3/6 оценивших работ; риски изучены в 10/11 работах.", "K57": "Низкое образование значимо связан с переходом MCI в деменцию в 2/10 оценивших работ; риски изучены в 10/11 работах.", "K58": "Тревога и депрессия значимо связан с переходом MCI в деменцию в 2/5 оценивших работ; риски изучены в 10/11 работах.", "K59": "Инсульт в анамнезе значимо связан с переходом MCI в деменцию в 1/4 оценивших работ; риски изучены в 10/11 работах.", "K60": "Диабет значимо связан с переходом MCI в деменцию в 2/4 оценивших работ; риски изучены в 10/11 работах.", "K61": "Статус APOE ε4 значимо связан с переходом MCI в деменцию в 2/4 оценивших работ; риски изучены в 10/11 работах.", "K62": "Результаты смещения: средние 7,3 звезды из 10 (5–8), но восемь из 11 достигли заявленного максимума восьми; шкалы сохранены как сообщены.", "K63": "Шесть Petersen-подобных MCI→AD работ (четыре Китай, по одной Танзания/Бразилия): объединённый переход в AD 23,8% (95% ДИ 15,4–33,4%) за 3,0–5,8 года; китайская неоднородность I²=96,54%, p\u003c0,0001.", "K64": "MCI связан с высоким, но разным переходом в деменцию в LMIC; примерно четверть Petersen-подобных случаев переходит в AD за изученные 3,0–5,8 года. Возможны демографические/медицинские влияния, ограниченные данные не позволяют обобщить на все LMIC.", "K65": "Обсуждение относит Бразилию к верхнему среднему доходу, Нигерию к нижнему среднему, Танзанию к низкому, тогда как при наборе две работы низкого дохода; ресурсы, финансирование и диагностика предложены как причины дефицита данных с доминированием Китая.", "K66": "Обсуждение сообщает женский риск в 2/10 работах против 3/10 результатов; возраст/APOE ε4 неизменяемы, сосудистые/кардиометаболические и нейропсихиатрические риски потенциально изменяемы. Данные пола/образования ограничены методологией и обратной причинностью.", "K67": "Цитируемая оценка: до 40% деменций потенциально предотвратимы через 12 изменяемых рисков; когнитивные тренировки могут снижать риск, но применимость при MCI и осуществимость в LMIC нуждаются в проверке.", "K68": "Обобщение ограничивают англоязычный поиск без серой литературы, лишь одна национальная выборка, разные диагнозы/сроки/меры, мало стран, высокая неоднородность и невозможность стратификации по возрасту/сроку; нужна осторожность.", "K69": "Инвестировать в согласованные представительные продольные исследования MCI/деменции в LMIC, особенно низкого дохода; использовать рекомендации 10/66 и HCAP для сопоставимости и определения групп высокого риска с контекстной профилактикой."}, "labels": {"B1": "MCI — промежуточное когнитивное состояние между нормальным старением и деменцией, цель исследований профилактики/снижения риска.", "B2": "Оценки распространённости MCI от \u003c1% до >50% зависят от популяции, клинической/общинной выборки, определения и операциональных критериев.", "B3": "Цитируемый годовой переход MCI в деменцию в странах высокого дохода: 10–15% в общем/клиническом описании и 3–10% в общинных выборках; возврат к норме 4–15% в клинике против 29–55% в популяциях.", "B4": "Критерии Petersen: субъективная потеря памяти, подтверждённая тестами, без значимых нарушений других доменов, функций и без деменции; альтернативы IWG, NIA-AA и DSM-IV затрудняют сравнение.", "B5": "Практическая профилактическая ценность MCI обсуждается; предполагаемые изменяемые риски включают нездоровое питание, неактивность, курение, кардиометаболические болезни, ожирение и гипертензию, при несогласованных определениях.", "B6": "Цитируемая работа оценивает потенциально предотвращаемое прогрессирование MCI в 21,7%: ожирение как прокси питания 8,7%, диабет 1,5%, нейропсихиатрические симптомы 11,5%.", "B7": "Почти две трети людей с деменцией живут в странах низкого/среднего дохода с ограниченными ресурсами и услугами; источник описывает деменцию как неизлечимую, мотивируя снижение риска.", "B8": "Обобщить продольные популяционные исследования LMIC о переходе MCI в деменцию и факторах риска для контекстно пригодной профилактики.", "B9": "Следовать PRISMA и зарегистрировать протокол CRD42019130958 в PROSPERO.", "B10": "Искать в Medline, Embase, PsycINFO через Ovid и Scopus от начала до 30 апреля 2019, затем обновить 1 мая 2019 — 30 июня 2020 по терминам деменции/MCI/инцидентности/перехода.", "B11": "Включить наблюдательные популяционные когорты LMIC с ясным валидированным MCI, ≥1 года наблюдения и установленными критериями деменции; требовать отдельные исходные MCI-результаты, исключать жалобы без диагноза и стратифицированные болезни без общего перехода.", "B12": "Два рецензента независимо проверяют заголовки/аннотации и полные тексты; неопределённые тексты получают полностью, разногласия решает третий, проверяют библиографии.", "B13": "Извлечь стандартизированные метаданные, страну, возраст/размеры выборок, сроки, диагнозы, методы/потери function element(tag,value,parent=panel){const el=document.createElement(tag);if(value!==undefined)el.textContent=value;parent.append(el);return el}
function quote(ids){for(const id of [...new Set(ids)]){const u=units.get(id);if(!u)continue;element('small',`${id} · Unicode [${u.start}, ${u.end})`);element('blockquote',u.text);for(const a of data.source_attachments||[])if(a.unit_id===id){element('small','Приложение / Source attachment · '+a.xml_asset);element('blockquote',a.text)}}}
function show(){panel.replaceChildren();if(!selected){element('h2','Карта развития знаний');element('p','Выберите блок или стрелку. Голубые блоки — состояния, оранжевые — действия. Скрытая семантика не образует стрелки автоматически.');element('p','Несколько входов одного обоснования используются совместно; разные обоснования — альтернативные пути.');element('small',`run ${data.run_id}`);return}
if(selected.kind==='node'){const n=byId.get(selected.id),k=knowledge.get(n.knowledge_id);element('h2',`${n.id} · ${k.knowledge_id}`);element('p',label(n));element('small',`${k.kind} / ${k.knowledge_kind}${k.action_status?' / '+k.action_status:''}`);element('h3','Исходные фрагменты / Source fragments');quote(k.provenance.unit_ids);const detail=element('details');element('summary','Семантический frame (English)',detail);element('pre',JSON.stringify(k.semantic_frame,null,2),detail);}
else{element('h2',`${selected.source} → ${selected.target}`);const transitions=graph.transitions.filter(t=>t.target===selected.target&&t.sources.includes(selected.source));for(const t of transitions){element('h3',`${t.id} · ${t.usage}`);element('p',`Совместные входы / Joint inputs: ${t.sources.join(' + ')} → ${t.target}`);element('p',t.reason);if(t.conditions.length)element('p',t.conditions.join('; '));quote(t.unit_ids)}}}
function draw(){scene.replaceChildren();for(const e of graph.edges){const a=positions.get(e.source),b=positions.get(e.target),x=a.x+a.w,y=a.y+a.h/2,endY=b.y+b.h/2,d=`M${x},${y} C${x+35},${y} ${b.x-35},${endY} ${b.x},${endY}`;const path=svg('path',{d,class:'edge'+(selected?.source===e.source&&selected?.target===e.target?' selected':''),'marker-end':'url(#arrow)'});scene.append(path);const hit=svg('path',{d,class:'hit'});hit.addEventListener('click',ev=>{ev.stopPropagation();selected={kind:'edge',...e};draw();show()});scene.append(hit)}
for(const n of graph.nodes){const p=positions.get(n.id),fo=svg('foreignObject',{x:p.x,y:p.y,width:p.w,height:p.h}),card=document.createElementNS('http://www.w3.org/1999/xhtml','div');card.className='card '+n.kind+(selected?.id===n.id?' selected':'');const b=document.createElement('b');b.textContent=`${n.id} · ${n.knowledge_id} · ${n.kind}${knowledge.get(n.knowledge_id).action_status?' / '+knowledge.get(n.knowledge_id).action_status:''}`;card.append(b,document.createTextNode(label(n)));card.addEventListener('click',ev=>{ev.stopPropagation();selected={kind:'node',id:n.id};draw();show()});fo.append(card);scene.append(fo)}update()}
function focus(id){const p=positions.get(id);if(!p)return;selected={kind:'node',id};scale=1;tx=view.clientWidth/2-(p.x+p.w/2);ty=view.clientHeight/2-(p.y+p.h/2);draw();show()}
function search(){const q=document.getElementById('search').value.toLocaleLowerCase(),list=document.getElementById('matches');list.replaceChildren();const empty=document.createElement('option');empty.textContent='Выбрать / Select';empty.value='';list.append(empty);for(const n of graph.nodes.filter(n=>`${n.id} ${label(n)}`.toLocaleLowerCase().includes(q)).slice(0,50)){const option=document.createElement('option');option.value=n.id;option.textContent=`${n.id}: ${label(n).slice(0,75)}`;list.append(option)}}
document.getElementById('stats').textContent=`${graph.knowledge.length} знаний · ${graph.edges.length} связей · ${graph.analysis.depth} слоёв`;
document.getElementById('fit').onclick=fit;document.getElementById('plus').onclick=()=>zoom(1.3);document.getElementById('minus').onclick=()=>zoom(1/1.3);document.getElementById('search').oninput=search;document.getElementById('matches').onchange=e=>focus(e.target.value);
document.getElementById('language').onchange=e=>{language=e.target.value;draw();show();search()};const full=document.getElementById('full');full.textContent=data.source.text;document.getElementById('source').onclick=()=>{full.style.display=full.style.display==='block'?'none':'block'};
view.addEventListener('wheel',e=>{if(full.style.display==='block')return;e.preventDefault();const rect=view.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-rect.left,e.clientY-rect.top)},{passive:false});
view.addEventListener('pointerdown',e=>{if(e.target.closest('.card,.hit,#full'))return;drag={x:e.clientX,y:e.clientY,tx,ty};view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;update()}});view.addEventListener('pointerup',()=>drag=null);view.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('resize',fit);draw();show();search();fit();
</script></html>
