d": "H3"}, {"start": 33428, "end": 34528, "section_id": "H20"}]}}, {"id": "B4", "knowledge_id": "K4", "occurrence_context": null, "duplication": null, "display_text": "Petersen MCI criteria specify subjective memory loss confirmed by neuropsychological testing, no significant other-domain impairment, no functional impairment and no dementia; IWG, NIA-AA and DSM-IV alternatives complicate comparisons.", "kind": "state", "block_type": "state", "knowledge_kind": "definition", "is_goal": false, "order": 3, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U13"], "source_spans": [{"start": 3611, "end": 4426, "section_id": "H3"}]}}, {"id": "B5", "knowledge_id": "K5", "occurrence_context": null, "duplication": null, "display_text": "MCI’s pragmatic prevention value is debated; proposed modifiable risks include unhealthy diet, inactivity, smoking, cardiometabolic disease, obesity and hypertension, while inconsistent definitions limit comparison.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 4, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U14"], "source_spans": [{"start": 4428, "end": 5620, "section_id": "H3"}]}}, {"id": "B6", "knowledge_id": "K6", "occurrence_context": null, "duplication": null, "display_text": "A cited report estimates 21.7% of MCI progression potentially preventable by targeting obesity-as-diet proxy (8.7%), diabetes (1.5%) and neuropsychiatric symptoms (11.5%).", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 5, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U14"], "source_spans": [{"start": 4428, "end": 5620, "section_id": "H3"}]}}, {"id": "B7", "knowledge_id": "K7", "occurrence_context": null, "duplication": null, "display_text": "Nearly two thirds of people with dementia live in LMICs, with limited resources/services; the source describes dementia as incurable, motivating targeted risk reduction.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 6, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U5", "U15", "U82"], "source_spans": [{"start": 277, "end": 578, "section_id": "H2"}, {"start": 5622, "end": 6292, "section_id": "H3"}, {"start": 39825, "end": 40575, "section_id": "H20"}]}}, {"id": "B8", "knowledge_id": "K8", "occurrence_context": null, "duplication": null, "display_text": "Review longitudinal population-based LMIC studies of MCI conversion to dementia and associated risk factors to inform context-sensitive risk reduction.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 7, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U5", "U15", "U24"], "source_spans": [{"start": 277, "end": 578, "section_id": "H2"}, {"start": 5622, "end": 6292, "section_id": "H3"}, {"start": 8855, "end": 9234, "section_id": "H6"}]}}, {"id": "B9", "knowledge_id": "K9", "occurrence_context": null, "duplication": null, "display_text": "Follow PRISMA and preregister protocol CRD42019130958 in PROSPERO.", "kind": "state", "block_type": "state", "knowledge_kind": "method", "is_goal": false, "order": 8, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U6", "U18"], "source_spans": [{"start": 580, "end": 919, "section_id": "H2"}, {"start": 6311, "end": 6612, "section_id": "H4"}]}}, {"id": "B10", "knowledge_id": "K10", "occurrence_context": null, "duplication": null, "display_text": "Search Medline, Embase, PsycINFO via Ovid and Scopus from inception to 30 April 2019, then update 1 May 2019–30 June 2020 with dementia/MCI/incidence/conversion terms.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 9, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U6", "U21", "U24"], "source_spans": [{"start": 580, "end": 919, "section_id": "H2"}, {"start": 6666, "end": 7104, "section_id": "H5"}, {"start": 8855, "end": 9234, "section_id": "H6"}]}}, {"id": "B11", "knowledge_id": "K11", "occurrence_context": null, "duplication": null, "display_text": "Include observational population-based LMIC cohorts with clearly defined validated MCI, ≥1 year follow-up and established dementia criteria; require separate baseline-MCI results, exclude memory complaints without MCI and disease-stratified samples lacking total-population conversion.", "kind": "state", "block_type": "state", "knowledge_kind": "method", "is_goal": false, "order": 10, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U6", "U22"], "source_spans": [{"start": 580, "end": 919, "section_id": "H2"}, {"start": 7106, "end": 8827, "section_id": "H5"}]}}, {"id": "B12", "knowledge_id": "K12", "occurrence_context": null, "duplication": null, "display_text": "Two reviewers independently screen titles/abstracts and full texts; obtain uncertain full texts, resolve disagreements with a third reviewer and check included-study reference lists.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 11, "rank": 2, "origin": "extracted", "provenance": {"unit_ids": ["U29"], "source_spans": [{"start": 10552, "end": 11170, "section_id": "H7"}]}}, {"id": "B13", "knowledge_id": "K13", "occurrence_context": null, "duplication": null, "display_text": "Extract standardized study metadata, country, age/sample sizes, follow-up, diagnoses, conversion methods/attrition, conversion estimates and significant/nonsignificant risks; one extracts, a second checks and a third resolves discrepancies.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 12, "rank": 4, "origin": "extracted", "provenance": {"unit_ids": ["U34"], "source_spans": [{"start": 11524, "end": 12224, "section_id": "H8"}]}}, {"id": "B14", "knowledge_id": "K14", "occurrence_context": null, "duplication": null, "display_text": "Independently assess selection, comparability and outcome using Newcastle–Ottawa; the source states maximum 8 stars but assigns 3+2+2 stars to categories. Keep the scoring statements distinct.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 13, "rank": 4, "origin": "extracted", "provenance": {"unit_ids": ["U37"], "source_spans": [{"start": 12262, "end": 12695, "section_id": "H9"}]}}, {"id": "B15", "knowledge_id": "K15", "occurrence_context": null, "duplication": null, "display_text": "Report converted-to-dementia cases divided by the total sample separately for each MCI definition, and summarize significant risk factors; all assessed risks are delegated to supplementary Table S2.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 14, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U40"], "source_spans": [{"start": 12718, "end": 13113, "section_id": "H10"}]}}, {"id": "B16", "knowledge_id": "K16", "occurrence_context": null, "duplication": null, "display_text": "Pool only compatible Petersen-type MCI→AD cohorts (six studies) in Stata Metaprop using random effects, Freeman–Tukey double-arcsine transformation, score/exact-binomial 95% CIs, binomial within-study variability and I² heterogeneity.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 15, "rank": 6, "origin": "extracted", "provenance": {"unit_ids": ["U41"], "source_spans": [{"start": 13115, "end": 13991, "section_id": "H10"}]}}, {"id": "B17", "knowledge_id": "K17", "occurrence_context": null, "duplication": null, "display_text": "Screen 8977 initial records and 87 full texts, retaining nine; update adds 1670 records and two studies, for 10647 records and 11 included studies. Common exclusions: not LMIC, not population-based, no incident dementia.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 16, "rank": 3, "origin": "extracted", "provenance": {"unit_ids": ["U7", "U30", "U31", "U46"], "source_spans": [{"start": 921, "end": 1758, "section_id": "H2"}, {"start": 11173, "end": 11332, "section_id": "H7"}, {"start": 11335, "end": 11494, "section_id": "H7"}, {"start": 14038, "end": 14648, "section_id": "H12"}]}}, {"id": "B18", "knowledge_id": "K18", "occurrence_context": null, "duplication": null, "display_text": "The 11 studies comprise seven China, two Brazil, one Nigeria and one Tanzania; at recruitment two were low-income and nine middle-income. Only one is described as nationally representative (Rio Grande do Sul census, Brazil).", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 17, "rank": 5, "origin": "extracted", "provenance": {"unit_ids": ["U7", "U49"], "source_spans": [{"start": 921, "end": 1758, "section_id": "H2"}, {"start": 14684, "end": 15784, "section_id": "H13"}]}}, {"id": "B19", "knowledge_id": "K19", "occurrence_context": null, "duplication": null, "display_text": "Baseline MCI samples range 21–837 (mean 370, SD 295); follow-up samples 21–638 (298±238). Follow-up is 2–5.8 years, mean 3.7±1.1; most cohorts enroll >60 years (six), others >55 (two), >65 (one), >70 (two).", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 18, "rank": 5, "origin": "extracted", "provenance": {"unit_ids": ["U49"], "source_spans": [{"start": 14684, "end": 15784, "section_id": "H13"}]}}, {"id": "B20", "knowledge_id": "K20", "occurrence_context": null, "duplication": null, "display_text": "MCI criteria vary: Petersen five studies, CDR .5 one, Dubois one, DSM-IV two, IWG one and CIND one. The review includes all 87 CIND participants, though 74 had MUML described as Petersen-comparable. Nine report MCI; two aMCI; one each single/multiple-domain amnestic/nonamnestic subtypes.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 19, "rank": 5, "origin": "extracted", "provenance": {"unit_ids": ["U52", "U53", "U56"], "source_spans": [{"start": 15826, "end": 16015, "section_id": "H14"}, {"start": 16017, "end": 17050, "section_id": "H14"}, {"start": 26529, "end": 27313, "section_id": "H14"}]}}, {"id": "B21", "knowledge_id": "K21", "occurrence_context": null, "duplication": null, "display_text": "Dementia criteria overlap: DSM-IV seven studies, NINCDS-ADRDA five, NINDS-AIREN two, DSM-III-R one and ICD-10 mentioned once; seven evaluate all-cause dementia, eight AD and two VaD.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 20, "rank": 5, "origin": "extracted", "provenance": {"unit_ids": ["U59"], "source_spans": [{"start": 27360, "end": 28045, "section_id": "H15"}]}}, {"id": "B22", "knowledge_id": "K22", "occurrence_context": null, "duplication": null, "display_text": "Huang cohort (China): 29 geographically defined communities located within Greater Beijing, China (12 urban and 17 rural), age >55 years; total baseline 5743, MCI baseline 175, follow-up 121; mean follow-up 3 years. MCI Petersen: MCI; dementia DSM‐IV (all cause) NINCDS‐ADRDA (AD) NINDS‐AIREN (VaD).", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 21, "rank": 5, "origin": "extracted", "provenance": {"unit_ids": ["U54", "U55", "U56"], "source_spans": [{"start": 17053, "end": 17145, "section_id": "H14"}, {"start": 17148, "end": 26527, "section_id": "H14"}, {"start": 26529, "end": 27313, "section_id": "H14"}]}}, {"id": "B23", "knowledge_id": "K23", "occurrence_context": null, "duplication": null, "display_text": "Li cohort (China): 10 randomly selected communities in the city of Chongqing, age >55 years; total baseline 26,481 (18,683 screened), MCI baseline 837, follow-up 638; mean follow-up 5 years. MCI Petersen: MCI; dementia DSM‐IV (all cause) NINCDS/ADRDA (AD).", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": f 7", "B9", "B11", "B15", "B8", "B10", "B12", "B17", "B13", "B14", "B18", "B19", "B20", "B21", "B22", "B23", "B24", "B25", "B26", "B27", "B28", "B29", "B30", "B31", "B32", "B50", "B51", "B53", "B54", "B55", "B56", "B57", "B58", "B59", "B60", "B61", "B62", "B16", "B33", "B34", "B35", "B36", "B37", "B38", "B39", "B40", "B41", "B42", "B43", "B44", "B45", "B46", "B47", "B48", "B49", "B52", "B65", "B66", "B63", "B67", "B64", "B68", "B69"], "analysis": {"depth": 10, "layer_counts": {"0": 10, "1": 2, "2": 1, "3": 1, "4": 2, "5": 27, "6": 21, "7": 2, "8": 2, "9": 1}, "concept_count": 62, "canonical_knowledge_count": 69, "occurrence_count": 69, "repeated_occurrence_count": 0, "transition_count": 59, "knowledge_input_count": 83, "statement_count": 76, "operation_count": 9, "isolated_count": 3}}, "source": {"article_id": "pilot-pmc10000452-pmc8918697-8c000fc820edb9c7", "text": "# Risk of conversion from mild cognitive impairment to dementia in low‐ and middle‐income countries: A systematic review and meta‐analysis\n\n**Journal:** Alzheimer's & Dementia : Translational Research & Clinical Interventions (2022)\n\n**DOI:** 10.1002/trc2.12267\n\n\n## Abstract\n\nWith no treatment for dementia, there is a need to identify high risk cases to focus preventive strategies, particularly in low‐ and middle‐income countries (LMICs) where the burden of dementia is greatest. We evaluated the risk of conversion from mild cognitive ompairment (MCI) to dementia in LMICs.\n\nMedline, Embase, PsycINFO, and Scopus were searched from inception until June 30, 2020. The search was restricted to observational studies, conducted in population‐based samples, with at least 1 year follow‐up. There was no restriction on the definition of MCI used as long as it was clearly defined. PROSPERO registration: CRD42019130958.\n\nTen thousand six hundred forty‐seven articles were screened; n = 11 retained. Of the 11 studies, most were conducted in China (n = 7 studies), with only two studies from countries classified as low income. A qualitative analysis of n = 11 studies showed that similar to high‐income countries the conversion rate to dementia from MCI was variable (range 6.0%–44.8%; average follow‐up 3.7 years [standard deviation = 1.2]). A meta‐analysis of studies using Petersen criteria (n = 6 studies), found a pooled conversion rate to Alzheimer's disease (AD) of 23.8% (95% confidence interval = 15.4%–33.4%); approximately one in four people with MCI were at risk of AD in LMICs (over 3.0–5.8 years follow‐up). Risk factors for conversion from MCI to dementia included demographic (e.g., age) and health (e.g., cardio‐metabolic disease) variables.\n\nMCI is associated with high, but variable, conversion to dementia in LMICs and may be influenced by demographic and health factors. There is a notable absence of data from low‐income settings and countries outside of China. This highlights the urgent need for research investment into aging and dementia in LMIC settings. Being able to identify those individuals with cognitive impairment who are at highest risk of dementia in LMICs is necessary for the development of risk reduction strategies that are contextualized to these unique settings.\n\nKeywords: dementia, low‐ and middle‐income countries, mild cognitive impairment, risk factors\n\n\n## INTRODUCTION\n\n1.\n\nMild cognitive impairment (MCI) defines an intermediate cognitive state between normal aging and dementia and is a target for dementia prevention and risk reduction research.\n1\n, \n2\n Numerous definitions for MCI exist and prevalence estimates vary (range \u003c 1% to > 50%) depending on the population sampled (e.g., the age/sex distribution of participants, clinical‐based sample vs. individuals recruited from population‐based settings), MCI case definition, and operationalization of the component criterion for an MCI case diagnosis.\n3\n, \n4\n, \n5\n, \n6\n, \n7\n, \n8\n Further, within high‐income countries (HICs), the rates of conversion from MCI (across different subtypes) to dementia vary (range 10%–15% annually).\n5\n, \n6\n, \n7\n Although some cases remain stable, others can revert to normal, with studies suggesting reversion ranges of 4% to 15% in clinic‐based samples\n8\n, \n9\n, \n10\n, \n11\n and 29% to 55% in population‐based samples.\n12\n, \n13\n, \n14\n, \n15\n In the absence of a cure for dementia, understanding the likelihood of, and risk factors associated with, conversion to dementia among MCI cases is important to help identify strategies for dementia risk reduction and prevention.\n16\n\nThe definition of MCI can be a difficult concept to disentangle. One of the most widely applied set of criteria, in clinical and research practice, are those defined by Petersen et al., describing patients with subjective memory loss verified by neuropsychological testing, with no significant impairment in other cognitive domains, no functional impairments, and no dementia.\n17\n Other similar criteria have also been developed and applied including, for example, from the International Working Group,\n18\n National Institute on Aging–Alzheimer's Association (NIA‐AA),\n19\n and the American Psychiatric Association (Diagnostic and Statistical Manual of Mental Disorders, 4th Edition [DSM‐IV]).\n20\n MCI is therefore an evolving concept, with varying definitions, which can make cross‐study comparisons challenging.\n21\n\nWhile some have suggested that MCI as a method for classification of prodromal dementia can have a limited role in clinical and epidemiological settings, others argue that MCI could be a pragmatic tool for identifying individuals who could benefit from risk reduction.\n22\n Modifiable risk factors for MCI and its conversion to dementia include health and lifestyle factors such as an unhealthy diet (e.g., a diet high in saturated fat, sugar, and salt), physical inactivity, smoking, cardiometabolic diseases (e.g., coronary heart disease and diabetes) and their risks including obesity and hypertension.\n23\n, \n30\n The literature on risk of conversion to dementia predominantly refers to MCI classified using Petersen criteria. \n24\n As discussed, with the multiple definitions of MCI available, this can make comparisons challenging. That said, this evidence highlights the potential for risk reduction and possible prevention or delay of dementia onset in MCI cases. Indeed, a recent report indicated that 21.7% of MCI cases that progress to dementia are potentially preventable, by targeting diet (using obesity as a proxy) (8.7%), diabetes (1.5%), and neuropsychiatric symptoms (11.5%).\n23\n\nCompared to HICs, very few studies on MCI have been conducted in low‐ and middle‐income countries (LMICs).\n4\n Extending the findings from a recent systematic review on MCI prevalence in LMICs,\n4\n the aim of this systematic review and meta‐analysis was to identify and review longitudinal population‐based studies reporting on the risk of conversion from MCI to dementia in LMICs. The focus was on the rate of conversion and associated risk factors. Given that nearly two‐thirds of people with dementia live in LMICs\n25\n identifying those individuals at highest risk is important for targeted interventions focused on reducing the burden of dementia in these settings.\n26\n\n\n## METHODS\n\n2.\n\nThis systematic review and meta‐analysis was conducted according to the PRISMA (Preferred Reporting Items for Systematic Reviews and Meta‐Analyses) guidelines (Appendix A.1 in supporting information).\n27\n The study protocol was registered on the PROSPERO database (registration number CRD42019130958).\n\n### Search strategy and eligibility criteria\n\n2.1.\n\nFour commonly used, comprehensive medical databases were searched electronically from inception until April 30, 2019. A second electronic database search was conducted from May 1, 2019 to June 30, 2020. The selected databases were: Medline; Embase; PsycINFO, assessed via Ovid (https://ovidsp.ovid.com); and Scopus (https://www.Scopus.com/home.uri). A detailed description of the search strategy is provided in the supporting information.\n\nThe search was restricted to observational studies, conducted in population‐based samples, with at least 1 year of follow‐up. Participants were those with a diagnosis of MCI according to internationally accepted and validated classifications.\n1\n, \n17\n, \n18\n, \n19\n, \n28\n, \n29\n Studies which included participants with “memory problems” or “self‐reported memory complaints” and no clear diagnosis of MCI were excluded. To be eligible, MCI participants had to be followed during the study period for risk of dementia; diagnosed according to established criteria, for example, National Institute of Neurological Disorders and Stroke–Alzheimer's Disease and Related Disorders Association (NINCDS‐ADRDA) criteria,\n30\n DSM‐IV criteria,\n20\n, \n31\n or Neuro‐epidemiology Branch of the International Workshop of the National Institute of Neurological Disorders and Stroke with support from the Association Internationale pour la Recherche et l'Enseignement en Neurosciences (NINDS‐AIREN) criteria.\n32\n All‐cause dementia and its subtypes (e.g., Alzheimer's disease [AD] and vascular dementia) were included. Studies that combined participants with MCI with another level of cognitive status at baseline (e.g., cognitively healthy or dementia), were only included if the MCI group data were analyzed and presented separately. Studies were excluded where the MCI sample was stratified by disease status (e.g., diabetes) and rates of conversion were not reported for the total population. Studies were required to be from a LMIC as per the Organisation for Economic Co‐operation and Development (OECD) criteria and World Bank classification, with inclusion based on the income status of the country at the time the study was conducted.\n\n#### Research in context\n\n- Systematic Review: Medline, Embase, Scopus, and PsycINFO were searched for eligible articles reporting on conversion from mild cognitive impairment (MCI) to dementia in population‐ or community‐based studies from low and middle‐income countries (LMICs). The search strategy included terms that encompassed “dementia,” “mild cognitive impairment,” “incidence,” and “conversion.”\n\n- Interpretation: This is the first study to synthesize research on the risk of conversion to dementia in people with MCI in LMIC settings. We found that very few studies on risk of dementia in MCI cases have been undertaken in LMICs. Across the 11 studies, conversion to dementia was high and ranged from 6.0% to 44.8% over an average follow‐up of 3.7 years. A meta‐analysis of studies using Petersen criteria (n = 6 studies), found a pooled conversion rate to Alzheimer's disease (AD) of 23.8% (95% confidence interval = 15.4%–33.4%); approximately one in four people with MCI were at risk of AD in LMICs over 3.0 to 5.8 years follow‐up.\n\n- Future Directions: Like findings from high‐income countries, MCI is associated with increased risk of conversion to dementia in LMIC. There was, however, large heterogeneity in study methodology including definition of MCI, operationalization of MCI criterion, follow‐up time, and diagnosis of dementia as well as a scarcity of studies from countries classed as low income. There is an urgent need for LMICs to invest in the collection of robust, population‐based data, to determine the best strategies for identifying those individuals at highest dementia risk to inform the development of dementia risk reduction plans in these settings.\n\n\n\n\n### Screening process\n\n2.2.\n\nTwo reviewers independently assessed potentially relevant articles for eligibility (AMM and EP). The decision to include or exclude studies was hierarchical and initially made based on the study title and abstract to eliminate obviously irrelevant studies (see Figure 1). When a study's title/abstract could not be rejected with certainty, the full text of the article was obtained for evaluation. Discrepancies between reviewers were resolved by a third reviewer (BCMS). Next, full‐text articles were searched. In addition, the reference lists of all included articles were checked for any potentially missing papers.\n\n\n\u003cfigure>\n  \u003cfigcaption>\u003cstrong>FIGURE 1\u003c/strong> Study selection. LMIC, low‐ and middle‐income countries; MCI, mild cognitive impairment\u003c/figcaption>\n\u003c/figure>\n\n\n\u003cfigure>\n  \u003cfigcaption>\u003cstrong>FIGURE 1\u003c/strong> Study selection. LMIC, low‐ and middle‐income countries; MCI, mild cognitive impairment\u003c/figcaption>\n\u003c/figure>\n\n\n### Data extraction\n\n2.3.\n\nA standardized form was used to extract data from the included studies for assessment of study quality and evidence synthesis. Extracted data included information on: (1) author and year of publication, (2) country, (3) age, (4) sample size, (5) follow‐up duration, (6) MCI and dementia diagnostic criteria, (7) analytical method for determining rate of conversion including loss to follow‐up, (8) results of conversion from MCI to dementia, and (9) risk factors for conversion to dementia (including details of all risk factors assessed—both significant and non‐significant). One author extracted data (EP), and a second checked the extraction (AMM). A third author (BCM) reviewed any discrepancies.\n\n\n### Risk of bias assessment\n\n2.4.\n\nQuality assessment was guided by the Newcastle–Ottawa Scale for cohort studies.\n33\n Risk of bias was assessed on three main categories: selection, comparability, and outcome. The maximum possible score was 8; three stars for selection, two stars for comparability, and two stars for outcome. Two authors (AMM and EP) independently assessed risk of bias, with any disagreement resolved by discussion with a third assessor if required.\n\n\n### Analysis\n\n2.5.\n\nFor each study, we report the proportion of MCI cases that converted to dementia for each definition of MCI separately. This was calculated as the ratio of those who converted to dementia over the total sample size. We also report on the key risk factors significantly associated with an increased risk of dementia. Details of all risk factors assessed are in Table S2 in supporting information.\n\nWhere there were multiple studies using the same criteria to diagnosis MCI and dementia, a meta‐analysis was undertaken. This was only possible for studies that diagnosed MCI using Petersen‐type criteria with an outcome of AD (n = 6 studies). The analysis was run in Stata using the Metaprop command to compute the meta‐analysis of pooled proportions. This allows computation of 95% confidence intervals (95% CI) using the score statistic and the exact binomial method and incorporates the Freeman‐Tukey double arcsine transformation of proportions to compute the weighted pooled estimate for normality assumptions. The program also allows the within‐study variability to be modeled using the binomial distribution.\n34\n Given large differences in the design and sampling across studies, the random effects model was computed. Heterogeneity was assessed using the I2 statistic.\n\n\n\n## RESULTS\n\n3.\n\n### Study selection\n\n3.1.\n\nFrom the electronic search, the titles and abstracts of 8977 publications were screened, and the full texts of 87 articles reviewed. The screening and study selection process is illustrated in the PRISMA flow diagram (Figure 1). Nine articles met the eligibility criteria. The most common reasons for exclusion were that the study was not from a LMIC, the sample was not population‐based, and the study did not report incident dementia. A second search conducted in June 2020 identified a further 1670 articles, from which two studies were eligible for inclusion. Thus, 11 articles are included in this review.\n\n\n### Study characteristics\n\n3.2.\n\nOf the 11 studies, most were conducted in China (n = 7 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n39\n, \n40\n, \n41\n followed by Brazil (n = 2 studies),\n42\n, \n43\n Nigeria (n = 1 study\n44\n),\n44\n and Tanzania (n = 1 study).\n45\n Only one study was nationally representative using census data from Rio Grande do Sul, Brazil.\n42\n At the time of participant recruitment, two studies\n44\n, \n45\n were from low‐income countries while the majority (n = 9 studies)\n35\n, \n36\n, \n37\n, \n38\n, \n39\n, \n40\n, \n41\n, \n42\n, \n43\n were from middle‐income countries. MCI sample size at baseline ranged from n = 21\n42\n to n = 837,\n35\n with a mean of n = 370 (standard deviation [SD] = 295). Most studies included participants aged > 60 years (n = 6 studies),\n37\n, \n38\n, \n39\n, \n40\n, \n41\n, \n42\n while others included those > 55 years (n = 2 studies),\n35\n, \n36\n > 65 years (n = 1 study),\n44\n and > 70 years (n = 2 studies).\n43\n, \n45\n Duration of follow‐up ranged from 2 years\n44\n to 5.8 years,\n42\n with a mean of 3.7 years (SD = 1.1 year). At follow‐up, MCI sample size ranged from n = 21\n42\n to n = 638,\n35\n with a mean of n = 298 (SD = 238).\n\n\n### Diagnostic criteria for MCI\n\n3.3.\n\nMost studies diagnosed MCI using Petersen criteria\n17\n, \n28\n, \n46\n, \n47\n (n = 5 studies).\n35\n, \n36\n, \n38\n, \n40\n, \n41\n Other criteria included the Clinical Dementia Rating scale (CDR 0.5;\n48\n\nn = 1 study),\n43\n Dubois 2004 criteria\n49\n (n = 1 study), \n42\n the criteria from the DSM‐IV\n31\n (n = 2 studies),\n37\n, \n39\n and the International Working Group on MCI criteria\n18\n (n = 1 study).\n45\n Only 1 study\n44\n used the Cognitive Impairment No Dementia (CIND) classification.\n50\n This paper\n44\n reports that of the n = 87 CIND participants, n = 74 were classed as having “medically unexplained memory loss” (MUML) described as comparable to MCI using Petersen criteria.\n51\n For this review, the total sample of n = 87 CIND participants were included. Table 1 shows a description of the MCI diagnostic criteria used across the different studies. The majority of studies classified participants as MCI (n = 9 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n40\n, \n41\n, \n42\n, \n43\n, \n45\n while others subtyped MCI into amnestic MCI (aMCI; n = 2 studies), \n39\n, \n41\n aMCI single domain (n = 1 study),\n41\n aMCI multiple domain (n = 1 study),\n41\n non‐amnestic MCI single domain (n = 1 study),\n41\n and non‐amnestic MCI multiple domain (n = 1 study).\n41\n\n\n**TABLE 1** Study characteristics (grouped by criteria for MCI diagnosis and ordered by age)\n\n\n\u003ctable>\n  \u003cthead>\n    \u003ctr>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"3\">Sample size\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">\u003c/th>\n    \u003c/tr>\n    \u003ctr>\n      \u003cth rowspan=\"1\" colspan=\"1\">Reference\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Country\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Population characteristics\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Age (years)\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Total sample at baseline\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">MCI sample\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">MCI sample at follow up\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Mean Follow‐up (years)\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">MCI Type\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Dementia criteria\u003c/th>\n      \u003cth rowspan=\"1\" colspan=\"1\">Conversion to dementia\u003c/th>\n    \u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">Petersen criteria 17 ,  28 ,  47 ,  81  (n = 5 studies)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Huang et al. 36\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">29 geographically defined communities located within Greater Beijing, China (12 urban and 17 rural)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;55\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">5743\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">175\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">121\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">3\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV (all cause) NINCDS‐ADRDA (AD) NINDS‐AIREN (VaD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">42% (51/121 including n = 29 with AD, n = 18 with VaD and n = 4 with other dementias (after 3 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Li et al. 35\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">10 randomly selected communities in the city of Chongqing\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;55\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">26,481 (18,683 screened)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">837\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">638\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">5\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV (all cause) NINCDS/ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">44·8% (298/638 dementia including n = 298 AD) (after 5 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Ding et al. 41\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Jingansi community in downtown Shanghai, China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;60\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">3141\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">655\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">362\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">4\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI aMCI aMCI‐SD aMCI‐MD naMCI‐SD naMCI‐MD\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV (all cause)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI 6·0 (95% CI: 4·7–7·3) per 100 person‐years (79/362)  aMCI 6·9 (95% CI 5·2–8·6) per 100 person years (59/238)  aMCI‐SD 3·0 (95% CI: 1·6–4·4) per 100 person‐years (17/156)  aMCI‐MD 14·2 (95% CI: 10·2–18·2) per 100 person years (42/82)  naMCI‐SD 2·7 (95% CI: 1·0–4·5) per 100 person‐years (9/91)  naMCI‐MD 8·7 (95% CI: 3·8–13·7) per 100 person‐years (11/33) (after 4 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Yang et al. 40\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Chinese community dwelling elder people\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;60\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">652\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">465\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">465\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">3\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐ IV‐TR (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">16·8% (78/465) (after 3 year follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Yu et al. 38\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">8 geographically convenient communities in Taiyuan city, China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;60\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">6192\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">600\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">518\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">5\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">NINCDS‐ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">17·0% (89/518) (after 5 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">CIND based on Levy and Working Party of the International Psychogeriatric Association in collaboration with the WHO 50  (n = 1 study)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Baiyewu et al. 44\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Nigeria\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Idikan community and adjacent wards of the city of Ibadan, Nigeria\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;65\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">2487\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">152\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">87\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">2\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">CIND\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM III‐R ICD‐10 (all cause)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">16·1% (14/87) developed dementia (after 2 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">CDR 82  (n = 1 study)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Montano et al. 43\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Brazil\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">A community cohort living in an urban district, in São Paulo city\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;70\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">1667\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">80\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">40\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">2.6\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">CDR 0.5\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">NINCDS–ADRDA (all cause)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">37·5% (145.4 per 1,000 person‐years; 15/40) (after follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">IWG 18  (n = 1 study)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Paddick et al. 45\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Tanzania\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">6 randomly selected villages from the Hai District in Northern Tanzania.\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;70\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">296\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">46\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">46\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">4\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV (all cause) NINCDS‐ADRDA (AD) NINDS‐ AIREN (VaD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">37·0% (17/46) all cause (n = 9 AD, n = 4 VaD, n = 2 Parkinson disease dementia &amp; n = 2 mixed aetiology) (after 4 years follow up)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">DSM‐IV Criteria 31  (n = 2 studies)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Yu et al. 37\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">26 military cadres’ sanatoriums of Shijiazhuang city\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;60\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">2674\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">216\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">209\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">3\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV (all cause) NINCDS‐ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">24·4% (51/209) all cause 15·7% (35/209) AD (per year)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Wang et al. 39\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">China\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">9 densely distributed elderly communities in Taiyuan\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;65\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">6152\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">600\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">557\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">3\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">aMCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">NINCDS‐ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">6% (34/557 per year)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"11\">Dubois and Albert, 2004 49  (n = 1 study)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Godhino et al. 42\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Brazil\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">Older community dwelling residents in the catchment area of the Hospital de Clinicas de Porto Alegre, Rio Grande do Sul, Brazil\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">&gt;60\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">245\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">21\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">21\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">5.8\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">MCI\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">DSM‐IV &amp; NINCDS‐ADRDA (AD)\u003c/td>\n      \u003ctd rowspan=\"1\" colspan=\"1\">38·1% (8/21) (after 5.8 years follow up)\u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\nAbbreviations: AD, Alzheimer's disease; aMCI, amnestic mild cognitive impairment; CIND, cognitive impairment no dementia; CDR, Clinical Dementia Rating; DSM‐IV, Diagnostic and Statistical Manual of Mental Disorders Fourth Edition; ICD, International Classification of Diseases; IWG, International Working Group; MCI, mild cognitive impairment; NIA‐AA, National Institute on Aging and Alzheimer's Association; NINCDS‐ADRDA, National Institute of Neurological Disorders and Stroke‐Alzheimer's Disease and Related Disorders Association; NINDS‐AIREN, National Institute of Neurological Disorders and Stroke International Workshop with support from the Association Internationale pour la Recherche et l'Enseignement en Neurosciences; VaD, vascular dementia; WHO, World Health Organization.\n\n\n### Diagnostic criteria for dementia\n\n3.4.\n\nMost studies (n = 7 studies)\n35\n, \n36\n, \n37\n, \n40\n, \n41\n, \n42\n, \n45\n defined incident dementia using the DSM‐IV criteria.\n20\n, \n31\n This was followed by NINCDS‐ADRDA criteria\n49\n, \n52\n (n = 5 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n39\n the NINDS‐AIREN criteria\n32\n (n = 2 studies),\n35\n, \n36\n and DSM‐III‐R criteria\n20\n (n = 1 study\n44\n).\n44\n Studies defined dementia as either all‐cause (n = 7 studies),\n35\n, \n36\n, \n37\n, \n41\n, \n43\n, \n44\n, \n45\n AD (n = 8 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n39\n, \n40\n, \n42\n, \n45\n or vascular dementia (VaD; n = 2 studies). \n36\n, \n45\n One study\n44\n mentioned using International Classification of Diseases (ICD)‐10 criteria from the World Health Organization.\n53\n\n\n### Conversion from MCI to dementia\n\n3.5.\n\nRates of conversion from MCI to dementia ranged from 6.0%\n39\n to 44.8%\n35\n for all‐cause dementia (n = 11 studies) over an average follow‐up of 3.7 years (SD 1.2 years); 6.0%\n35\n, \n39\n to 46.7%\n25\n for AD (n = 8 studies) over an average follow‐up of 4.0 years (SD 1.1 years), and 8.7%\n45\n to 14.9%\n36\n for VaD (n = 2 studies) over an average follow‐up of 3.5 years (SD 0.7 years). Rates of conversion to all‐cause dementia were generally higher for those definitions that captured broader impairment; for example, range of conversion for all‐MCI (n = 8 studies),\n35\n, \n36\n, \n37\n, \n38\n, \n40\n, \n41\n, \n42\n, \n45\n CIND (n = 1 study),\n44\n and CDR (n = 1 study)\n43\n (range 16.8% to 44.8% over 2.0–5.8 years follow‐up) compared to more restricted definitions of single domain MCI; for example, aMCI range 6.0% to 6.9% over an average of 3.5 years follow‐up (n = 2 studies).\n39\n, \n41\n\n\n### Risk factors for dementia\n\n3.6.\n\nRisk factors for MCI conversion to dementia were investigated in 10 (out of 11) studies.\n35\n, \n36\n, \n38\n, \n39\n, \n40\n, \n41\n, \n42\n, \n43\n, \n44\n, \n45\n Significant risks included older age (n = 6/10 studies\n19\n, \n35\n, \n38\n, \n39\n, \n40\n, \n41\n, \n44\n), poor baseline performance on cognitive tests (n = 5/7 studies\n36\n, \n40\n, \n41\n, \n42\n, \n43\n), sex (being female; n = 3/10 studies\n35\n, \n38\n, \n44\n), hypertension (n = 3/6 studies\n35\n, \n38\n, \n39\n), low educational attainment (illiteracy or primary school; n = 2/10 studies\n35\n, \n36\n), anxiety and depression (n = 2/5 studies\n39\n, \n40\n), history of stroke (n = 1/4 studies\n36\n), diabetes (n = 2/4 studies\n35\n, \n39\n), and apolipoprotein E (APOE) ε4 status (n = 2/4 studies\n35\n, \n39\n). Full details of all risk factors assessed in each study are presented in Table S2.\n\n\n### Risk of bias assessment\n\n3.7.\n\nFull details of the risk of bias assessment can be found in Table S3 in supporting information. The included studies averaged 7.3 stars out of 10 (range 5–8). Eight studies (out of 11) scored the maximum of eight stars.\n\n\n### Meta‐analysis—risk of conversion to AD\n\n3.8.\n\nSix studies were included in the meta‐analysis; n = 4 from China\n35\n, \n36\n, \n38\n, \n40\n and n = 1 each from Tanzania\n45\n and Brazil.\n42\n Across the six studies, MCI sample size ranged from n = 21\n42\n to n = 837\n35\n and age from > 55 years\n35\n, \n36\n to > 70 years.\n45\n Figure 2 presents the study‐specific proportion of Petersen‐defined MCI cases that converted to AD over time with 95% CIs for each study as well as the Chinese subgroup and overall pooled estimate with 95% Wald confidence interval and the I2 statistics. As shown, significant intra‐group heterogeneity among China‐based studies was observed (P \u003c .0001 with I2 = 96.54%). When pooling the six studies together conversion to dementia was estimated at 23..8% (95% CI = 15.4%–33.4%) over a range of 3.0–5.8 years.\n\n\n\u003cfigure>\n  \u003cfigcaption>\u003cstrong>FIGURE 2\u003c/strong> Forest plot showing the meta‐analysis of the proportion of the mild cognitive impairment converting to Alzheimer&#x27;s disease. CI, confidence interval; Effect Size (ES), xxxxxxxxx\u003c/figcaption>\n\u003c/figure>\n\n\n\u003cfigure>\n  \u003cfigcaption>\u003cstrong>FIGURE 2\u003c/strong> Forest plot showing the meta‐analysis of the proportion of the mild cognitive impairment converting to Alzheimer&#x27;s disease. CI, confidence interval; Effect Size (ES), xxxxxxxxx\u003c/figcaption>\n\u003c/figure>\n\n\n\n## DISCUSSION\n\n4.\n\nIn this systematic review and meta‐analysis, we found that very few studies on risk of MCI conversion to dementia have been undertaken in LMIC settings. This contrasts to the significant research investment into MCI (and more specially dementia) in HICs. Across the 11 studies, conversion to all‐cause dementia (including all dementia, AD, and VaD) was high and varied, ranging from 6.0% to 44.8% over an average follow‐up of 3,7 years. Similar variability in risk of conversion to dementia has been reported in studies from HICs.\n5\n, \n6\n, \n7\n For studies using Petersen criteria (n = 6), the pooled conversion rate to AD was 23.8% over 3.0 to 5.8 years. This suggesting that approximately one in four people with MCI are at risk of developing AD in LMICs.\n\nWhile risk of dementia in MCI has been studied extensively in HICs, in contrast very little research has been undertaken in LMIC settings. Further, the majority of studies were from China (middle‐income) with data from only three other countries represented including Brazil\n42\n, \n43\n (upper middle income), Nigeria\n44\n (lower middle income), and Tanzania\n45\n (low income). Limited resources for research, including access to funding, and infrastructure to diagnose MCI/dementia in LMIC settings could be possible reasons for this scarcity. However, this is a significant research gap particularly considering the high burden of cognitive impairment and dementia in low‐income country settings.\n25\n Of the studies included in this review, there was also variability in terms of outcome measure (all‐cause dementia vs. AD vs. VaD), length of follow‐up, sample size, and diagnostic criteria for MCI. In addition, the examination of MCI conversion to other dementia subtypes was limited as only AD and VaD were investigated. Therefore, there is an urgent need for future studies to attempt to standardize the methodology used to allow for better cross‐study comparisons, aiming for studies to be population representative and generalizable.\n\nStudies from HICs estimate annual conversion from MCI (irrespective of MCI definition used) to dementia at approximately 3% to 10% in community settings and 10% to 15% in clinical settings.\n5\n, \n16\n, \n17\n, \n18\n, \n54\n Similar to findings from HCIs, conversion rates were found to be variable across the different LMICs sites ranging from 6.0% to 44.8%. Rates of conversion to dementia were generally higher for those definitions that capture broader impairment (e.g., range of conversion for all‐MCI, CIND, and CDR: range 16.8% to 44.8% over 2.0–5.8 years follow‐up) compared to more restricted definitions of single domain MCI (e.g., aMCI range 6.0% to 6.9% over an average of 3.5 years follow‐up).\n55\n, \n56\n, \n57\n, \n58\n, \n59\n, \n60\n, \n61\n Given the high reported prevalence of MCI in LMIC settings\n4\n in addition to the high dementia conversion rates reported here, the development of strategies to prevent or delay dementia progression in those individuals with cognitive impairment could have a significant impact on the burden of disease associated with mental health conditions in these settings.\n\nSimilar to findings from HICs, non‐modifiable risk factors for progression to dementia from MCI included age\n62\n, \n63\n, \n64\n, \n65\n and APOE ε4 allele status.\n51\n, \n66\n, \n67\n Regarding sex, while being female has been found to be associated with increased risk of prevalent MCI,\n4\n and has been associated with higher risk of progression to dementia in HICs,\n68\n only 2 studies\n38\n, \n44\n out of 10 that investigated sex effects found that being female was a risk factor for conversion from MCI to dementia. Research evidence, predominantly from HICs, suggests a putative link between sex and/or educational attainment and cognition.\n69\n, \n70\n, \n71\n, \n72\n However, methodological weaknesses and potential of reverse causality within these studies adds limitations to their interpretation and warrants longitudinal studies with longer follow‐up.\n71\n Furthermore, key modifiable risk factors were also similar to those reported in HIC settings, including poor cardiometabolic health, the presence of vascular risk factors, and poor neuro‐psychiatric health such as the presence of depression.\n23\n, \n62\n, \n73\n Targeting these factors could be an early strategy for not only preventing MCI, but also reducing the burden of dementia. Research evidence suggests that up to 40% of dementia cases may be preventable through targeting 12 modifiable risk factors,\n74\n many of which can be influenced by diet and lifestyle practices.\n75\n, \n76\n Emerging evidence also indicates that non‐pharmacological interventions such as cognitive training may reduce dementia risk.\n77\n Further work is required to identify if these strategies are plausible for those with MCI, and feasible within LMIC settings.\n\nThis is the first study to synthesize research on the risk of dementia in people with MCI in LMIC settings. We undertook a wide literature search capturing many of the different definitions of MCI and included studies of all‐cause dementia and its subtypes. While there was variability in how dementia was diagnosed, most (63.6%) studies used DMS‐IV criteria. However, there are some limitations. The electronic search was undertaken in English and therefore studies published in other languages, including those common in LMICs such as Spanish, Portuguese, and French could have been missed. Although we used a wide search strategy to ensure that we captured all studies on the topic, we did not search the gray literature, which could have resulted in missing non‐published studies highlighting a risk of publication bias. Only a limited number of studies were identified and only one study was from a nationally representative sample.\n42\n This makes it hard to generalize the results especially across different LMIC settings particularly LMIC countries in Eastern Europe, the Middle East, and Global South where no data are currently available. While most studies were associated with low risk of bias, there was variability in study robustness, for example, in terms of MCI diagnosis (including cognitive test used), sample size, and participant selection. While all studies were population‐ or community‐based, there was large heterogeneity in study methodology including definition of MCI, operationalization of MCI criterion, follow‐up time, reporting of conversion rates (annually vs. after number of years of follow‐up), and diagnosis of dementia, all of which could impact the results. In addition, due to the small number of studies included it was not possible to stratify the meta‐analysis by age or follow‐up duration. Last, we should emphasize that the studies in the meta‐analysis are limited to a few studies from three countries only, with different characteristics and profiles of the population. Indeed, heterogeneity was high and possibly reflects differences in sample selection, sample characteristics (age and sex distribution), sample size, and operationalization of MCI criteria (Figure S1 in supporting information). The results support calls for an urgent need to harmonize methodology in MCI and dementia research to improve cross‐study comparability.\n78\n Indeed, future studies could draw on current recommendations\n78\n for harmonization in the methods of conducting dementia and MCI work and intelligent data synthesis in HICs as well as specifically in LMICs including the 10/66 Study protocol\n79\n and the Harmonized Cognitive Assessment Protocol (HCAP),\n80\n all of which outline recommendations for cognitive assessment tools and interviewing methods to improve cross‐study comparability. Until there is agreed‐upon methodology for MCI/dementia research globally, evidence synthesis findings, such as the findings here, should be interpreted with caution.\n\nThere is an urgent need for research investment into robust, population‐representative studies focused on risk of cognitive impairment and dementia in LMICs using harmonized methodology.\n78\n This is necessary to make it possible to campaign for prioritization of funding toward cognitive screening and risk reduction. This would also allow investment in better education and development of infrastructure in these settings to improve knowledge of diagnosis and risk factor management, but also facilitate the implementation of more population representative, robust studies, particularly in countries of low income.\n\nTwo‐thirds of people with dementia live in LMICs, where resources, services, research, and support for older age care are limited and often non‐existent. While dementia is currently incurable, results from HICs suggest that early interventions focused on reducing risk could lessen the number of people who develop dementia in the future. This would result in major health benefits and reduced public spending. As highlighted by this review little comparative data on MCI exists in LMIC settings. The results suggest that MCI is associated with risk of conversion to dementia in LMICs and may be influenced by demographic (e.g., age) and health (e.g., cardiometabolic disease) factors, but more research is needed particularly in low‐income settings.\n\n\n## CONFLICTS OF INTEREST\n\nAndrea M. McGrattan, Eduwin Pakpahan, Mario Siervo, Daniel D. Reidpath, Matthew Prina, Yueping Zhu, Chen Shulin, and Louise Robinson report no relevant disclosures. Authors who have received grants or contracts from any entity in the past 36 months: Devi Mohan—(1) Dementia toolkit for carers (DeToC): A comprehensive toolkit to support carers of people living with dementia in rural communities. Monash University Malaysia ASEAN grant; Role: Principal investigator. (2) Salivary lactoferrin for early identification of sleep related cognitive decline: A potential target for dementia prevention. Monash University Malaysia, School Strategic Grant; Role: Principal investigator. (3) Pathways of Acquired Epilepsy and their Comorbidities: A Translational Crosstalk between HMGB1 Mechanisms and Gut Microbiome. Monash University Malaysia, School Strategic Grant; Role: Co‐Investigator. (4) Global dementias: Examining structural vulnerability and dementia outcomes. Australian Research Council: Discovery Projects; Role: Partner investigator. (5) Investigating Multimorbidity Through capacity building (MUTUAL). MRC UK‐ GCRF Global Multimorbidity—Seed Funding; Ro
