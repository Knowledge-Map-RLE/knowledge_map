{"start": 1292, "end": 2978, "section_id": "H3"}]}}, {"id": "B4", "knowledge_id": "K4", "occurrence_context": null, "duplication": null, "display_text": "Sequential beta- and gamma-secretase cleavage of transmembrane APP releases extracellular Aβ peptides, usually 40–42 residues, which aggregate into oligomers, beta-sheet fibrils and plaques.", "kind": "state", "block_type": "state", "knowledge_kind": "assertion", "is_goal": false, "order": 3, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U9"], "source_spans": [{"start": 1292, "end": 2978, "section_id": "H3"}]}}, {"id": "B5", "knowledge_id": "K5", "occurrence_context": null, "duplication": null, "display_text": "Some studies suggest amyloid pathology reflects asymptomatic preclinical AD more closely, whereas tau tangles track the onset of clinical symptoms more closely.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 4, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U9"], "source_spans": [{"start": 1292, "end": 2978, "section_id": "H3"}]}}, {"id": "B6", "knowledge_id": "K6", "occurrence_context": null, "duplication": null, "display_text": "Anti-amyloid approaches (gamma-secretase inhibition, active immunotherapy and anti-Aβ antibodies) showed promise in animal models, but most mid-to-late clinical studies missed primary endpoints; a selective tau aggregation inhibitor also missed primary outcomes in mild-to-moderate AD.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 5, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U9"], "source_spans": [{"start": 1292, "end": 2978, "section_id": "H3"}]}}, {"id": "B7", "knowledge_id": "K7", "occurrence_context": null, "duplication": null, "display_text": "Evidence reviewed in 2017 implicates cytokine-mediated neuroinflammation in AD development; TNF-α participates in the inflammatory cytokine cascade and may be a therapeutic target.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 6, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U5", "U10"], "source_spans": [{"start": 174, "end": 655, "section_id": "H2"}, {"start": 2980, "end": 3950, "section_id": "H3"}]}}, {"id": "B8", "knowledge_id": "K8", "occurrence_context": null, "duplication": null, "display_text": "TNF-α levels are normally very low in healthy adult peripheral and central systems but are significantly elevated in blood and CNS in AD; clinical and animal studies link excess brain TNF-α to AD.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 7, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U10"], "source_spans": [{"start": 2980, "end": 3950, "section_id": "H3"}]}}, {"id": "B9", "knowledge_id": "K9", "occurrence_context": null, "duplication": null, "display_text": "TNF-α is a nonglycosylated 17-kDa type-II transmembrane monomer in the TNF/TNFR superfamily; membrane homotrimers are cleaved by TNF-α-converting enzyme to soluble 51-kDa trimers.", "kind": "state", "block_type": "state", "knowledge_kind": "definition", "is_goal": false, "order": 8, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U12"], "source_spans": [{"start": 3983, "end": 4613, "section_id": "H4"}]}}, {"id": "B10", "knowledge_id": "K10", "occurrence_context": null, "duplication": null, "display_text": "Brain microglia, neurons and astrocytes can synthesize TNF-α, a cytokine recognized initially for antitumor activity that initiates and propagates inflammation.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 9, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U12"], "source_spans": [{"start": 3983, "end": 4613, "section_id": "H4"}]}}, {"id": "B11", "knowledge_id": "K11", "occurrence_context": null, "duplication": null, "display_text": "TNF-α binds TNFR1 (p55-R) and TNFR2 (p75-R). TNFR1 contains an intracellular death domain, whereas TNFR2 lacks it.", "kind": "state", "block_type": "state", "knowledge_kind": "definition", "is_goal": false, "order": 10, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U13"], "source_spans": [{"start": 4615, "end": 5916, "section_id": "H4"}]}}, {"id": "B12", "knowledge_id": "K12", "occurrence_context": null, "duplication": null, "display_text": "Ubiquitously expressed TNFR1 is activated by soluble or membrane TNF-α; its effects include proliferation, activation, antiviral activity and especially apoptosis and cytotoxicity.", "kind": "state", "block_type": "state", "knowledge_kind": "assertion", "is_goal": false, "order": 11, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U13"], "source_spans": [{"start": 4615, "end": 5916, "section_id": "H4"}]}}, {"id": "B13", "knowledge_id": "K13", "occurrence_context": null, "duplication": null, "display_text": "TNFR2 has higher TNF-α affinity, preferential membrane-TNF activation and low expression mainly in immune/endothelial cells; it can activate cIAP1/2, NF-κB and PI3K-dependent inflammatory and survival pathways.", "kind": "state", "block_type": "state", "knowledge_kind": "assertion", "is_goal": false, "order": 12, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U13"], "source_spans": [{"start": 4615, "end": 5916, "section_id": "H4"}]}}, {"id": "B14", "knowledge_id": "K14", "occurrence_context": null, "duplication": null, "display_text": "TNFR2 may indirectly enhance TNFR1-mediated cytotoxicity but does not induce cytotoxicity alone; the general consensus contrasts pro-apoptotic TNFR1 with survival/proliferation-promoting TNFR2.", "kind": "state", "block_type": "state", "knowledge_kind": "conclusion", "is_goal": false, "order": 13, "rank": 2, "origin": "extracted", "provenance": {"unit_ids": ["U13"], "source_spans": [{"start": 4615, "end": 5916, "section_id": "H4"}]}}, {"id": "B15", "knowledge_id": "K15", "occurrence_context": null, "duplication": null, "display_text": "TNF-α was detected around Aβ plaques in postmortem human AD brains; TNFR1 signaling was required for Aβ-induced neuronal death in subsequent studies.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 14, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U15"], "source_spans": [{"start": 5947, "end": 6991, "section_id": "H5"}]}}, {"id": "B16", "knowledge_id": "K16", "occurrence_context": null, "duplication": null, "display_text": "Compared with nondemented human brains, AD brains had higher TNFR1 and lower TNFR2 protein; TNF-α affinity increased for TNFR1 and decreased for TNFR2.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 15, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U15"], "source_spans": [{"start": 5947, "end": 6991, "section_id": "H5"}]}}, {"id": "B17", "knowledge_id": "K17", "occurrence_context": null, "duplication": null, "display_text": "Genetic association studies implicated chromosome 12p (TNFR1 gene) and chromosome 1p (TNFR2 gene) regions in late-onset Alzheimer disease.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 16, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U15"], "source_spans": [{"start": 5947, "end": 6991, "section_id": "H5"}]}}, {"id": "B18", "knowledge_id": "K18", "occurrence_context": null, "duplication": null, "display_text": "Reported studies found significantly elevated TNF-α in CSF and serum of AD patients, with TNF-α elevation correlated with disease progression.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 17, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U15"], "source_spans": [{"start": 5947, "end": 6991, "section_id": "H5"}]}}, {"id": "B19", "knowledge_id": "K19", "occurrence_context": null, "duplication": null, "display_text": "AD transgenic mice had elevated brain TNF-α, associated with intraneuronal Aβ immunoreactivity in entorhinal cortex and correlated cognitive deficits.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 18, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U16"], "source_spans": [{"start": 6993, "end": 8603, "section_id": "H5"}]}}, {"id": "B20", "knowledge_id": "K20", "occurrence_context": null, "duplication": null, "display_text": "Deleting TNFR1 in AD transgenic mice reduced Aβ formation/plaque burden, BACE1 expression and cognitive deficits; genetic TNFR1 signaling inactivation prevented intraneuronal Aβ accumulation.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 19, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U16"], "source_spans": [{"start": 6993, "end": 8603, "section_id": "H5"}]}}, {"id": "B21", "knowledge_id": "K21", "occurrence_context": null, "duplication": null, "display_text": "Deleting TNFR2 worsened pathology in an AD mouse model; deleting both TNFR1 and TNFR2 exacerbated Aβ/tau pathology, which the review attributes to losing TNFR2 protection.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 20, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U16"], "source_spans": [{"start": 6993, "end": 8603, "section_id": "H5"}]}}, {"id": "B22", "knowledge_id": "K22", "occurrence_context": null, "duplication": null, "display_text": "In mouse AD models TNF-α increased Aβ production through beta-secretase expression and gamma-secretase activity; chronic neuronal TNF-α expression caused extensive neuronal death.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 21, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U16"], "source_spans": [{"start": 6993, "end": 8603, "section_id": "H5"}]}}, {"id": "B23", "knowledge_id": "K23", "occurrence_context": null, "duplication": null, "display_text": "Excess brain TNF-α may enhance Aβ production, inhibit microglial Aβ clearance, cause synaptic dysfunction and neuronal loss, and accelerate cognitive decline; these processes implicate TNF-α across AD stages.", "kind": "state", "block_type": "state", "knowledge_kind": "conclusion", "is_goal": false, "order": 22, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U16", "U17", "U18"], "source_spans": [{"start": 6993, "end": 8603, "section_id": "H5"}, {"start": 8606, "end": 8970, "section_id": "H5"}, {"start": 8973, "end": 9337, "section_id": "H5"}]}}, {"id": "B24", "knowledge_id": "K24", "occurrence_context": null, "duplication": null, "display_text": "FDA-approved biologic TNF inhibitors treat peripheral inflammatory diseases (Crohn disease, rheumatoid arthritis and psoriatic arthritis); examples are infliximab, adalimumab, golimumab, certolizumab and etanercept.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 23, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U20"], "source_spans": [{"start": 9366, "end": 10169, "section_id": "H6"}]}}, {"id": "B25", "knowledge_id": "K25", "occurrence_context": null, "duplication": null, "display_text": "TNF-specific antibodies and etanercept bind soluble and membrane TNF-α and prevent signaling through both receptors; etanercept fuses the TNFR2 extracellular domain to human IgG1 Fc.", "kind": "state", "block_type": "state", "knowledge_kind": "definition", "is_goal": false, "order": 24, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U20"], "source_spans": [{"start": 9366, "end": 10169, "section_id": "H6"}]}}, {"id": "B26", "knowledge_id": "K26", "occurrence_context": null, "duplication": null, "display_text": "Intrahippocampal/intracerebral delivery of recombinant dominant-negative TNF inhibitor in AD transgenic mice inhibited soluble-TNF signaling and reduced preplaque Aβ pathology.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 25, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U21", "U22"], "source_spans": [{"start": 10171, "end": 11683, "section_id": "H6"}, {"start": 11686, "end": 11785, "section_id": "H6"}]}}, {"id": "B27", "knowledge_id": "K27", "occurrence_context": null, "duplication": null, "display_text": "Intracerebroventricular infliximab in mouse AD models reduced TNF-α, amyloid plaques, tau phosphorylation and cognitive deficits.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 26, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U21", "U22"], "source_spans": [{"start": 10171, "end": 11683, "section_id": "H6"}, {"start": 11686, "end": 11785, "section_id": "H6"}]}}, {"id": "B28", "knowledge_id": "K28", "occurrence_context": null, "duplication": null, "display_text": "A small open-label six-month study reported improved ADAS-Cog, Severe Impairment Battery and MMSE after perispinal etanercept 25–50 mg/week in AD patients.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 27, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U21", "U22"], "source_spans": [{"start": 10171, "end": 11683, "section_id": "H6"}, {"start": 11686, "end": 11785, "section_id": "H6"}]}}, {"id": "B29", "knowledge_id": "K29", "occurrence_context": null, "duplication": null, "display_text": "Rapid CSF penetration and nonsynaptic signaling were hypothesized explanations for perispinal etanercept improvement; another study found perispinal accumulation without consistent intracranial delivery.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 28, "rank": 2, "origin": "extracted", "provenance": {"unit_ids": ["U21"], "source_spans": [{"start": 10171, "end": 11683, "section_id": "H6"}]}}, {"id": "B30", "knowledge_id": "K30", "occurrence_context": null, "duplication": null, "display_text": "A female AD case had rapid cognitive improvement after intrathecal infliximab; Table 1 also reports changes in blood/CSF Aβ and tau, without stating their direction.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 29, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U21", "U22"], "source_spans": [{"start": 10171, "end": 11683, "section_id": "H6"}, {"start": 11686, "end": 11785, "section_id": "H6"}]}}, {"id": "B31", "knowledge_id": "K31", "occurrence_context": null, "duplication": null, "display_text": "Larger controlled trials are needed to confirm the encouraging small perispinal/open-label and intrathecal case findings for biologic TNF inhibitors in AD.", "kind": "action", "block_type": "action", "knowledge_kind": "goal", "is_goal": true, "order": 30, "rank": 3, "origin": "extracted", "provenance": {"unit_ids": ["U21", "U29"], "source_spans": [{"start": 10171, "end": 11683, "section_id": "H6"}, {"start": 17346, "end": 18468, "section_id": "H7"}]}}, {"id": "B32", "knowledge_id": "K32", "occurrence_context": null, "duplication": null, "display_text": "Approved biologic TNF inhibitors have limited BBB penetration, and invasive delivery may be unsafe or impractical for chronic AD dosing.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 31, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U5", "U23", "U29"], "source_spans": [{"start": 174, "end": 655, "section_id": "H2"}, {"start": 11787, "end": 12485, "section_id": "H6"}, {"start": 17346, "end": 18468, "section_id": "H7"}]}}, {"id": "B33", "knowledge_id": "K33", "occurrence_context": null, "duplication": null, "display_text": "Peripheral TNF modulation showed promise in transgenic mice, but a small randomized double-blind phase-II trial of weekly subcutaneous etanercept in mild-to-moderate AD found no improvement in cognition, global function or behavior.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 32, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U23"], "source_spans": [{"start": 11787, "end": 12485, "section_id": "H6"}]}}, {"id": "B34", "knowledge_id": "K34", "occurrence_context": null, "duplication": null, "display_text": "Further studies must determine whether modulating peripheral TNF-α improves clinical AD outcomes and how it affects AD pathology.", "kind": "action", "block_type": "action", "knowledge_kind": "goal", "is_goal": true, "order": 33, "rank": 2, "origin": "extracted", "provenance": {"unit_ids": ["U23", "U29"], "source_spans": [{"start": 11787, "end": 12485, "section_id": "H6"}, {"start": 17346, "end": 18468, "section_id": "H7"}]}}, {"id": "B35", "knowledge_id": "K35", "occurrence_context": null, "duplication": null, "display_text": "A BBB molecular Trojan horse is an endogenous peptide or peptidomimetic antibody transported through endogenous receptors such as transferrin or insulin receptors, ferrying an attached biologic into brain.", "kind": "state", "block_type": "state", "knowledge_kind": "definition", "is_goal": false, "order": 34, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U24", "U25", "U26"], "source_spans": [{"start": 12487, "end": 14985, "section_id": "H6"}, {"start": 14988, "end": 15791, "section_id": "H6"}, {"start": 15794, "end": 16597, "section_id": "H6"}]}}, {"id": "B36", "knowledge_id": "K36", "occurrence_context": null, "duplication": null, "display_text": "Engineer a mouse-targeted cTfRMAb-TNFR fusion by joining the TNFR2 extracellular-domain amino terminus to the chimeric transferrin-receptor antibody heavy-chain carboxyl terminus; this leaves the TfR-binding terminus free and TNFR dimeric.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 35, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U24", "U25", "U26"], "source_spans": [{"start": 12487, "end": 14985, "section_id": "H6"}, {"start": 14988, "end": 15791, "section_id": "H6"}, {"start": 15794, "end": 16597, "section_id": "H6"}]}}, {"id": "B37", "knowledge_id": "K37", "occurrence_context": null, "duplication": null, "display_text": "Human and mouse monomeric TNF-α have high amino-acid identity; human TNFR binds mouse TNF-α with high affinity, supporting use of human TNFR in the mouse fusion.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 36, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U24"], "source_spans": [{"start": 12487, "end": 14985, "section_id": "H6"}]}}, {"id": "B38", "knowledge_id": "K38", "occurrence_context": null, "duplication": null, "display_text": "The cTfRMAb-TNFR fusion binds mouse TfR with Kd 2.6±0.3 nM and TNF-α with Kd 96±34 pM.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 37, "rank": 3, "origin": "extracted", "provenance": {"unit_ids": ["U24"], "source_spans": [{"start": 12487, "end": 14985, "section_id": "H6"}]}}, {"id": "B39", "knowledge_id": "K39", "occurrence_context": null, "duplication": null, "display_text": "The bifunctional mouse fusion permits rapid noninvasive transvascular delivery through TfR-mediated transcytosis and, once in brain, sequestration of excess TNF-α.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 38, "rank": 4, "origin": "extracted", "provenance": {"unit_ids": ["U24", "U25", "U26"], "source_spans": [{"start": 12487, "end": 14985, "section_id": "H6"}, {"start": 14988, "end": 15791, "section_id": "H6"}, {"start": 15794, "end": 16597, "section_id": "H6"}]}}, {"id": "B40", "knowledge_id": "K40", "occurrence_context": null, "duplication": null, "display_text": "Pharmacokinetic analysis found intraperitoneal, subcutaneous and intravenous cTfRMAb-TNFR delivery produced brain fusion concentrations 20–50 times pathological brain TNF-α concentrations.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 39, "rank": 3, "origin": "extracted", "provenance": {"unit_ids": ["U24"], "source_spans": [{"start": 12487, "end": 14985, "section_id": "H6"}]}}, {"id": "B41", "knowledge_id": "K41", "occurrence_context": null, "duplication": null, "display_text": "Intravenous delivery is preferred for acute neurological conditions such as ischemic stroke; intraperitoneal/subcutaneous routes are considered more practical for chronic conditions including AD.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 40, "rank": 0, "origin": "extracted", "provenance": {"unit_ids": ["U24"], "source_spans": [{"start": 12487, "end": 14985, "section_id": "H6"}]}}, {"id": "B42", "knowledge_id": "K42", "occurrence_context": null, "duplication": null, "display_text": "The cTfRMAb-TNFR fusion was protective in mouse ischemic-stroke and Parkinson-disease models; its evaluation in an AD mouse model was ongoing.", "kind": "state", "block_type": "state", "knowledge_kind": "observation", "is_goal": false, "order": 41, "rank": 3, "origin": "extracted", "provenance": {"unit_ids": ["U24"], "source_spans": [{"start": 12487, "end": 14985, "section_id": "H6"}]}}, {"id": "B43", "knowledge_id": "K43", "occurrence_context": null, "duplication": null, "display_text": "For potential human use, investigators engineered HIRMAb-TNFR by fusing TNFR2 extracellular domain to a chimeric/humanized human-insulin-receptor antibody; HIRMAb cross-reacts with Old World primate insulin receptors.", "kind": "action", "block_type": "action", "knowledge_kind": "operation", "is_goal": false, "order": 42, "rank": 1, "origin": "extracted", "provenance": {"unit_ids": ["U27"], "source_spans": [{"start": 16599, "end" result", "reason": "The primate dosing and uptake measurement yield the reported quantitative comparison.", "unit_ids": ["U27"], "conditions": []}, {"id": "T21", "sources": ["B48"], "target": "B45", "usage": "result", "reason": "The chronic high-dose primate evaluation yields the limited primate safety observation.", "unit_ids": ["U27"], "conditions": []}, {"id": "T22", "sources": ["B23", "B32", "B33", "B31", "B39"], "target": "B46", "usage": "premise", "reason": "The source's conclusion jointly weighs multifactorial TNF involvement, delivery barriers, unconfirmed clinical efficacy and the noninvasive transport strategy.", "unit_ids": ["U29"], "conditions": []}], "reading_order": ["B1", "B2", "B3", "B5", "B6", "B7", "B8", "B9", "B10", "B11", "B15", "B16", "B17", "B18", "B19", "B20", "B21", "B22", "B24", "B26", "B27", "B30", "B32", "B35", "B37", "B41", "B49", "B50", "B4", "B12", "B13", "B23", "B25", "B28", "B33", "B36", "B43", "B14", "B29", "B34", "B47", "B48", "B31", "B38", "B40", "B42", "B44", "B45", "B39", "B46"], "analysis": {"depth": 6, "layer_counts": {"0": 28, "1": 9, "2": 5, "3": 6, "4": 1, "5": 1}, "concept_count": 99, "canonical_knowledge_count": 50, "occurrence_count": 50, "repeated_occurrence_count": 0, "transition_count": 22, "knowledge_input_count": 39, "statement_count": 69, "operation_count": 8, "isolated_count": 11}}, "source": {"article_id": "pilot-pmc10000452-pmc5436834-10b9d676a760e5df", "text": "# Tumor necrosis factor α Inhibition for Alzheimer’s Disease\n\n**Journal:** Journal of Central Nervous System Disease (2017)\n\n**DOI:** 10.1177/1179573517709278\n\n\n## Abstract\n\nTumor necrosis factor α (TNF-α) plays a central role in the pathophysiology of Alzheimer’s disease (AD). Food and Drug Administration–approved biologic TNF-α inhibitors are thus a potential treatment for AD, but they do not cross the blood-brain barrier. In this short review, we discuss the involvement of TNF-α in AD, challenges associated with the development of existing biologic TNF-α inhibitors for AD, and potential therapeutic strategies for targeting TNF-α for AD therapy.\n\nKeywords: Alzheimer’s disease, TNF-α, blood-brain barrier, biologic TNF-α inhibitors\n\n\n## Introduction\n\nAlzheimer’s disease (AD) is the leading cause of dementia worldwide and represents one of the most serious health issues for the elderly. An estimated 5.4 million Americans have AD, and this number is expected to triple in 2050 due to lack of medical breakthroughs to stop, prevent, or slow the disease.1 Over the years, research efforts have focused extensively on delineating the mechanisms and identifying targets involved in AD pathogenesis; however, to date, no disease-modifying therapy has been clinically approved for AD.\n\nThe 2 major neuropathological hallmarks of AD are extracellular deposition of amyloid beta (Aβ)–containing senile plaques and intracellular tau-containing neurofibrillary tangles (NFTs) in the brain.2 Aβ plaque formation is considered relatively specific to AD pathology; however, NFTs are found associated with other disorders as well.3 Aβ plaque formation involves a cascade of events beginning with the sequential cleavage of the amyloid precursor protein (APP), a large transmembrane protein, by proteolytic enzymes β-secretase and γ-secretase. Cleavage by γ-secretase releases Aβ, peptides which are usually composed of 40 to 42 amino acid residues, into the extracellular space where they aggregate into oligomers, β-sheet–structured fibrils, followed by clumping into Aβ plaques.4 Some studies suggest that Aβ pathology more closely reflects the preclinical (asymptomatic) stage of AD, whereas accumulation of tau tangles more closely reflects the onset of clinical symptoms in AD.5 Among the numerous targets explored to treat AD, anti-Aβ approaches directed toward removal of Aβ and/or decreasing its production (eg, inhibition of γ-secretase, active immunotherapy, and anti-Aβ antibodies) have shown promising results in animal models of AD6–8 and have been at the forefront of AD research. Most of the studies investigating the effects of anti-Aβ approaches have had limited success in mid- to late-stage clinical development and have failed to reach primary clinical end points.9 A recent study investigated the effect of a selective tau aggregation inhibitor in patients with mild-to-moderate AD. This anti-tau approach, however, failed to reach primary outcome measures.10\n\nMore recent research has pivoted focus to cytokine-mediated neuroinflammation as a major contributor to the development of AD, and evidence suggests that inflammation promotes pathological processes that lead to AD.11–13 Among the cytokines involved in neuroinflammation, tumor necrosis factor α (TNF-α) is the most studied and plays an essential role in the cytokine cascade during an inflammatory response. Although the levels of TNF-α in the periphery and central nervous system (CNS) of healthy adults are maintained at very low levels, the levels of this cytokine are significantly elevated in blood14 and CNS12 of patients with AD, and many clinical and animal studies have demonstrated a link between excess TNF-α levels in the brain and AD.15 Here, we focus on the involvement of TNF-α in AD, challenges associated with the development of existing biologic TNF-α inhibitors (TNFIs) for AD, and potential therapeutic strategies for targeting TNF-α for AD therapy.\n\n\n## TNF-α and TNF-α Receptors\n\nTNF-α, first recognized for its antitumor activity,16 is one of the main inflammatory cytokines involved in initiating and propagating an inflammatory response. TNF-α is a monomeric (17 kDa) nonglycosylated type 2 transmembrane protein that belongs to a superfamily of ligand/receptor proteins called the TNF/TNF receptor (TNF/TNFR) superfamily proteins. TNF-α is inserted into the membrane as a homotrimer which is then cleaved into a 51-kDa soluble trimer via proteolytic cleavage by the TNF-α–converting enzyme.17 In the central nervous system, TNF-α can be synthesized in the brain by microglia,18 neurons,19 and astrocytes.20\n\nTNF-α binds to 2 receptor subtypes, TNFR1 (p55-R) and TNFR2 (p75-R), each having distinct signaling pathways differentiated by the presence of an intracellular death domain (DD).21 TNFR1, which contains the DD, is ubiquitously expressed in various cell types and is activated through either soluble TNF-α (sTNF-α) or membrane TNF-α (mTNF-α).22 TNFR1, once activated, is involved in divergent effects including cell proliferation, activation, antiviral activity, and primarily in TNF-α–mediated apoptosis and cytotoxicity. TNFR2 has a higher affinity for TNF-α, is activated preferentially by mTNF-α, and is primarily expressed at low levels by cells of the immune system and endothelial cells.22 TNFR2 lacks the DD and can trigger signaling cascades that activate pro-inflammatory and pro-survival pathways through the activation of the cellular inhibitor of apoptosis proteins 1 and 2, nuclear factor κB, and phosphatidylinositol 3-kinase–dependent signaling pathways.23 Some studies also report an indirect role of TNFR2 in TNF-α–mediated cytotoxicity via the enhancement of TNFR1-mediated cytotoxicity, but no induction of cytotoxicity by TNFR2 alone.24 Overall, the general consensus is that TNFR1 exerts pro-apoptotic functions, whereas TNFR2 typically promotes cell survival and proliferation.23\n\n\n## TNF-α Involvement in AD\n\nThe role of TNF-α in the pathophysiology of AD has been examined both in clinical and animal studies. One of the earliest evidence suggesting the involvement of TNF-α in AD pathophysiology was its presence around the Aβ plaque in postmortem human AD brains.25 Following studies in human AD brains showed that TNFR1 signaling is required for Aβ-induced neuronal death, and although TNFR1 protein levels are significantly greater in AD brains compared with nondemented brains, TNFR2 protein levels are lower.26 Furthermore, an increase in the binding affinity of TNF-α to TNFR1, but a decrease in binding affinity to TNFR2, was observed.26 Genetic association studies showed that chromosome 12p region encoding for the TNFR1 gene and the chromosome 1p region encoding for the TNFR2 gene are associated with late-onset AD.27 The role of TNF-α in AD pathology was further suggested by studies in which significant elevation of TNF-α levels in the cerebrospinal fluid (CSF)28 and serum29,30 of patients with AD correlated with disease progression.30\n\nThe reported clinical findings regarding the role of TNF-α in AD pathology are consistent with observations made in mouse models of AD. Elevated TNF-α levels were observed in the brain tissues of AD transgenic mice.31 Furthermore, elevated TNF-α levels were associated with intraneuronal Aβ immunoreactivity in the entorhinal cortex, and these elevated TNF-α levels correlated with cognitive deficits in AD mice.32 The role of TNF-α signaling in abnormal APP processing, Aβ plaque accumulation, tau-related pathology, and cell death has also been reported. Deletion of TNFR1 in AD transgenic mice lowered Aβ formation, Aβ plaque burden, β-secretase 1 (BACE1) expression, and cognitive deficits.33 However, ablation of both TNFR1 and TNFR2 exacerbated Aβ and tau pathology due to aggravation of TNFR1-mediated AD pathology resulting from silencing of TNFR2.34 Furthermore, genetic inactivation of TNFR1 signaling in AD transgenic mice prevented intraneuronal accumulation of Aβ,35 whereas genetic deletion of TNFR2 exacerbated AD pathology in a transgenic mouse model of AD.36 In AD transgenic mice, TNF-α increased Aβ production through upregulation of both β-secretase expression37 and γ-secretase activity,38 and chronic neuronal TNF-α expression resulted in extensive neuronal cell death.19 Excess TNF-α levels in the brain can disrupt clearance of Aβ by inhibiting microglial clearance of Aβ,39 cause synaptic dysfunction,40 and accelerate disease progression and cognitive decline.41 Overall, TNF-α–driven processes are involved at multiple stages of AD pathophysiology and disease progression (Figure 1).\n\n\n\u003cfigure>\n  \u003cfigcaption>\u003cstrong>Figure 1\u003c/strong> Central role of TNF-α in AD pathophysiology. Elevated TNF-α levels in AD may enhance Aβ production, decrease Aβ clearance, increase neuronal loss and cell death, and are implicated in cognitive decline in AD. Aβ indicates amyloid beta; AD, Alzheimer’s disease; TNF-α, tumor necrosis factor α.\u003c/figcaption>\n\u003c/figure>\n\n\n\u003cfigure>\n  \u003cfigcaption>\u003cstrong>Figure 1\u003c/strong> Central role of TNF-α in AD pathophysiology. Elevated TNF-α levels in AD may enhance Aβ production, decrease Aβ clearance, increase neuronal loss and cell death, and are implicated in cognitive decline in AD. Aβ indicates amyloid beta; AD, Alzheimer’s disease; TNF-α, tumor necrosis factor α.\u003c/figcaption>\n\u003c/figure>\n\n\n## Targeting TNF-α in AD\n\nThe most potent TNFIs are biologic drugs that are Food and Drug Administration (FDA) approved for the treatment of peripheral inflammatory conditions including Crohn disease, rheumatoid arthritis, and psoriatic arthritis. These biologic TNFIs include TNF-α–specific monoclonal antibodies (MAbs) (infliximab, adalimumab, golimumab, and certolizumab), and recombinant fusion proteins (etanercept).15 TNF-α–specific MAbs bind to either mTNF-α or sTNF-α thus preventing TNF-α signaling mediated by both TNFRs. However, recombinant fusion protein TNFI (etanercept) is comprised of the extracellular domain (ECD) of the TNFR2 fused to the c-terminal of the Fc domain of human IgG1. The fusion protein also binds to both mTNF-α and sTNF-α with high affinity preventing TNF-α signaling mediated by both TNFRs.23\n\nThe protective effects of TNF-α inhibition using these biologic TNFIs have been demonstrated both in clinical and experimental AD (Table 1). Inhibition of sTNF-α signaling by intracerebral infusion of a dominant negative TNFI prevented preplaque Aβ-associated pathology in a transgenic mouse model of AD.35 Intracerebroventricular injection of the anti-TNF-α MAb, infliximab, reduced TNF-α levels, Aβ plaques and tau-phosphorylation,42 and cognitive deficits43,44 in mouse models of AD. In a small open-label 6-month study in humans, perispinal etanercept administration (dose range: 25–50 mg per week) resulted in significant improvement in 3 standard measures of cognition: the AD Assessment Scale-Cognitive Subscale, the Severe Impairment Battery, and the Mini-Mental State Examination in patients with AD.45 These observed clinical improvements are hypothesized to be due to rapid penetration of etanercept into the CSF following perispinal administration and mediated by nonsynaptic signal transduction mechanisms of etanercept. However, in a recent study, perispinal injection of etanercept resulted in perispinal drug accumulation, but consistent intracranial delivery of the drug was not observed.46 In a recent case report, intrathecal administration of infliximab resulted in rapid cognitive improvement in a female patient with AD,47 and larger controlled trials are warranted. Collectively, both clinical and preclinical evidence underscore the therapeutic potential of biologic TNFIs for AD therapy.\n\n\n**Table 1** Summary of studies focusing on neutralization of brain TNF-α with biologic TNFIs in AD.\n\nOne hindrance to the further development of the FDA-approved biologic TNFIs for AD is their limited blood-brain barrier (BBB) penetration,48 and invasive delivery approaches may not be practical or safe for chronic dosing for AD. Recently, modulation of peripheral TNF-α activity by biologic TNFIs has shown promise in transgenic mouse models of AD49; however, in a randomized double-blind phase 2 clinical trial, weekly subcutaneous injections of etanercept did not improve cognition, global function, or behavior in a small group of subjects with mild-to-moderate AD dementia.50 Further studies will be needed to determine whether peripheral modulation of TNF-α offers clinical improvement in AD.\n\nBiologic drugs such as etanercept, ECD of the TNFR2, can be reengineered to enable BBB penetration by fusion of the biologic drug to a BBB molecular Trojan horse (MTH).51 A BBB MTH is an endogenous peptide or peptidomimetic monoclonal antibody that undergoes receptor-mediated transport across the BBB via endogenous peptide receptors, such as the transferrin receptor (TfR) or the insulin receptor. This binding triggers receptor-mediated transport of the MAb across the BBB, which ferries the biologic drug into the brain.52 One such BBB-penetrating TNFR, specific for the mouse, has been engineered and tested in mouse models of neurological diseases (Figure 2). The amino terminus of the human TNFR2 ECD is fused to the carboxyl terminal of the heavy chain of the chimeric TfRMAb to engineer a fusion protein designated as cTfRMAb-TNFR.53 This orientation frees the amino terminus of the cTfRMAb that is involved in binding to the BBB TfR and places the TNFR ECD in a dimeric configuration. Because both human and mouse monomeric TNF-α share high amino acid identity, and the human TNFR binds mouse TNF-α with high affinity,54 the cTfRMAb-TNFR fusion protein involves the human TNFR and not the mouse TNFR. The cTfRMAb-TNFR fusion protein binds to both the mouse TfR and TNF-α with high affinity evident from the low binding constants (Kd = 2.6 ± 0.3 nM for mouse TfR and 96 ± 34 pM for TNF-α). The cTfRMAb-TNFR is thus a bifunctional molecule that allows (a) rapid noninvasive transvascular delivery of the TNFR across the BBB using a receptor-mediated transcytosis approach and (b) once in the brain, the TNFR can sequester excess TNF-α. A complete pharmacokinetic analysis of this BBB-penetrating biologic TNFI, the cTfRMAb-TNFR fusion protein, showed that systemic routes (intraperitoneal, subcutaneous, or intravenous) of administration result in brain concentrations of the cTfRMAb-TNFR fusion protein that are 20-fold to 50-fold greater than the concentration of TNF-α in pathologic conditions of the brain.55 The intravenous route of administration is preferred for acute neurological conditions, such as ischemic stroke, whereas the intraperitoneal or subcutaneous routes of administration are more practical for dosing during chronic conditions including AD. The cTfRMAb-TNFR fusion protein was found to be protective in both acute (ischemic stroke) and chronic (Parkinson disease) mouse models of neurological diseases56–58 and is currently being investigated in a mouse model of AD.\n\n\n\u003cfigure>\n  \u003cfigcaption>\u003cstrong>Figure 2\u003c/strong> Schematic of the molecular Trojan horse (MTH) technology to ferry biologic TNF-α inhibitors (TNFIs) into the brain. The TNFI of interest in the figure is a tumor necrosis factor α receptor (TNFR). A fusion protein of TNFR and a blood-brain barrier (BBB) MTH, such as the chimeric monoclonal antibody against the mouse transferrin receptor (cTfRMAb), can be engineered and this is designated as cTfRMAb-TNFR. Following systemic injection, the cTfRMAb-TNFR fusion protein binds to the BBB transferrin receptor (TfR)1 and is transported across the BBB from blood to brain via the BBB TfR that undergoes receptor-mediated transcytosis.2 Once in the brain, the TNFR domain of the fusion protein can sequester excess TNF-α in the brain.3\u003c/figcaption>\n\u003c/figure>\n\n\n\u003cfigure>\n  \u003cfigcaption>\u003cstrong>Figure 2\u003c/strong> Schematic of the molecular Trojan horse (MTH) technology to ferry biologic TNF-α inhibitors (TNFIs) into the brain. The TNFI of interest in the figure is a tumor necrosis factor α receptor (TNFR). A fusion protein of TNFR and a blood-brain barrier (BBB) MTH, such as the chimeric monoclonal antibody against the mouse transferrin receptor (cTfRMAb), can be engineered and this is designated as cTfRMAb-TNFR. Following systemic injection, the cTfRMAb-TNFR fusion protein binds to the BBB transferrin receptor (TfR)1 and is transported across the BBB from blood to brain via the BBB TfR that undergoes receptor-mediated transcytosis.2 Once in the brain, the TNFR domain of the fusion protein can sequester excess TNF-α in the brain.3\u003c/figcaption>\n\u003c/figure>\n\nFor use in humans, a fusion protein of the ECD of the TNFR2 and a chimeric or humanized antibody against the human insulin receptor (HIRMAb), designated as the HIRMAb-TNFR fusion protein, has been engineered.48 The HIRMAb is the most potent MTH engineered for the human brain and cross-reacts with the insulin receptor of the Old World primates. In rhesus monkeys, the brain uptake of a 0.2 mg/kg dose of the HIRMAb-TNFR fusion protein after intravenous injection was 3 ± 0.1% ID/100 g brain compared with the brain uptake of the TNFR:Fc fusion protein which was 0.23 ± 0.06% ID/100 g brain. Furthermore, chronic administration of a high dose (20 mg/kg) of a HIRMAb-based fusion protein was found to be safe in rhesus monkeys.59\n\n\n## Conclusions\n\nA plethora of clinical and animal studies strongly suggest an involvement of TNF-α in the pathophysiology of AD. The FDA-approved biologic TNFIs are thus a potential treatment for AD; however, these large molecules have limited BBB penetration. Clinical studies using the perispinal route of administration for biologic TNFIs have shown encouraging results in small open-label trials; however, larger controlled trials are required to confirm these results. Another approach currently under investigation is to target peripheral TNF-α rather than brain TNF-α. However, this approach has not shown any cognitive improvement in a clinical setting so far, and further studies are required to determine the effect of peripheral TNF-α modulation on AD pathology. Novel drug delivery strategies, such as the MTH technology, enable noninvasive delivery of biologic TNFIs to the brain and target both peripheral and brain TNF-α. Considering the multifactorial role of brain TNF-α in AD pathophysiology, such noninvasive drug delivery strategies may be a reasonable approach to deliver biologic TNFIs to the brain for AD treatment.\n\n\n## Footnotes\n\nPEER REVIEW: Five peer reviewers contributed to the peer review report. Reviewers’ reports totaled 858 words, excluding any confidential comments to the academic editor.\n\nFUNDING: The author(s) disclosed receipt of the following financial support for the research, authorship, and/or publication of this article: This work is funded by the Alzheimer’s Association grant RG-15-361188 (R.K.S.).\n\nDECLARATION OF CONFLICTING INTERESTS: The author(s) declared no potential conflicts of interest with respect to the research, authorship, and/or publication of this article.\n\nAuthor ContributionsRC wrote the first draft of the manuscript. RC, K-LY, and RKS contributed to the writing of the manuscript and agree with manuscript results and conclusions. RKS developed the structure and arguments for the paper and made critical revisions and approved the final version. All authors reviewed and approved the final manuscript.\n\nDisclosures and EthicsAs a requirement of publication, author(s) have provided to the publisher signed confirmation of compliance with legal and ethical obligations including but not limited to the following: authorship and contributorship, conflicts of interest, privacy and confidentiality, and (where applicable) protection of human and animal research subjects. The authors have read and confirmed their agreement with the ICMJE authorship and conflict of interest criteria. The authors have also confirmed that this article is unique and not under consideration or published in any other publication, and that they have permission from rights holders to reproduce any copyrighted material. The external blind peer reviewers report no conflicts of interest.\n\n\n\n## REFERENCES\n\n\n\n\n## References\n\n1. Alzheimer’s Association  Alzheimer’s disease facts and figures. Alzheimers Dement. 2016;2016;12:459–509. doi: 10.1016/j.jalz.2016.03.001
