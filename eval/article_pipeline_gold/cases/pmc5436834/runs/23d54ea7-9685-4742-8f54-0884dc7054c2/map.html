usion protein. J Cereb Blood Flow Metab. 2012;32:1933–1938. doi: 10.1038/jcbfm.2012.97.\n\n57. Zhou QH, Sumbria R, Hui EK, Lu JZ, Boado RJ, Pardridge WM. Neuroprotection with a brain-penetrating biologic tumor necrosis factor inhibitor. J Pharmacol Exp Ther. 2011;339:618–623. doi: 10.1124/jpet.111.185876.\n\n58. Sumbria RK, Boado RJ, Pardridge WM. Combination stroke therapy in the mouse with blood-brain barrier penetrating IgG-GDNF and IgG-TNF decoy receptor fusion proteins. Brain Res. 2013;1507:91–96. doi: 10.1016/j.brainres.2013.02.022.\n\n59. Boado RJ, Hui EK, Lu JZ, Pardridge WM. AGT-181: expression in CHO cells and pharmacokinetics, safety, and plasma iduronidase enzyme activity in Rhesus monkeys. J Biotechnol. 2009;144:135–141. doi: 10.1016/j.jbiotec.2009.08.019.\n", "sha256": "10b9d676a760e5dff9c20a7858f3f795e0fa60adf931a02b82a3b02089df905a", "offset_encoding": "unicode_codepoints", "content_end": 20167, "references_excluded": true, "sections": [{"id": "H1", "title": "Tumor necrosis factor α Inhibition for Alzheimer’s Disease", "start": 0, "end": 161}, {"id": "H2", "title": "Abstract", "start": 161, "end": 744}, {"id": "H3", "title": "Introduction", "start": 744, "end": 3953}, {"id": "H4", "title": "TNF-α and TNF-α Receptors", "start": 3953, "end": 5919}, {"id": "H5", "title": "TNF-α Involvement in AD", "start": 5919, "end": 9340}, {"id": "H6", "title": "Targeting TNF-α in AD", "start": 9340, "end": 17330}, {"id": "H7", "title": "Conclusions", "start": 17330, "end": 18471}, {"id": "H8", "title": "Footnotes", "start": 18471, "end": 20167}], "units": [{"id": "U1", "start": 0, "end": 60, "section_id": "H1", "text": "# Tumor necrosis factor α Inhibition for Alzheimer’s Disease"}, {"id": "U2", "start": 62, "end": 123, "section_id": "H1", "text": "**Journal:** Journal of Central Nervous System Disease (2017)"}, {"id": "U3", "start": 125, "end": 158, "section_id": "H1", "text": "**DOI:** 10.1177/1179573517709278"}, {"id": "U4", "start": 161, "end": 172, "section_id": "H2", "text": "## Abstract"}, {"id": "U5", "start": 174, "end": 655, "section_id": "H2", "text": "Tumor necrosis factor α (TNF-α) plays a central role in the pathophysiology of Alzheimer’s disease (AD). Food and Drug Administration–approved biologic TNF-α inhibitors are thus a potential treatment for AD, but they do not cross the blood-brain barrier. In this short review, we discuss the involvement of TNF-α in AD, challenges associated with the development of existing biologic TNF-α inhibitors for AD, and potential therapeutic strategies for targeting TNF-α for AD therapy."}, {"id": "U6", "start": 657, "end": 741, "section_id": "H2", "text": "Keywords: Alzheimer’s disease, TNF-α, blood-brain barrier, biologic TNF-α inhibitors"}, {"id": "U7", "start": 744, "end": 759, "section_id": "H3", "text": "## Introduction"}, {"id": "U8", "start": 761, "end": 1290, "section_id": "H3", "text": "Alzheimer’s disease (AD) is the leading cause of dementia worldwide and represents one of the most serious health issues for the elderly. An estimated 5.4 million Americans have AD, and this number is expected to triple in 2050 due to lack of medical breakthroughs to stop, prevent, or slow the disease.1 Over the years, research efforts have focused extensively on delineating the mechanisms and identifying targets involved in AD pathogenesis; however, to date, no disease-modifying therapy has been clinically approved for AD."}, {"id": "U9", "start": 1292, "end": 2978, "section_id": "H3", "text": "The 2 major neuropathological hallmarks of AD are extracellular deposition of amyloid beta (Aβ)–containing senile plaques and intracellular tau-containing neurofibrillary tangles (NFTs) in the brain.2 Aβ plaque formation is considered relatively specific to AD pathology; however, NFTs are found associated with other disorders as well.3 Aβ plaque formation involves a cascade of events beginning with the sequential cleavage of the amyloid precursor protein (APP), a large transmembrane protein, by proteolytic enzymes β-secretase and γ-secretase. Cleavage by γ-secretase releases Aβ, peptides which are usually composed of 40 to 42 amino acid residues, into the extracellular space where they aggregate into oligomers, β-sheet–structured fibrils, followed by clumping into Aβ plaques.4 Some studies suggest that Aβ pathology more closely reflects the preclinical (asymptomatic) stage of AD, whereas accumulation of tau tangles more closely reflects the onset of clinical symptoms in AD.5 Among the numerous targets explored to treat AD, anti-Aβ approaches directed toward removal of Aβ and/or decreasing its production (eg, inhibition of γ-secretase, active immunotherapy, and anti-Aβ antibodies) have shown promising results in animal models of AD6–8 and have been at the forefront of AD research. Most of the studies investigating the effects of anti-Aβ approaches have had limited success in mid- to late-stage clinical development and have failed to reach primary clinical end points.9 A recent study investigated the effect of a selective tau aggregation inhibitor in patients with mild-to-moderate AD. This anti-tau approach, however, failed to reach primary outcome measures.10"}, {"id": "U10", "start": 2980, "end": 3950, "section_id": "H3", "text": "More recent research has pivoted focus to cytokine-mediated neuroinflammation as a major contributor to the development of AD, and evidence suggests that inflammation promotes pathological processes that lead to AD.11–13 Among the cytokines involved in neuroinflammation, tumor necrosis factor α (TNF-α) is the most studied and plays an essential role in the cytokine cascade during an inflammatory response. Although the levels of TNF-α in the periphery and central nervous system (CNS) of healthy adults are maintained at very low levels, the levels of this cytokine are significantly elevated in blood14 and CNS12 of patients with AD, and many clinical and animal studies have demonstrated a link between excess TNF-α levels in the brain and AD.15 Here, we focus on the involvement of TNF-α in AD, challenges associated with the development of existing biologic TNF-α inhibitors (TNFIs) for AD, and potential therapeutic strategies for targeting TNF-α for AD therapy."}, {"id": "U11", "start": 3953, "end": 3981, "section_id": "H4", "text": "## TNF-α and TNF-α Receptors"}, {"id": "U12", "start": 3983, "end": 4613, "section_id": "H4", "text": "TNF-α, first recognized for its antitumor activity,16 is one of the main inflammatory cytokines involved in initiating and propagating an inflammatory response. TNF-α is a monomeric (17 kDa) nonglycosylated type 2 transmembrane protein that belongs to a superfamily of ligand/receptor proteins called the TNF/TNF receptor (TNF/TNFR) superfamily proteins. TNF-α is inserted into the membrane as a homotrimer which is then cleaved into a 51-kDa soluble trimer via proteolytic cleavage by the TNF-α–converting enzyme.17 In the central nervous system, TNF-α can be synthesized in the brain by microglia,18 neurons,19 and astrocytes.20"}, {"id": "U13", "start": 4615, "end": 5916, "section_id": "H4", "text": "TNF-α binds to 2 receptor subtypes, TNFR1 (p55-R) and TNFR2 (p75-R), each having distinct signaling pathways differentiated by the presence of an intracellular death domain (DD).21 TNFR1, which contains the DD, is ubiquitously expressed in various cell types and is activated through either soluble TNF-α (sTNF-α) or membrane TNF-α (mTNF-α).22 TNFR1, once activated, is involved in divergent effects including cell proliferation, activation, antiviral activity, and primarily in TNF-α–mediated apoptosis and cytotoxicity. TNFR2 has a higher affinity for TNF-α, is activated preferentially by mTNF-α, and is primarily expressed at low levels by cells of the immune system and endothelial cells.22 TNFR2 lacks the DD and can trigger signaling cascades that activate pro-inflammatory and pro-survival pathways through the activation of the cellular inhibitor of apoptosis proteins 1 and 2, nuclear factor κB, and phosphatidylinositol 3-kinase–dependent signaling pathways.23 Some studies also report an indirect role of TNFR2 in TNF-α–mediated cytotoxicity via the enhancement of TNFR1-mediated cytotoxicity, but no induction of cytotoxicity by TNFR2 alone.24 Overall, the general consensus is that TNFR1 exerts pro-apoptotic functions, whereas TNFR2 typically promotes cell survival and proliferation.23"}, {"id": "U14", "start": 5919, "end": 5945, "section_id": "H5", "text": "## TNF-α Involvement in AD"}, {"id": "U15", "start": 5947, "end": 6991, "section_id": "H5", "text": "The role of TNF-α in the pathophysiology of AD has been examined both in clinical and animal studies. One of the earliest evidence suggesting the involvement of TNF-α in AD pathophysiology was its presence around the Aβ plaque in postmortem human AD brains.25 Following studies in human AD brains showed that TNFR1 signaling is required for Aβ-induced neuronal death, and although TNFR1 protein levels are significantly greater in AD brains compared with nondemented brains, TNFR2 protein levels are lower.26 Furthermore, an increase in the binding affinity of TNF-α to TNFR1, but a decrease in binding affinity to TNFR2, was observed.26 Genetic association studies showed that chromosome 12p region encoding for the TNFR1 gene and the chromosome 1p region encoding for the TNFR2 gene are associated with late-onset AD.27 The role of TNF-α in AD pathology was further suggested by studies in which significant elevation of TNF-α levels in the cerebrospinal fluid (CSF)28 and serum29,30 of patients with AD correlated with disease progression.30"}, {"id": "U16", "start": 6993, "end": 8603, "section_id": "H5", "text": "The reported clinical findings regarding the role of TNF-α in AD pathology are consistent with observations made in mouse models of AD. Elevated TNF-α levels were observed in the brain tissues of AD transgenic mice.31 Furthermore, elevated TNF-α levels were associated with intraneuronal Aβ immunoreactivity in the entorhinal cortex, and these elevated TNF-α levels correlated with cognitive deficits in AD mice.32 The role of TNF-α signaling in abnormal APP processing, Aβ plaque accumulation, tau-related pathology, and cell death has also been reported. Deletion of TNFR1 in AD transgenic mice lowered Aβ formation, Aβ plaque burden, β-secretase 1 (BACE1) expression, and cognitive deficits.33 However, ablation of both TNFR1 and TNFR2 exacerbated Aβ and tau pathology due to aggravation of TNFR1-mediated AD pathology resulting from silencing of TNFR2.34 Furthermore, genetic inactivation of TNFR1 signaling in AD transgenic mice prevented intraneuronal accumulation of Aβ,35 whereas genetic deletion of TNFR2 exacerbated AD pathology in a transgenic mouse model of AD.36 In AD transgenic mice, TNF-α increased Aβ production through upregulation of both β-secretase expression37 and γ-secretase activity,38 and chronic neuronal TNF-α expression resulted in extensive neuronal cell death.19 Excess TNF-α levels in the brain can disrupt clearance of Aβ by inhibiting microglial clearance of Aβ,39 cause synaptic dysfunction,40 and accelerate disease progression and cognitive decline.41 Overall, TNF-α–driven processes are involved at multiple stages of AD pathophysiology and disease progression (Figure 1)."}, {"id": "U17", "start": 8606, "end": 8970, "section_id": "H5", "text": "\u003cfigure>\n  \u003cfigcaption>\u003cstrong>Figure 1\u003c/strong> Central role of TNF-α in AD pathophysiology. Elevated TNF-α levels in AD may enhance Aβ production, decrease Aβ clearance, increase neuronal loss and cell death, and are implicated in cognitive decline in AD. Aβ indicates amyloid beta; AD, Alzheimer’s disease; TNF-α, tumor necrosis factor α.\u003c/figcaption>\n\u003c/figure>"}, {"id": "U18", "start": 8973, "end": 9337, "section_id": "H5", "text": "\u003cfigure>\n  \u003cfigcaption>\u003cstrong>Figure 1\u003c/strong> Central role of TNF-α in AD pathophysiology. Elevated TNF-α levels in AD may enhance Aβ production, decrease Aβ clearance, increase neuronal loss and cell death, and are implicated in cognitive decline in AD. Aβ indicates amyloid beta; AD, Alzheimer’s disease; TNF-α, tumor necrosis factor α.\u003c/figcaption>\n\u003c/figure>"}, {"id": "U19", "start": 9340, "end": 9364, "section_id": "H6", "text": "## Targeting TNF-α in AD"}, {"id": "U20", "start": 9366, "end": 10169, "section_id": "H6", "text": "The most potent TNFIs are biologic drugs that are Food and Drug Administration (FDA) approved for the treatment of peripheral inflammatory conditions including Crohn disease, rheumatoid arthritis, and psoriatic arthritis. These biologic TNFIs include TNF-α–specific monoclonal antibodies (MAbs) (infliximab, adalimumab, golimumab, and certolizumab), and recombinant fusion proteins (etanercept).15 TNF-α–specific MAbs bind to either mTNF-α or sTNF-α thus preventing TNF-α signaling mediated by both TNFRs. However, recombinant fusion protein TNFI (etanercept) is comprised of the extracellular domain (ECD) of the TNFR2 fused to the c-terminal of the Fc domain of human IgG1. The fusion protein also binds to both mTNF-α and sTNF-α with high affinity preventing TNF-α signaling mediated by both TNFRs.23"}, {"id": "U21", "start": 10171, "end": 11683, "section_id": "H6", "text": "The protective effects of TNF-α inhibition using these biologic TNFIs have been demonstrated both in clinical and experimental AD (Table 1). Inhibition of sTNF-α signaling by intracerebral infusion of a dominant negative TNFI prevented preplaque Aβ-associated pathology in a transgenic mouse model of AD.35 Intracerebroventricular injection of the anti-TNF-α MAb, infliximab, reduced TNF-α levels, Aβ plaques and tau-phosphorylation,42 and cognitive deficits43,44 in mouse models of AD. In a small open-label 6-month study in humans, perispinal etanercept administration (dose range: 25–50 mg per week) resulted in significant improvement in 3 standard measures of cognition: the AD Assessment Scale-Cognitive Subscale, the Severe Impairment Battery, and the Mini-Mental State Examination in patients with AD.45 These observed clinical improvements are hypothesized to be due to rapid penetration of etanercept into the CSF following perispinal administration and mediated by nonsynaptic signal transduction mechanisms of etanercept. However, in a recent study, perispinal injection of etanercept resulted in perispinal drug accumulation, but consistent intracranial delivery of the drug was not observed.46 In a recent case report, intrathecal administration of infliximab resulted in rapid cognitive improvement in a female patient with AD,47 and larger controlled trials are warranted. Collectively, both clinical and preclinical evidence underscore the therapeutic potential of biologic TNFIs for AD therapy."}, {"id": "U22", "start": 11686, "end": 11785, "section_id": "H6", "text": "**Table 1** Summary of studies focusing on neutralization of brain TNF-α with biologic TNFIs in AD."}, {"id": "U23", "start": 11787, "end": 12485, "section_id": "H6", "text": "One hindrance to the further development of the FDA-approved biologic TNFIs for AD is their limited blood-brain barrier (BBB) penetration,48 and invasive delivery approaches may not be practical or safe for chronic dosing for AD. Recently, modulation of peripheral TNF-α activity by biologic TNFIs has shown promise in transgenic mouse models of AD49; however, in a randomized double-blind phase 2 clinical trial, weekly subcutaneous injections of etanercept did not improve cognition, global function, or behavior in a small group of subjects with mild-to-moderate AD dementia.50 Further studies will be needed to determine whether peripheral modulation of TNF-α offers clinical improvement in AD."}, {"id": "U24", "start": 12487, "end": 14985, "section_id": "H6", "text": "Biologic drugs such as etanercept, ECD of the TNFR2, can be reengineered to enable BBB penetration by fusion of the biologic drug to a BBB molecular Trojan horse (MTH).51 A BBB MTH is an endogenous peptide or peptidomimetic monoclonal antibody that undergoes receptor-mediated transport across the BBB via endogenous peptide receptors, such as the transferrin receptor (TfR) or the insulin receptor. This binding triggers receptor-mediated transport of the MAb across the BBB, which ferries the biologic drug into the brain.52 One such BBB-penetrating TNFR, specific for the mouse, has been engineered and tested in mouse models of neurological diseases (Figure 2). The amino terminus of the human TNFR2 ECD is fused to the carboxyl terminal of the heavy chain of the chimeric TfRMAb to engineer a fusion protein designated as cTfRMAb-TNFR.53 This orientation frees the amino terminus of the cTfRMAb that is involved in binding to the BBB TfR and places the TNFR ECD in a dimeric configuration. Because both human and mouse monomeric TNF-α share high amino acid identity, and the human TNFR binds mouse TNF-α with high affinity,54 the cTfRMAb-TNFR fusion protein involves the human TNFR and not the mouse TNFR. The cTfRMAb-TNFR fusion protein binds to both the mouse TfR and TNF-α with high affinity evident from the low binding constants (Kd = 2.6 ± 0.3 nM for mouse TfR and 96 ± 34 pM for TNF-α). The cTfRMAb-TNFR is thus a bifunctional molecule that allows (a) rapid noninvasive transvascular delivery of the TNFR across the BBB using a receptor-mediated transcytosis approach and (b) once in the brain, the TNFR can sequester excess TNF-α. A complete pharmacokinetic analysis of this BBB-penetrating biologic TNFI, the cTfRMAb-TNFR fusion protein, showed that systemic routes (intraperitoneal, subcutaneous, or intravenous) of administration result in brain concentrations of the cTfRMAb-TNFR fusion protein that are 20-fold to 50-fold greater than the concentration of TNF-α in pathologic conditions of the brain.55 The intravenous route of administration is preferred for acute neurological conditions, such as ischemic stroke, whereas the intraperitoneal or subcutaneous routes of administration are more practical for dosing during chronic conditions including AD. The cTfRMAb-TNFR fusion protein was found to be protective in both acute (ischemic stroke) and chronic (Parkinson disease) mouse models of neurological diseases56–58 and is currently being investigated in a mouse model of AD."}, {"id": "U25", "start": 14988, "end": 15791, "section_id": "H6", "text": "\u003cfigure>\n  \u003cfigcaption>\u003cstrong>Figure 2\u003c/strong> Schematic of the molecular Trojan horse (MTH) technology to ferry biologic TNF-α inhibitors (TNFIs) into the brain. The TNFI of interest in the figure is a tumor necrosis factor α receptor (TNFR). A fusion protein of TNFR and a blood-brain barrier (BBB) MTH, such as the chimeric monoclonal antibody against the mouse transferrin receptor (cTfRMAb), can be engineered and this is designated as cTfRMAb-TNFR. Following systemic injection, the cTfRMAb-TNFR fusion protein binds to the BBB transferrin receptor (TfR)1 and is transported across the BBB from blood to brain via the BBB TfR that undergoes receptor-mediated transcytosis.2 Once in the brain, the TNFR domain of the fusion protein can sequester excess TNF-α in the brain.3\u003c/figcaption>\n\u003c/figure>"}, {"id": "U26", "start": 15794, "end": 16597, "section_id": "H6", "text": "\u003cfigure>\n  \u003cfigcaption>\u003cstrong>Figure 2\u003c/strong> Schematic of the molecular Trojan horse (MTH) technology to ferry biologic TNF-α inhibitors (TNFIs) into the brain. The TNFI of interest in the figure is a tumor necrosis factor α receptor (TNFR). A fusion protein of TNFR and a blood-brain barrier (BBB) MTH, such as the chimeric monoclonal antibody against the mouse transferrin receptor (cTfRMAb), can be engineered and this is designated as cTfRMAb-TNFR. Following systemic injection, the cTfRMAb-TNFR fusion protein binds to the BBB transferrin receptor (TfR)1 and is transported across the BBB from blood to brain via the BBB TfR that undergoes receptor-mediated transcytosis.2 Once in the brain, the TNFR domain of the fusion protein can sequester excess TNF-α in the brain.3\u003c/figcaption>\n\u003c/figure>"}, {"id": "U27", "start": 16599, "end": 17327, "section_id": "H6", "text": "For use in humans, a fusion protein of the ECD of the TNFR2 and a chimeric or humanized antibody against the human insulin receptor (HIRMAb), designated as the HIRMAb-TNFR fusion protein, has been engineered.48 The HIRMAb is the most potent MTH engineered for the human brain and cross-reacts with the insulin receptor of the Old World primates. In rhesus monkeys, the brain uptake of a 0.2 mg/kg dose of the HIRMAb-TNFR fusion protein after intravenous injection was 3 ± 0.1% ID/100 g brain compared with the brain uptake of the TNFR:Fc fusion protein which was 0.23 ± 0.06% ID/100 g brain. Furthermore, chronic administration of a high dose (20 mg/kg) of a HIRMAb-based fusion protein was found to be safe in rhesus monkeys.59"}, {"id": "U28", "start": 17330, "end": 17344, "section_id": "H7", "text": "## Conclusions"}, {"id": "U29", "start": 17346, "end": 18468, "section_id": "H7", "text": "A plethora of clinical and animal studies strongly suggest an involvement of TNF-α in the pathophysiology of AD. The FDA-approved biologic TNFIs are thus a potential treatment for AD; however, these large molecules have limited BBB penetration. Clinical studies using the perispinal route of administration for biologic TNFIs have shown encouraging results in small open-label trials; however, larger controlled trials are required to confirm these results. Another approach currently under investigation is to target peripheral TNF-α rather than brain TNF-α. However, this approach has not shown any cognitive improvement in a clinical setting so far, and further studies are required to determine the effect of peripheral TNF-α modulation on AD pathology. Novel drug delivery strategies, such as the MTH technology, enable noninvasive delivery of biologic TNFIs to the brain and target both peripheral and brain TNF-α. Considering the multifactorial role of brain TNF-α in AD pathophysiology, such noninvasive drug delivery strategies may be a reasonable approach to deliver biologic TNFIs to the brain for AD treatment."}, {"id": "U30", "start": 18471, "end": 18483, "section_id": "H8", "text": "## Footnotes"}, {"id": "U31", "start": 18485, "end": 18654, "section_id": "H8", "text": "PEER REVIEW: Five peer reviewers contributed to the peer review report. Reviewers’ reports totaled 858 words, excluding any confidential comments to the academic editor."}, {"id": "U32", "start": 18656, "end": 18877, "section_id": "H8", "text": "FUNDING: The author(s) disclosed receipt of the following financial support for the research, authorship, and/or publication of this article: This work is funded by the Alzheimer’s Association grant RG-15-361188 (R.K.S.)."}, {"id": "U33", "start": 18879, "end": 19052, "section_id": "H8", "text": "DECLARATION OF CONFLICTING INTERESTS: The author(s) declared no potential conflicts of interest with respect to the research, authorship, and/or publication of this article."}, {"id": "U34", "start": 19054, "end": 19403, "section_id": "H8", "text": "Author ContributionsRC wrote the first draft of the manuscript. RC, K-LY, and RKS contributed to the writing of the manuscript and agree with manuscript results and conclusions. RKS developed the structure and arguments for the paper and made critical revisions and approved the final version. All authors reviewed and approved the final manuscript."}, {"id": "U35", "start": 19405, "end": 20166, "section_id": "H8", "text": "Disclosures and EthicsAs a requirement of publication, author(s) have provided to the publisher signed confirmation of compliance with legal and ethical obligations including but not limited to the following: authorship and contributorship, conflicts of interest, privacy and confidentiality, and (where applicable) protection of human and animal research subjects. The authors have read and confirmed their agreement with the ICMJE authorship and conflict of interest criteria. The authors have also confirmed that this article is unique and not under consideration or published in any other publication, and that they have permission from rights holders to reproduce any copyrighted material. The external blind peer reviewers report no conflicts of interest."}]}, "source_attachments": [{"unit_id": "U22", "xml_asset": "10.1177_1179573517709278-table1.jpg", "text": "Table 1. Summary of studies focusing on neutralization of brain TNF-alpha with biologic TNF inhibitors in AD. Columns: biologic TNFI; species; route of administration; therapeutic effect. Row 1: Etanercept; Human; Perispinal; Cognitive improvement [45]. Row 2: Infliximab; Human; Intrathecal; Cognitive improvement, change in blood and CSF Aβ and tau [47]. Row 3 (Infliximab continued): Mouse; Intracerebroventricular; Reduction in Aβ pathology, tau phosphorylation, and cognitive deficits [42–44]. Row 4: Recombinant dominant negative TNFI; Mouse; Intrahippocampal; Reduction in Aβ pathology [35]. Abbreviations: Aβ amyloid beta; AD Alzheimer's disease; CSF cerebrospinal fluid; TNF-alpha tumor necrosis factor alpha; TNFI TNF-alpha inhibitor. Direction of biomarker change in row 2 is not specified.", "author": "Codex", "media_file": "table1.browser.png"}], "input_fingerprint": "10b9d676a760e5dff9c20a7858f3f795e0fa60adf931a02b82a3b02089df905a", "prompt": {"id": "KM.TEXT_TO_MAP", "version": "3", "sha256": "71d626d5e892dfac0cef836170142e442928a9526982011c483f17ef94f90c1f"}, "dependency_prompt": {"id": "KM.TEXT_TO_MAP.DEPENDENCIES", "version": "15", "sha256": "21d56fba6683319b09e001faa3f91f637b1f28cecb6cadef9ef019b25d144915"}, "generation": {"kind": "codex_manual", "author": "Codex", "external_llm_calls": 0, "local_llm_calls": 0, "translation_llm_calls": 0, "embedding_calls": 0, "token_usage": null, "token_usage_note": "Codex session usage is unavailable; no provider usage is fabricated."}, "translations": {"ru": {"run_id": "23d54ea7-9685-4742-8f54-0884dc7054c2", "knowledge_labels": {"K1": "В обзоре 2017 года болезнь Альцгеймера названа ведущей причиной деменции; оценка для США — 5,4 млн человек, прогноз — утроение к 2050 году без прорыва в лечении.", "K2": "На момент обзора 2017 года клинически одобренной терапии, изменяющей течение болезни Альцгеймера, не было.", "K3": "При болезни Альцгеймера наблюдаются внеклеточные бляшки Aβ и внутриклеточные нейрофибриллярные клубки тау; бляшки относительно специфичны, клубки встречаются и при других заболеваниях.", "K4": "Последовательное расщепление трансмембранного APP β- и γ-секретазами высвобождает внеклеточные пептиды Aβ, обычно 40–42 остатка; далее образуются олигомеры, β-фибриллы и бляшки.", "K5": "Некоторые исследования связывают амилоидную патологию преимущественно с доклинической бессимптомной стадией, а накопление тау-клубков — с появлением симптомов.", "K6": "Антиамилоидные подходы были перспективны в животных моделях, но большинство клинических исследований не достигли первичных целей; ингибитор агрегации тау также не достиг первичных исходов при лёгкой и умеренной болезни.", "K7": "Обзор связывает нейровоспаление с развитием болезни Альцгеймера; TNF-α участвует в каскаде цитокинов и рассматривается как возможная терапевтическая мишень.", "K8": "У здоровых взрослых периферический и центральный TNF-α обычно очень низок; при болезни Альцгеймера уровни повышены в крови и ЦНС, избыток мозгового TNF-α связан с заболеванием.", "K9": "TNF-α — негликозилированный трансмембранный мономер типа II массой 17 кДа; фермент TACE высвобождает из мембранного гомотримера растворимый тример массой 51 кДа.", "K10": "Микроглия, нейроны и астроциты способны синтезировать TNF-α; цитокин инициирует и распространяет воспалительный ответ и первоначально был известен противоопухолевой активностью.", "K11": "TNF-α связывается с TNFR1 (p55-R) и TNFR2 (p75-R); внутриклеточный домен смерти есть у TNFR1 и отсутствует у TNFR2.", "K12": "TNFR1 широко экспрессируется и активируется растворимым и мембранным TNF-α; его эффекты включают пролиферацию, активацию, противовирусную активность, особенно апоптоз и цитотоксичность.", "K13": "TNFR2 имеет более высокое сродство к TNF-α, преимущественно активируется мембранной формой и экспрессируется главным образом в иммунных и эндотелиальных клетках; возможны пути cIAP1/2, NF-κB и PI3K.", "K14": "TNFR2 может косвенно усиливать цитотоксичность TNFR1, но сам её не вызывает; в целом TNFR1 связывают с апоптозом, TNFR2 — с выживанием и пролиферацией.", "K15": "В посмертном мозге людей с болезнью Альцгеймера TNF-α находили вокруг бляшек Aβ; в последующих исследованиях сигнализация TNFR1 была необходима для гибели нейронов, индуцированной Aβ.", "K16": "В мозге при болезни Альцгеймера TNFR1 повышен, TNFR2 снижен относительно мозга без деменции; сродство TNF-α к TNFR1 увеличено, к TNFR2 уменьшено.", "K17": "Генетические ассоциации связывали области 12p (ген TNFR1) и 1p (ген TNFR2) с поздней болезнью Альцгеймера.", "K18": "Цитируемые исследования находили значимое повышение TNF-α в ликворе и сыворотке при болезни Альцгеймера и корреляцию повышения с прогрессированием.", "K19": "У трансгенных мышей с моделью болезни Альцгеймера мозговой TNF-α был повышен, связан с внутринейронной иммунореактивностью Aβ в энторинальной коре и когнитивными дефицитами.", "K20": "Удаление TNFR1 у трансгенных мышей уменьшало образование и бляшки Aβ, экспрессию BACE1 и когнитивный дефицит; инактивация сигнализации TNFR1 предотвращала внутринейронное накопление Aβ.", "K21": "Удаление TNFR2 ухудшало патологию в модели болезни Альцгеймера; удаление обоих рецепторов усиливало Aβ- и тау-патологию, что обзор связывает с потерей защитного эффекта TNFR2.", "K22": "В мышиных моделях TNF-α усиливал образование Aβ через β-секретазу и активность γ-секретазы; хроническая нейрональная экспрессия TNF-α вызывала выраженную гибель нейронов.", "K23": "Избыток мозгового TNF-α может усиливать продукцию Aβ, тормозить его микроглиальный клиренс, нарушать синапсы и повышать гибель нейронов; эти процессы связывают TNF-α с разными стадиями болезни.", "K24": "Биологические ингибиторы TNF одобрены FDA для периферических воспалительных болезней, включая болезнь Крона и ревматоидный/псориатический артрит; перечислены инфликсимаб, адалимумаб, голимумаб, цертолизумаб и этанерцепт.", "K25": "Антитела к TNF и этанерцепт связывают растворимую и мембранную формы и подавляют сигнализацию обоих рецепторов; этанерцепт объединяет внеклеточный домен TNFR2 с Fc IgG1 человека.", "K26": "Интрацеребральное введение доминантно-негативного ингибитора TNF (таблица: интрагиппокампальное) у трансгенных мышей подавляло растворимый TNF и уменьшало предбляшечную патологию Aβ.", "K27": "Внутрижелудочковый инфликсимаб в мышиных моделях уменьшал TNF-α, амилоидные бляшки, фосфорилирование тау и когнитивные дефициты.", "K28": "Небольшое открытое шестимесячное исследование сообщало улучшение ADAS-Cog, Severe Impairment Battery и MMSE после периспинального этанерцепта 25–50 мг в неделю.", "K29": "Для улучшения после периспинального этанерцепта предложены гипотезы быстрого проникновения в ликвор и внесинаптической сигнализации; другое исследование не наблюдало стабильной внутричерепной доставки.", "K30": "После интратекального инфликсимаба у пациентки описано быстрое когнитивное улучшение; таблица также сообщает изменения Aβ и тау в крови/ликворе без направления изменений.", "K31": "Необходимы более крупные контролируемые исследования, чтобы подтвердить обнадёживающие открытые исследования и единичные случаи ингибирования TNF при болезни Альцгеймера.", "K32": "Одобренные биологические ингибиторы TNF плохо проникают через ГЭБ; инвазивная доставка может быть небезопасной или непрактичной для хронического лечения.", "K33": "Периферическое подавление TNF было перспективно у мышей, но небольшое рандомизированное двойное слепое исследование фазы II подкожного этанерцепта не показало улучшения когнитивных, глобальных и поведенческих функций.", "K34": "Нужно выяснить, улучшает ли модуляция периферического TNF-α клинические исходы и как влияет на патологию болезни Альцгеймера.", "K35": "Молекулярный «троянский конь» для ГЭБ — эндогенный пептид или пептидомиметическое антитело, переносимое через рецепторы трансферрина или инсулина и доставляющее присоединённый препарат в мозг.", "K36": "Создан мышиный cTfRMAb-TNFR: N-конец внеклеточного домена TNFR2 соединён с C-концом тяжёлой цепи антитела к TfR; участок связывания TfR свободен, TNFR располагается как димер.", "K37": "Мономерные TNF-α человека и мыши имеют высокую идентичность; человеческий TNFR обладает высоким сродством к мышиному TNF, что обосновывает его использование в мышиной конструкции.", "K38": "cTfRMAb-TNFR связывает мышиный TfR с Kd 2,6±0,3 нМ и TNF-α с Kd 96±34 пМ.", "K39": "Двухфункциональная мышиная конструкция обеспечивает неинвазивный транспорт через TfR и связывает избыточный TNF-α после попадания в мозг.", "K40": "Фармакокинетический анализ показал, что внутрибрюшинное, подкожное и внутривенное введение создаёт мозговую концентрацию cTfRMAb-TNFR в 20–50 раз выше патологической концентрации TNF-α.", "K41": "Внутривенное введение предпочтительно при острых неврологических состояниях, например ишемическом инсульте; внутрибрюшинное/подкожное более практично для хронических состояний, включая болезнь Альцгеймера.", "K42": "cTfRMAb-TNFR был защитным в мышиных моделях ишемического инсульта и болезни Паркинсона; исследование в модели болезни Альцгеймера продолжалось.", "K43": "Для потенциального применения у человека создан HIRMAb-TNFR с внеклеточным доменом TNFR2 и антителом к человеческому инсулиновому рецептору; антитело перекрёстно реагирует у обезьян Старого Света.", "K44": "У макак-резусов после внутривенных 0,2 мг/кг HIRMAb-TNFR накопление в мозге составило 3±0,1% введённой дозы на 100 г против 0,23±0,06% для TNFR:Fc.", "K45": "Хроническое введение HIRMAb-конструкции в высокой дозе 20 мг/кг описано как безопасное у макак-резусов; это не установленная безопасность лечения людей с болезнью Альцгеймера.", "K46": "Ингибирование TNF-α — потенциальная стратегия для болезни Альцгеймера; её ограничивают доставка через ГЭБ и неподтверждённая эффективность у людей; молекулярные «троянские кони» могут позволить воздействие на периферию и мозг.", "K47": "Исследователи проверили cTfRMAb-TNFR в мышиных неврологических моделях и охарактеризовали системную фармакокинетику.", "K48": "Измерить поступление конструкции в мозг макак-резусов после внутривенного введения и оценить хроническое введение высокой дозы HIRMAb-конструкции.", "K49": "В цитируемом открытом исследовании пациентам вводили периспинальный этанерцепт в течение шести месяцев и оценивали когнитивные функции.", "K50": "В цитируемом рандомизированном двойном слепом исследовании фазы II проверяли еженедельный подкожный этанерцепт при лёгкой и умеренной болезни Альцгеймера."}, "labels": {"B1": "В обзоре 2017 года болезнь Альцгеймера названа ведущей причиной деменции; оценка для США — 5,4 млн человек, прогноз — утроение к 2050 году без прорыва в лечении.", "B2": "На момент обзора 2017 года клинически одобренной терапии, изменяющей течение болезни Альцгеймера, не было.", "B3": "При болезни Альцгеймера наблюдаются внеклеточные бляшки Aβ и внутриклеточные нейрофибриллярные клубки тау; бляшки относительно специфичны, клубки встречаются и при других заболеваниях.", "B4": "Последовательное расщепление трансмембранного APP β- и γ-секретазами высвобождает внеклеточные пептиды Aβ, обычно 40–42 остатка; далее образуются олигомеры, β-фибриллы и бляшки.", "B5": "Некоторые исследования связывают амилоидную патологию преимущественно с доклинической бессимптомной стадией, а накопление тау-клубков — с появлением симптомов.", "B6": "Антиамилоидные подходы были перспективны в животных моделях, но большинство клинических исследований не достигли первичных целей; ингибитор агрегации тау также не достиг первичных исходов при лёгкой и умеренной болезни.", "B7": "Обзор связывает нейровоспаление с развитием болезни Альцгеймера; TNF-α участвует в каскаде цитокинов и рассматривается как возможная терапевтическая мишень.", "B8": "У здоровых взрослых периферический и центральный TNF-α обычно очень низок; при болезни Альцгеймера уровни повышены в крови и ЦНС, избыток мозгового TNF-α связан с заболеванием.", "B9": "TNF-α — негликозилированный трансмембранный мономер типа II массой 17 кДа; фермент TACE высвобождает из мембранного гомотримера растворимый тример массой 51 кДа.", "B10": "Микроглия, нейроны и астроциты способны синтезировать TNF-α; цитокин инициирует и распространяет воспалительный ответ и первоначально был известен противоопухолевой активностью.", "B11": "TNF-α связывается с TNFR1 (p55-R) и TNFR2 (p75-R); внутриклеточный домен смерти есть у TNFR1 и отсутствует у TNFR2.", "B12": "TNFR1 широко экспрессируется и активируется растворимым и мембранным TNF-α; его эффекты включают пролиферацию, активацию, противовирусную активность, особенно апоптоз и цитотоксичность.", "B13": "TNFR2 имеет более высокое сродство к TNF-α, преимущественно активируется мембранной формой и экспрессируется главным образом в иммунных и эндотелиальных клетках; возможны пути cIAP1/2, NF-κB и PI3K.", "B14": "TNFR2 может косвенно усиливать цитотоксичность TNFR1, но сам её не вызывает; в целом TNFR1 связывают с апоптозом, TNFR2 — с выживанием и пролиферацией.", "B15": "В посмертном мозге людей с болезнью Альцгеймера TNF-α находили вокруг бляшек Aβ; в последующих исследованиях сигнализация TNFR1 была необходима для гибели нейронов, индуцированной Aβ.", "B16": "В мозге при болезни Альцгеймера TNFR1 повышен, TNFR2 снижен относительно мозга без деменции; сродство TNF-α к TNFR1 увеличено, к TNFR2 уменьшено.", "B17": "Генетические ассоциации связывали области 12p (ген TNFR1) и 1p (ген TNFR2) с поздней болезнью Альцгеймера.", "B18": "Цитируемые исследования находили значимое повышение TNF-α в ликворе и сыворотке при дложены гипотезы быстрого проникновения в ликвор и внесинаптической сигнализации; другое исследование не наблюдало стабильной внутричерепной доставки.", "B30": "После интратекального инфликсимаба у пациентки описано быстрое когнитивное улучшение; таблица также сообщает изменения Aβ и тау в крови/ликворе без направления изменений.", "B31": "Необходимы более крупные контролируемые исследования, чтобы подтвердить обнадёживающие открытые исследования и единичные случаи ингибирования TNF при болезни Альцгеймера.", "B32": "Одобренные биологические ингибиторы TNF плохо проникают через ГЭБ; инвазивная доставка может быть небезопасной или непрактичной для хронического лечения.", "B33": "Периферическое подавление TNF было перспективно у мышей, но небольшое рандомизированное двойное слепое исследование фазы II подкожного этанерцепта не показало улучшения когнитивных, глобальных и поведенческих функций.", "B34": "Нужно выяснить, улучшает ли модуляция периферического TNF-α клинические исходы и как влияет на патологию болезни Альцгеймера.", "B35": "Молекулярный «троянский конь» для ГЭБ — эндогенный пептид или пептидомиметическое антитело, переносимое через рецепторы трансферрина или инсулина и доставляющее присоединённый препарат в мозг.", "B36": "Создан мышиный cTfRMAb-TNFR: N-конец внеклеточного домена TNFR2 соединён с C-концом тяжёлой цепи антитела к TfR; участок связывания TfR свободен, TNFR располагается как димер.", "B37": "Мономерные TNF-α человека и мыши имеют высокую идентичность; человеческий TNFR обладает высоким сродством к мышиному TNF, что обосновывает его использование в мышиной конструкции.", "B38": "cTfRMAb-TNFR связывает мышиный TfR с Kd 2,6±0,3 нМ и TNF-α с Kd 96±34 пМ.", "B39": "Двухфункциональная мышиная конструкция обеспечивает неинвазивный транспорт через TfR и связывает избыточный TNF-α после попадания в мозг.", "B40": "Фармакокинетический анализ показал, что внутрибрюшинное, подкожное и внутривенное введение создаёт мозговую концентрацию cTfRMAb-TNFR в 20–50 раз выше патологической концентрации TNF-α.", "B41": "Внутривенное введение предпочтительно при острых неврологических состояниях, например ишемическом инсульте; внутрибрюшинное/подкожное более практично для хронических состояний, включая болезнь Альцгеймера.", "B42": "cTfRMAb-TNFR был защитным в мышиных моделях ишемического инсульта и болезни Паркинсона; исследование в модели болезни Альцгеймера продолжалось.", "B43": "Для потенциального применения у человека создан HIRMAb-TNFR с внеклеточным доменом TNFR2 и антителом к человеческому инсулиновому рецептору; антитело перекрёстно реагирует у обезьян Старого Света.", "B44": "У макак-резусов после внутривенных 0,2 мг/кг HIRMAb-TNFR накопление в мозге составило 3±0,1% введённой дозы на 100 г против 0,23±0,06% для TNFR:Fc.", "B45": "Хроническое введение HIRMAb-конструкции в высокой дозе 20 мг/кг описано как безопасное у макак-резусов; это не установленная безопасность лечения людей с болезнью Альцгеймера.", "B46": "Ингибирование TNF-α — потенциальная стратегия для болезни Альцгеймера; её ограничивают доставка через ГЭБ и неподтверждённая эффективность у людей; молекулярные «троянские кони» могут позволить воздействие на периферию и мозг.", "B47": "Исследователи проверили cTfRMAb-TNFR в мышиных неврологических моделях и охарактеризовали системную фармакокинетику.", "B48": "Измерить поступление конструкции в мозг макак-резусов после внутривенного введения и оценить хроническое введение высокой дозы HIRMAb-конструкции.", "B49": "В цитируемом открытом исследовании пациентам вводили периспинальный этанерцепт в течение шести месяцев и оценивали когнитивные функции.", "B50": "В цитируемом рандомизированном двойном слепом исследовании фазы II проверяли еженедельный подкожный этанерцепт при лёгкой и умеренной болезни Альцгеймера."}, "generation": {"kind": "codex_manual", "author": "Codex", "external_llm_calls": 0, "local_llm_calls": 0, "translation_llm_calls": 0, "embedding_calls": 0, "token_usage": null, "token_usage_note":
