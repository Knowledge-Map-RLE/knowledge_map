[tool.poetry]
name = "knowledge-map-core"
version = "0.1.0"
description = "Knowledge Language Parser — ядро Карты Знаний"
authors = ["Dobrosvet <dimaprokofev@yandex.ru>"]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

grpcio = "1.74.0"
grpcio-tools = "1.74.0"
protobuf = "6.31.1"

pydantic = "2.11.7"
pydantic-settings = "2.9.1"
python-dotenv = "1.1.0"

neo4j = "^5.15.0"
networkx = "3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
