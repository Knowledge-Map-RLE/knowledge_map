[tool.poetry]
name = "xml-to-md-service"
version = "0.1.0"
description = "Stateless микросервис для конвертации PubMed/PMC XML в Markdown"
authors = ["Knowledge Map Team"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework (REST health endpoint)
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}

# gRPC
grpcio = "^1.59.3"
grpcio-tools = "^1.59.3"
protobuf = "^4.25.1"

# Data validation
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
