syntax = "proto3";

package knowledge_language;

service KnowledgeLanguageService {
    rpc ProcessText(ProcessTextRequest) returns (KnowledgeGraphResponse);
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
    rpc CheckUniqueness(CheckUniquenessRequest) returns (UniquenessResponse);
    rpc CheckSubgraphUniqueness(CheckSubgraphUniquenessRequest) returns (SubgraphUniquenessResponse);
    rpc CheckPatternMatch(CheckPatternMatchRequest) returns (PatternMatchResponse);
    rpc AddStatementWithUniqueness(AddStatementRequest) returns (AddStatementResponse);
}

enum StatementType {
    STATEMENT_TYPE_UNSPECIFIED = 0;
    FACT = 1;
    META = 2;
}

enum SubjectType {
    SUBJECT_TYPE_UNSPECIFIED = 0;
    SUBJECT_CONCEPT = 1;
    SUBJECT_STATEMENT = 2;
}

enum ObjectType {
    OBJECT_TYPE_UNSPECIFIED = 0;
    OBJECT_CONCEPT = 1;
    OBJECT_STATEMENT = 2;
    OBJECT_LITERAL = 3;
}

enum UniquenessStatus {
    UNIQUENESS_STATUS_UNKNOWN = 0;
    UNIQUENESS_SAME = 1;
    UNIQUENESS_UNCERTAIN = 2;
    UNIQUENESS_DIFFERENT = 3;
    UNIQUENESS_NEW = 4;
}

message ProcessTextRequest {
    string text = 1;
    string doc_id = 2;
    bool use_llm = 3;
    string llm_model_id = 4;
}

message StatementProto {
    string id = 1;
    StatementType type = 2;
    string subject_id = 3;
    SubjectType subject_type = 4;
    string predicate = 5;
    string object_id = 6;
    ObjectType object_type = 7;
    string literal_value = 8;
    float confidence = 9;
    string sentence_text = 10;
    int64 created_at = 11;
}

message ConceptProto {
    string id = 1;
    string text = 2;
    string normalized_text = 3;
}

message KnowledgeGraphResponse {
    bool success = 1;
    repeated StatementProto statements = 2;
    repeated ConceptProto concepts = 3;
    int32 total_statements = 4;
    int32 total_concepts = 5;
    string message = 6;
    string doc_id = 7;
}

message HealthCheckRequest {
    optional string service = 1;
}

message HealthCheckResponse {
    string status = 1;
    string service = 2;
    string details = 3;
    string timestamp = 4;
}

message CheckUniquenessRequest {
    string subject_text = 1;
    string predicate = 2;
    string object_text = 3;
    string sentence_text = 4;
}

message CandidateMatchProto {
    string statement_id = 1;
    float similarity = 2;
    string subject_text = 3;
    string predicate = 4;
    string object_text = 5;
}

message UniquenessResponse {
    UniquenessStatus status = 1;
    string existing_statement_id = 2;
    float confidence = 3;
    repeated CandidateMatchProto candidates = 4;
    string message = 5;
}

message SubgraphNodeProto {
    string id = 1;
    string node_type = 2;
    string text = 3;
    string predicate = 4;
    string fingerprint = 5;
}

message SubgraphEdgeProto {
    string source_id = 1;
    string target_id = 2;
    string edge_type = 3;
    string predicate = 4;
}

message CheckSubgraphUniquenessRequest {
    repeated SubgraphNodeProto nodes = 1;
    repeated SubgraphEdgeProto edges = 2;
}

message NodeUidsProto {
    repeated string as_subject = 1;
    repeated string as_object = 2;
}

message UidListProto {
    repeated string uids = 1;
}

message SubgraphMatchProto {
    map<string, string> pattern_to_graph = 1;
    repeated string matched_graph_node_ids = 2;
    map<string, NodeUidsProto> node_uids = 3;
    map<string, UidListProto> edge_uids = 4;
}

message FrequentPatternProto {
    int32 support = 1;
    float frequency = 2;
    repeated SubgraphNodeProto nodes = 3;
    repeated SubgraphEdgeProto edges = 4;
}

message SubgraphUniquenessResponse {
    UniquenessStatus status = 1;
    string wl_hash = 2;
    string existing_subgraph_id = 3;
    repeated SubgraphMatchProto subgraph_matches = 4;
    repeated FrequentPatternProto frequent_patterns = 5;
    string message = 6;
}

message PatternNodeProto {
    string id = 1;
    string required_type = 2;
    string text_constraint = 3;
    string predicate_constraint = 4;
}

message PatternEdgeProto {
    string source_id = 1;
    string target_id = 2;
    string required_edge_type = 3;
    string predicate_constraint = 4;
}

message CheckPatternMatchRequest {
    repeated PatternNodeProto nodes = 1;
    repeated PatternEdgeProto edges = 2;
    int32 max_results = 3;
}

message PatternMatchResponse {
    UniquenessStatus status = 1;
    repeated SubgraphMatchProto matches = 2;
    int32 total_matches = 3;
    string message = 4;
}

message AddStatementRequest {
    string subject_text = 1;
    string predicate = 2;
    string object_text = 3;
    string sentence_text = 4;
    string doc_id = 5;
}

message AddStatementResponse {
    bool success = 1;
    UniquenessStatus uniqueness_status = 2;
    string statement_id = 3;
    string existing_statement_id = 4;
    string message = 5;
}
