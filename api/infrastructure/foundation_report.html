:root{font:16px/1.55 system-ui;background:#f3f6fa;color:#20324a}*{box-sizing:border-box}body{margin:0}main{max-width:1220px;margin:auto;padding:26px}header,.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:29px;line-height:1.3}h2{font-size:22px;margin-top:32px}button,select{font:inherit;padding:8px 12px;border:1px solid #a7bbd0;border-radius:7px;background:white;color:#245081;cursor:pointer}button.active{background:#24568e;color:white}button:focus-visible,select:focus-visible{outline:3px solid #ce9531;outline-offset:2px}button:hover{background:#e5edf7}.notice{background:#fff3dc;border-left:4px solid #b88a24;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:white;padding:17px;border:1px solid #d5dfeb;border-radius:8px}.stat strong{display:block;font-size:28px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;background:white;font-size:14px}td,th{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #dde5ef}th{background:#e7eef7}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace}.source{max-height:380px;overflow:auto;background:#f4f6fa;padding:14px}mark{background:#ffdc89}.good{color:#226b4e}.muted{color:#61748a}details{margin:15px 0}summary{cursor:pointer;font-weight:600}.toolbar{margin:14px 0}#graph{width:100%;min-width:720px;background:white;border:1px solid #d4dfeb;border-radius:8px}#graph g{cursor:pointer}#graph g:focus rect{stroke:#d49b2e;stroke-width:4}#graph text{font:12px system-ui;fill:#20324a}a{color:#24568e}@media(max-width:720px){main{padding:14px}h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr)}}

<script id="data" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent);let lang='ru',selectedSource=null,selectedAudits=[],selectedPatterns=[],selectedNode=null;
const foundation=data.sealed.foundation,blocks=Object.fromEntries(foundation.knowledge.map(b=>[b.knowledge_id,b]));
const L={ru:{title:'Явный фундамент и проверяемые следствия',notice:'12 знаний фундамента и пять математических следствий. Три совпадения известного паттерна воспроизведены; нового научного предсказания и преимущества над прежней канонической базой нет. Источники ранее прочитаны, экспертной проверки нет.',counts:['Знаний фундамента','Исходных наблюдений','Условных следствий','Новых научных прогнозов'],graphTitle:'Фундамент и граф оснований',graphNote:'Стрелки показывают непосредственное использование знания. Совместные посылки сходятся к результату. Это граф проверки математической операции; преимущество научного dependency-графа не установлено. Изолированные знания допустимы.',foundation:'Фундамент',operations:'Вычисленные следствия из статей',operationsNote:'Обращение контраста или одного шага модели сохраняет контекст. Оценки приблизительны, поскольку вычислены из округлённых опубликованных чисел. Необнаруженная связь остаётся необнаруженной; причинный эффект вмешательства не утверждается.',operationHead:['Источник / контраст','Исходное отношение','Обратная оценка','Обнаружение','Основания'],metrics:'Сопоставление четырёх режимов',metricHead:['Режим','Совпадения паттерна','Неопределённость','Не охвачено'],baseline:'В режимах без операций не обращается исходная ориентация. Два первых режима не являются сильнейшими семантическими базами: прежний канонический сравнитель уже содержал ручное обращение и получил те же три совпадения. DAG оснований не увеличил их число. Эти счётчики не доказывают новое научное знание.',casesTitle:'Удержанные когорты: 23 записи',caseHead:['Запись','Фенотип / фактор','Прогноз направления','Контроль','Оценка','Источник'],sourceTitle:'Семантика и исходный текст',context:'Сохранённый контекст',audit:'Сравнение с посылками',full:'Полный текст с выделением',repairs:'Пять исправленных привязок к источникам',repairNote:'В новой ревизии добавлены строки самих HR Mayo и LEILA, а также начало двухколоночной фразы Manly. Старые артефакты сохранены. Для дозовых преобразований Katz отдельно доступны строки методов.',validation:'Версии, фиксация и ограничения',next:'Следующий научный этап',nextNote:'Добавить обоснованный предметный фундамент с механизмами и условиями, затем зафиксировать новую гипотезу до открытия независимого контроля. Уже известное из фундамента не считается новым. Нельзя применять транзитивность к корреляциям или считать необнаружение доказательством нулевого эффекта.',articles:'Только исходные представления',comparison:'Фундамент для сопоставления',derivation:'Фундамент и операции',dependencies:'Операции и DAG оснований',all:'Все когорты',show:'Показать',premise:'Посылка',directions:{higher:'Выше',lower:'Ниже',equal:'Равно',mixed:'Смешанный порядок',no_clear_pattern:'Нет ясного порядка',unspecified:'Не сообщено'},findings:{detected:'Связь обнаружена',not_detected:'Связь не обнаружена',not_reported:'Тест не сообщён'},statuses:{qualitative_pattern_match:'Совпадение паттерна',not_addressed:'Не охвачено',uncertain:'Неопределённость',inconsistent_transfer:'Несогласованный перенос',ambiguous_known_patterns:'Несколько направлений'},condition:'Условия преобразования',source:'Исходное наблюдение',derived:'Условное математическое следствие'},en:{title:'Explicit foundation and verifiable consequences',notice:'12 foundation items and five mathematical consequences. Three known-pattern agreements reproduced; no novel scientific prediction or improvement over the previous canonical baseline. Sources were previously read; no expert validation.',counts:['Foundation items','Source observations','Conditional consequences','New scientific predictions'],graphTitle:'Foundation and premise graph',graphNote:'Arrows show direct use of knowledge. Joint premises converge on the result. This verifies a mathematical operation; scientific dependency-graph advantage was not established. Isolated knowledge is allowed.',foundation:'Foundation',operations:'Computed consequences from papers',operationsNote:'Reversing a contrast or a fitted model step preserves context. Estimates are approximate because the published numbers were rounded. Nondetection remains nondetection; no causal intervention effect is asserted.',operationHead:['Source / contrast','Native ratio','Reverse estimate','Detection','Evidence'],metrics:'Four-mode comparison',metricHead:['Mode','Pattern agreements','Uncertain','Not addressed'],baseline:'Modes without operations do not reverse native orientation. The first two modes are not the strongest semantic baselines: the previous canonical comparator already included manual reversal and found the same three agreements. Premise DAGs did not increase this count. These counts do not demonstrate novel scientific knowledge.',casesTitle:'Withheld cohorts: 23 records',caseHead:['Record','Phenotype / factor','Direction forecast','Control','Evaluation','Source'],sourceTitle:'Semantics and source text',context:'Preserved context',audit:'Comparison with premises',full:'Full text with highlight',repairs:'Five repaired source bindings',repairNote:'The new revision includes actual Mayo and LEILA HR rows and the start of the two-column Manly sentence. Previous artifacts remain intact. Katz dose transformations separately include methods.',validation:'Versions, seals and limitations',next:'Next scientific stage',nextNote:'Add a grounded subject foundation with mechanisms and conditions, then freeze a new hypothesis before opening an independent control. Facts already in the foundation are known. Correlations cannot be composed as transitive relations; nondetection does not prove a zero effect.',articles:'Native source representations',comparison:'Foundation for comparison',derivation:'Foundation and operations',dependencies:'Operations and premise DAG',all:'All cohorts',show:'Inspect',premise:'Premise',directions:{higher:'Higher',lower:'Lower',equal:'Equal',mixed:'Mixed order',no_clear_pattern:'No clear order',unspecified:'Not reported'},findings:{detected:'Association detected',not_detected:'Association not detected',not_reported:'Test not reported'},statuses:{qualitative_pattern_match:'Pattern agreement',not_addressed:'Not addressed',uncertain:'Uncertain',inconsistent_transfer:'Inconsistent transfer',ambiguous_known_patterns:'Multiple directions'},condition:'Transformation conditions',source:'Source observation',derived:'Conditional mathematical consequence'}};
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function button(text,fn){const b=el('button',text);b.onclick=fn;return b}
function head(id,values){document.getElementById(id).replaceChildren(...values.map(v=>el('th',v)))}
function options(id,values){const s=document.getElementById(id),old=s.value;s.replaceChildren(...values.map(([v,t])=>{const o=el('option',t);o.value=v;return o}));if(values.some(([v])=>v===old))s.value=old;else if(id==='mode')s.value='dependencies'}
function proof(id){const p=data.evidence[id],text=data.texts[p.source_id],chars=Array.from(text);document.getElementById('fragment').textContent=chars.slice(p.start,p.end).join('');document.getElementById('fragment').dataset.proof=id;document.getElementById('proof-meta').textContent=p.source_id+' · PDF '+p.pdf_page+' · Unicode ['+p.start+', '+p.end+') · '+p.source_sha256;document.getElementById('full-text').replaceChildren(document.createTextNode(chars.slice(0,p.start).join('')),el('mark',p.text),document.createTextNode(chars.slice(p.end).join('')))}
function source(id,audits=[],patterns=[]){selectedSource=id;selectedAudits=audits;selectedPatterns=patterns;const c=data.records[id].claim,l=L[lang];document.getElementById('source-detail').hidden=false;document.getElementById('source-title').textContent=id+' · '+c.family_id+' · '+c.context.analysis.native_contrast;document.getElementById('result-frame').textContent=JSON.stringify(c.semantic_frame,null,2);document.getElementById('context').textContent=JSON.stringify(c.context,null,2);document.getElementById('audit').textContent=JSON.stringify(audits,null,2);document.getElementById('premises').replaceChildren(...patterns.flatMap(p=>p.premise_ids.map(id=>button(l.premise+': '+id,()=>source(id)))));document.getElementById('proof-buttons').replaceChildren(...c.provenance.map(id=>button(id,()=>proof(id))));proof(c.provenance[0])}
function node(id,graphKey){selectedNode=[id,graphKey];const l=L[lang],panel=document.getElementById('node-detail');panel.hidden=false;document.getElementById('node-sources').replaceChildren();let block=blocks[id.replace(/^rule:/,'')];if(block){document.getElementById('node-title').textContent=block.knowledge_id;document.getElementById('node-text').textContent=lang==='ru'?block.text_ru:block.text;document.getElementById('node-frame').textContent=JSON.stringify(block.frame,null,2);for(const p of block.provenance){const s=foundation.sources[p],n=el('p');n.append(el('span',s.title+' · '+s.section+' — '+s.text+' '));if(s.url){const a=el('a',s.url);a.href=s.url;a.target='_blank';a.rel='noopener';n.append(a)}document.getElementById('node-sources').append(n)}}else{const p=data.derivations[graphKey];document.getElementById('node-title').textContent=id;document.getElementById('node-text').textContent=id.startsWith('source:')?l.source:id.startsWith('condition:')?l.condition:l.derived;document.getElementById('node-frame').textContent=JSON.stringify(id.startsWith('condition:')?data.records[graphKey].basis:p,null,2);document.getElementById('node-sources').append(button(l.show+' '+graphKey,()=>source(graphKey)))}}
function graph(){const key=document.getElementById('graph-choice').value,l=L[lang],svg=document.getElementById('graph'),ns='http://www.w3.org/2000/svg';svg.replaceChildren();const g=key==='foundation'?{nodes:foundation.occurrences,edges:foundation.edges,ranks:data.ranks}:data.derivations[key].graph;const rows={},pos={};for(const n of g.nodes){const rank=g.ranks[n.id];rows[rank]=rows[rank]||0;pos[n.id]={x:24+rank*365,y:22+rows[rank]++*86}}const height=Math.max(...Object.values(rows))*86+25;svg.setAttribute('viewBox','0 0 1120 '+height);svg.style.height=height+'px';const shape=(tag,attrs)=>{const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n};const defs=shape('defs',{}),marker=shape('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(shape('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#718ca7'}));defs.append(marker);svg.append(defs);for(const e of g.edges){const a=pos[e.source],b=pos[e.target];svg.append(shape('path',{d:`M ${a.x+280} ${a.y+30} C ${a.x+315} ${a.y+30}, ${b.x-35} ${b.y+30}, ${b.x} ${b.y+30}`,fill:'none',stroke:'#718ca7','stroke-width':1.6,'marker-end':'url(#arrow)'}))}for(const n of g.nodes){const p=pos[n.id],group=shape('g',{tabindex:0,role:'button','data-node':n.id,'aria-label':n.knowledge_id});group.append(shape('rect',{x:p.x,y:p.y,width:280,height:64,rx:8,fill:n.role==='result'?'#e3f1e9':'#eef4fc',stroke:'#95abc2'}));let label=blocks[n.knowledge_id]?(lang==='ru'?blocks[n.knowledge_id].text_ru:blocks[n.knowledge_id].text):n.role==='result'?l.derived:n.role==='condition'?l.condition:l.source+': '+key;const lines=label.match(/.{1,38}(?:\s|$)|.{1,38}/g)||[label];for(let i=0;i<Math.min(lines.length,3);i++){const t=shape('text',{x:p.x+10,y:p.y+17+i*17});t.textContent=lines[i].trim();group.append(t)}group.onclick=()=>node(n.id,key);group.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();node(n.id,key)}};svg.append(group)}selectedNode=null;document.getElementById('node-detail').hidden=true}
function cases(){const mode=document.getElementById('mode').value,fold=document.getElementById('fold').value,l=L[lang],body=document.getElementById('cases');body.replaceChildren();for(const f of data.evaluation.folds){if(fold!=='all'&&f.fold_id!==fold)continue;const train=data.sealed.folds.find(v=>v.fold_id===f.fold_id).modes[mode];for(const r of f.modes[mode].rows){const c=data.records[r.id].claim,tr=el('tr');tr.dataset.case=r.id;tr.dataset.fold=f.fold_id;[r.id+' / '+c.family_id,c.phenotype+' / '+c.factor,r.expected_directions.map(d=>l.directions[d]).join(', ')||'—',l.directions[r.observed_result.direction]+'; '+l.findings[r.observed_result.statistical_finding],l.statuses[r.status]].forEach(t=>tr.append(el('td',t)));if(r.status==='qualitative_pattern_match')tr.children[4].className='good';const td=el('td');td.append(button(l.show,()=>source(r.id,r.context_audits,train.predictions.semantic.filter(p=>r.pattern_ids.includes(p.id)))));tr.append(td);body.append(tr)}}}
function render(){const priorNode=selectedNode,l=L[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(n=>n.textContent=l[n.dataset.i]);for(const v of ['ru','en'])document.getElementById(v).classList.toggle('active',v===lang);document.getElementById('stats').replaceChildren(...[12,23,5,0].map((v,i)=>{const n=el('div');n.className='stat';n.append(el('strong',String(v)),el('span',l.counts[i]));return n}));options('graph-choice',[['foundation',l.foundation],...Object.keys(data.derivations).map(id=>[id,id])]);graph();head('operation-head',l.operationHead);document.getElementById('operations').replaceChildren(...Object.entries(data.derivations).map(([id,p])=>{const tr=el('tr');[id+' · '+data.records[id].claim.context.analysis.native_contrast,p.native_ratio,Number(p.derived_ratio).toFixed(6),l.findings[p.statistical_finding]].forEach(t=>tr.append(el('td',t)));const td=el('td');td.append(button(l.show,()=>{document.getElementById('graph-choice').value=id;graph();source(id)}));tr.append(td);return tr}));head('metric-head',l.metricHead);const modes=['articles','comparison','derivation','dependencies'];document.getElementById('metrics').replaceChildren(...modes.map(mode=>{const tr=el('tr'),counts=data.evaluation.totals[mode];[l[mode],...['qualitative_pattern_match','uncertain','not_addressed'].map(k=>counts[k]||0)].forEach(t=>tr.append(el('td',String(t))));return tr}));options('mode',modes.map(v=>[v,l[v]]));options('fold',[['all',l.all],...data.sealed.folds.map(f=>[f.fold_id,f.withheld_family])]);head('case-head',l.caseHead);cases();document.getElementById('repair-buttons').replaceChildren(...data.repairs.map(r=>button(r.id,()=>source(r.id))));document.getElementById('validation').textContent=JSON.stringify(data.validation,null,2);if(selectedSource)source(selectedSource,selectedAudits,selectedPatterns);if(priorNode)node(...priorNode)}
document.getElementById('ru').onclick=()=>{lang='ru';render()};document.getElementById('en').onclick=()=>{lang='en';render()};document.getElementById('graph-choice').onchange=graph;for(const id of ['mode','fold'])document.getElementById(id).onchange=cases;render();
</script></html>
