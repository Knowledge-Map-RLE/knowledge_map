const data=JSON.parse(document.getElementById('data').textContent);let lang='ru';
const L={ru:{title:'Первичные PDF: что изменилось в переносе знаний',notice:'Научный критерий успеха ещё не достигнут. Это ретроспективная диагностика ранее прочитанных данных. Будущий контроль закрыт; модельных вызовов — 0. Разметка Codex требует экспертной проверки.',result:'Результат на 30 удержанных сравнениях',interpretation:'Исследовательский оператор выдал 10 гипотез: 7 совпадений, 3 ошибки и 20 отказов. Все три ошибки относятся к Katz. Частотная база верно указала порядок в 26 из 30 случаев. Преимущество структурного оператора пока не показано.',scope:'Предсказывается только порядок двух опубликованных точечных оценок в соседних возрастных группах. Это не величина ставки, не индивидуальный эффект старения, не статистическая значимость и не новый научный результат.',sources:'Семь полученных первичных текстов',rates:'49 первичных ставок и их семантика',repairNote:'В повторный прогон входят 42 подтверждённые записи из прежних 45. Четыре дополнительные возрастные записи и три наблюдённые альтернативы сохранены отдельно и не добавляют голоса в этом сравнении.',provenance:'Семантика и точные источники',fragment:'Исходный фрагмент — английский',page:'Изображение проверенной таблицы',fullText:'Полный текст PDF с выделенным фрагментом',forecasts:'Все удержанные сравнения',forecastNote:'Исследовательский режим допускает различия контекста и грубые названия исходов. Эти совпадения не подтверждают переносимость клинического знания. Строгий режим воздержался во всех 30 случаях; доверительные интервалы не являются проверкой разницы.',audit:'Проверка прежних 45 записей обзора',auditNote:'Три записи Busse не подтверждены указанным первичным DOI. У 42 подтверждённых записей точечные значения сохранены; исправлены 5 границ возраста, 1 ДИ и 6 обозначений WHICAP. Исправления не записываются в прежние карты.',comparison:'Сопоставление с прежним прогоном',comparisonNote:'Полные знаменатели различаются: 32 прежде и 30 теперь. Ниже отдельно показаны 25 запросов с прежними границами возраста и тем же исследованием/исходом; контекст уточнён. Это диагностика влияния входов, а не независимый тест превосходства.',next:'Следующий шаг',nextNote:'Нужно проверять применимость шаблонов по фенотипу, способу учёта возраста, рисковой группе и оценённой величине. Неизвестный контекст должен оставаться неизвестным. После этого — зафиксированный оператор и прогноз для независимого будущего контроля. Исправление по этим уже открытым результатам остаётся разработкой.',validation:'Фиксация и воспроизводимость',all:'Все',inspect:'Открыть',repair:'Повторный прогон',additional:'Дополнительная группа',alternative:'Наблюдённая альтернатива',strict:'Строгий',exploratory:'Исследовательский',frequency:'Частотная база',matched:'Совпало',wrong:'Ошибка',abstained:'Воздержался',higher:'Выше',lower:'Ниже',equal:'Равны',quarantined:'Карантин',numerically_confirmed:'Числа подтверждены',corrected:'Исправлен контекст / ДИ',counts:['PDF получено','Ставок в прогоне','Запросов','Новых научных прогнозов'],metricsHead:['Режим','Запросов','Выдано','Совпало','Ошибок','Отказов'],rateHead:['Исследование / исход','Возраст','Опубликовано / 95% ДИ','На 1000 чел.-лет','Состав','Источник'],forecastHead:['Запрос','Прогноз','Опубликованный порядок','Результат','Источник / предпосылки'],auditHead:['Запись','Старый возраст / ставка','Первичный возраст / ставка','Изменения'],changes:{unverified_primary_incidence:'Нет подтверждения первичной ставки',age_bounds:'Границы возраста',confidence_interval:'Доверительный интервал',phenotype_label:'Обозначение фенотипа',point_estimate:'Точечная оценка'}},
en:{title:'Primary PDFs: changes in knowledge transfer',notice:'The scientific success criterion has not been reached. This is a retrospective diagnostic on previously inspected data. Future controls remain closed; 0 model calls. Codex annotation requires expert review.',result:'Results across 30 held-out comparisons',interpretation:'The exploratory operator issued 10 hypotheses: 7 matches, 3 errors and 20 abstentions. All three errors concern Katz. The frequency baseline matched 26 of 30 orders. An advantage of the structural operator has not been demonstrated.',scope:'Only the ordering of two reported point estimates in adjacent age bands is predicted. This is not a rate magnitude, an individual ageing effect, statistical significance, or a new scientific result.',sources:'Seven acquired primary texts',rates:'49 primary rates and their semantics',repairNote:'The repeated experiment uses 42 verified cells out of the previous 45. Four additional age cells and three observed alternatives are retained separately and do not add votes here.',provenance:'Semantics and exact sources',fragment:'Original excerpt — English',page:'Image of the inspected table',fullText:'Full extracted PDF text with highlighted excerpt',forecasts:'All held-out comparisons',forecastNote:'Exploratory mode permits context differences and coarse outcome labels. These matches do not establish clinical transportability. Strict mode abstained on all 30 queries; confidence intervals do not test the difference.',audit:'Audit of the previous 45 review cells',auditNote:'Three Busse cells are not verified by the cited primary DOI. All 42 verified point values are retained; 5 age boundaries, 1 CI and 6 WHICAP phenotype labels were corrected. Previous maps are unchanged.',comparison:'Comparison with the previous run',comparisonNote:'The total denominators differ: 32 previously, 30 now. Below, 25 queries with identical age bounds and study/outcome labels are compared separately; context has been refined. This diagnoses inputs, not independent superiority.',next:'Next step',nextNote:'Check pattern applicability against phenotype, age allocation, risk set and estimand. Unknown context must remain unknown. Then freeze the operator and a prediction for an independent future control. Tuning on these disclosed outcomes remains development.',validation:'Sealing and reproducibility',all:'All',inspect:'Inspect',repair:'Repeated experiment',additional:'Additional age group',alternative:'Observed alternative',strict:'Strict',exploratory:'Exploratory',frequency:'Frequency baseline',matched:'Matched',wrong:'Error',abstained:'Abstained',higher:'Higher',lower:'Lower',equal:'Equal',quarantined:'Quarantined',numerically_confirmed:'Numbers verified',corrected:'Context / CI corrected',counts:['PDFs acquired','Rates in experiment','Queries','New scientific predictions'],metricsHead:['Mode','Queries','Issued','Matched','Errors','Abstentions'],rateHead:['Study / outcome','Age','Published / 95% CI','Per 1000 PY','Selection','Source'],forecastHead:['Query','Predicted','Reported order','Result','Source / premises'],auditHead:['Cell','Previous age / rate','Primary age / rate','Changes'],changes:{unverified_primary_incidence:'Unverified primary incidence',age_bounds:'Age bounds',confidence_interval:'Confidence interval',phenotype_label:'Phenotype label',point_estimate:'Point estimate'}}};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function band(a){return a[0]+'–'+(a[1]??'∞')}
function headings(id,names){document.getElementById(id).replaceChildren(...names.map(t=>el('th',t)))}
function options(id,items){const s=document.getElementById(id),v=s.value;s.replaceChildren(...items.map(([value,label])=>{const o=el('option',label);o.value=value;return o}));if(items.some(x=>x[0]===v))s.value=v}
function button(text,fn){const b=el('button',text);b.onclick=fn;return b}
function proof(key){const p=data.evidence[key],chars=Array.from(data.texts[p.source_id]);document.getElementById('fragment').textContent=p.text;document.getElementById('fragment').dataset.proof=key;document.getElementById('proof-meta').textContent=p.source_id+' · PDF '+p.pdf_page+' · Unicode ['+p.start+', '+p.end+') · SHA-256 '+p.source_sha256;document.getElementById('full-text').replaceChildren(document.createTextNode(chars.slice(0,p.start).join('')),el('mark',chars.slice(p.start,p.end).join('')),document.createTextNode(chars.slice(p.end).join('')));document.getElementById('table-image').src=data.images[p.source_id]}
function inspect(value,keys){document.getElementById('detail').hidden=false;document.getElementById('frame').textContent=JSON.stringify(value,null,2);document.getElementById('proof-buttons').replaceChildren(...keys.map(k=>button(k,()=>proof(k))));proof(keys[0]);document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function rates(){const body=document.getElementById('rates');body.replaceChildren();for(const r of data.annotation.rates){if(document.getElementById('source-filter').value!=='all'&&r.source_id!==document.getElementById('source-filter').value)continue;if(document.getElementById('rate-filter').value!=='all'&&r.selection!==document.getElementById('rate-filter').value)continue;const n=data.normalized[r.id],tr=el('tr');tr.dataset.rate=r.id;[data.annotation.profiles[r.source_id].study+' / '+r.phenotype,band(r.age),r.value+' / '+r.interval.join('–')+'; per '+r.per_person_years+' PY',n.value+' / '+n.interval.join('–'),L[lang][r.selection]].forEach(t=>tr.append(el('td',t)));const td=el('td');td.append(button(L[lang].inspect,()=>inspect({rate:r,profile:data.annotation.profiles[r.source_id],normalized:n},[r.source_id+':table',...data.annotation.profiles[r.source_id].methods_pages.filter(p=>p!==data.annotation.profiles[r.source_id].table_page).map(p=>r.source_id+':methods-'+p)])));tr.append(td);body.append(tr)}}
function forecasts(){const mode=document.getElementById('mode-filter').value,filter=document.getElementById('outcome-filter').value,body=document.getElementById('forecasts');body.replaceChildren();for(const r of data.evaluation.modes[mode].rows){const status=!r.issued?'abstained':r.matched?'matched':'wrong';if(filter!=='all'&&filter!==status)continue;const tr=el('tr');tr.dataset.query=r.query_id;const p=data.predictions[r.query_id][mode];[r.query_id,L[lang][r.predicted_order]||'—',L[lang][r.reported_order],L[lang][status]].forEach((t,i)=>tr.append(el('td',t,i===3?(status==='wrong'?'bad':status==='matched'?'good':''):'')));const td=el('td'),control=data.controls.controls[r.query_id];td.append(button(L[lang].inspect,()=>inspect({prediction:p,evaluation:r,reported:control,semantic_barriers:data.barriers[r.query_id]},control.evidence_ids)));tr.append(td);body.append(tr)}}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(n=>n.textContent=L[lang][n.dataset.i]);for(const l of ['ru','en'])document.getElementById(l).classList.toggle('active',l===lang);document.getElementById('stats').replaceChildren(...[7,42,30,0].map((v,i)=>{const n=el('div',undefined,'stat');n.append(el('strong',String(v)),el('span',L[lang].counts[i]));return n}));headings('metrics-head',L[lang].metricsHead);document.getElementById('metrics').replaceChildren(...['strict','exploratory','frequency'].map(mode=>{const a=data.evaluation.modes[mode],tr=el('tr');[L[lang][mode],a.queries,a.issued,a.matched,a.wrong_order,a.abstained].forEach(t=>tr.append(el('td',String(t))));return tr}));document.getElementById('cards').replaceChildren(...Object.entries(data.annotation.profiles).map(([id,p])=>{const c=el('article',undefined,'card');c.append(el('h3',p.study),el('code',data.identities[id].doi),el('p',p.summary[lang]),el('span',p.cohort,'chip'),el('p',data.identities[id].pdf_sha256,'muted small'),button(L[lang].inspect,()=>inspect(p,[id+':title',id+':table',...p.methods_pages.filter(page=>page!==p.table_page).map(page=>id+':methods-'+page)])));return c}));options('source-filter',[['all',L[lang].all],...Object.entries(data.annotation.profiles).map(([id,p])=>[id,p.study])]);options('rate-filter',[['all',L[lang].all],...['repair','additional','alternative'].map(s=>[s,L[lang][s]])]);options('mode-filter',['exploratory','strict','frequency'].map(s=>[s,L[lang][s]]));options('outcome-filter',[['all',L[lang].all],...['matched','wrong','abstained'].map(s=>[s,L[lang][s]])]);headings('rate-head',L[lang].rateHead);headings('forecast-head',L[lang].forecastHead);headings('audit-head',L[lang].auditHead);rates();forecasts();document.getElementById('audit').replaceChildren(...data.audit.rows.map(r=>{const tr=el('tr');tr.dataset.audit=r.id;[r.id,band(r.review.age)+' / '+r.review.value,r.primary?band(r.primary.age)+' / '+r.normalized.value:'—',r.changes.length?r.changes.map(k=>L[lang].changes[k]).join('; '):L[lang].numerically_confirmed].forEach(t=>tr.append(el('td',t)));return tr}));document.getElementById('paired').textContent=JSON.stringify(data.paired,null,2);document.getElementById('validation').textContent=JSON.stringify(data.validation,null,2)}
document.getElementById('ru').onclick=()=>{lang='ru';render()};document.getElementById('en').onclick=()=>{lang='en';render()};for(const id of ['source-filter','rate-filter'])document.getElementById(id).onchange=rates;for(const id of ['mode-filter','outcome-filter'])document.getElementById(id).onchange=forecasts;render();
</script></html>
