<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Зафиксированный свободный прогноз</title><style>body{font-family:system-ui,sans-serif;background:#f1f5fb;color:#203550;max-width:1160px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;gap:18px}.card{background:white;border:1px solid #d1dceb;border-radius:12px;margin:18px 0;padding:22px}.warning{background:#fff5e4}p{line-height:1.6}button,select{font:inherit;padding:9px 14px;border:1px solid #94a9c6;background:white;color:#21558a;border-radius:8px;cursor:pointer}button:hover{background:#e6f0ff}button:focus-visible{outline:3px solid #287ddd}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #d5dfed;padding:10px;text-align:left;vertical-align:top}.scroll{overflow:auto}.stats{display:flex;flex-wrap:wrap;gap:30px}.stats strong{display:block;font-size:30px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5fb;padding:12px;max-height:350px;overflow:auto;font-size:13px}#ids{font-size:11px;overflow-wrap:anywhere}a{color:#225c9a}h1{font-size:28px}h2{font-size:21px}</style>
<header><div><h1 id="title"></h1><p id="intro"></p></div><button id="language">English</button></header><div class="card stats" id="stats"></div><section class="card warning"><h2 id="status-title"></h2><p id="status"></p><p id="baseline-note"></p></section><section class="card"><h2 id="candidate-title"></h2><select id="mode"></select><div class="scroll"><table><thead id="head"></thead><tbody id="candidates"></tbody></table></div></section><section class="card"><h2 id="evidence-title"></h2><div id="evidence"></div></section><section class="card"><h2 id="metadata-title"></h2><p id="metadata-note"></p><div class="scroll"><table><thead id="metadata-head"></thead><tbody id="metadata"></tbody></table></div></section><section class="card"><h2 id="rules-title"></h2><p id="rules"></p><h2 id="limits-title"></h2><p id="limits"></p><p id="ids"></p><details><summary id="json-title"></summary><pre id="json"></pre></details></section>
<script type="application/json" id="data">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),G=D.seal.generation,P=G.forecast.predictions;let lang='ru',mode='semantic',selected=P.semantic[0].id;
const I={ru:{title:'Свободные качественные гипотезы: зафиксировано до выбора цели',intro:'Предстоит независимый контроль на ранее не разобранной статье после обучающего среза.',stats:['Обучающие знания','Независимые когорты','Строгие гипотезы','Подтверждённые новые знания'],statusTitle:'Контроль ещё не выполнен',status:'Независимые совпадения и дополнительный выигрыш не измерены. Получены только библиографические метаданные. Аннотации и полные тексты новых кандидатов не открывались.',baselineNote:'Обе строгие гипотезы есть также в объединении известных паттернов и частотной базе. Преимущество графа пока не показано.',candidateTitle:'Гипотезы и базовые режимы',modes:{semantic:'Поддержка минимум двух когорт',known_union:'Известные паттерны',frequency:'Частотная база'},relation:'Отношение',direction:'Ожидаемое направление',cohorts:'Когорты поддержки',inspect:'Посылки и контексты',factors:{education:'Меньшее образование',age:'Больший возраст',sex:'Мужчины относительно женщин'},phenotypes:{nonmemory_mci:'немнестическое MCI',any_domain_mci:'MCI любого домена',memory_mci_inclusive:'MCI с нарушением памяти',isolated_memory_mci:'MCI с изолированным нарушением памяти',aacd_any_domain:'AACD любого домена',ocind_global_cognitive_impairment:'OCIND'},directions:{higher:'Выше',lower:'Ниже',mixed:'Смешанное',no_clear_pattern:'Нет ясного направления',equal:'Равно'},evidenceTitle:'Исходные знания и скрытая семантика',evidenceNote:'Эмпирическая поддержка требует минимум двух независимых когорт. Это гипотеза повторения паттерна; репликации не являются обязательными совместными логическими посылками. Размер эффекта, значимость и причинность не предсказываются.',metadataTitle:'Предварительные кандидаты контроля',metadataNote:'Метаданные Crossref получены после фиксации. Пригодность методов и независимость когорт пока не проверены. Частичные даты не задают точный хронологический порядок.',date:'Дата как опубликована',titleColumn:'Название',rulesTitle:'Предварительно заданные условия оценки',rules:'Нужны совместимые фактор, контраст, фенотип, hazard-ассоциация, исходное отсутствие MCI/деменции, независимая когорта и проспективная инцидентность. Неизвестное обязательное условие блокирует положительный результат. Необнаруженная связь сохраняется как неопределённость; отсутствие результата не является опровержением. Пороги, нормы, возраст, ковариаты и выбывание сравниваются отдельно.',limitsTitle:'Границы опыта',limits:'Обучающий срез — до конца 2023 года; публикации контроля — 2024–2025. Фиксация сделана сейчас: это исторический контроль, не прогноз, опубликованный до статьи. Знание статьи параметрами Codex не удостоверено. Генератор читает только старые входы; сеть отключена. Моделей, эмбеддингов и переводчика нет. Разметка требует экспертной проверки. Старые карты, GOLD и сервисы не изменены.',jsonTitle:'Зафиксированный JSON'},en:{title:'Free qualitative hypotheses frozen before target selection',intro:'An independent post-cutoff article, not previously analysed, remains to be checked.',stats:['Training claims','Independent cohorts','Strict hypotheses','Confirmed new knowledge'],statusTitle:'Control not evaluated yet',status:'Independent matches and incremental gain are unmeasured. Only bibliographic metadata obtained; new candidate abstracts and full texts remain unopened.',baselineNote:'Both strict hypotheses also occur in known-union and frequency baselines. No graph advantage demonstrated.',candidateTitle:'Hypotheses and baselines',modes:{semantic:'At least two independent cohorts',known_union:'Known patterns',frequency:'Frequency baseline'},relation:'Relation',direction:'Expected direction',cohorts:'Supporting cohorts',inspect:'Premises and contexts',factors:{education:'Less education',age:'Older age',sex:'Men versus women'},phenotypes:{nonmemory_mci:'nonmemory MCI',any_domain_mci:'any-domain MCI',memory_mci_inclusive:'memory-inclusive MCI',isolated_memory_mci:'isolated-memory MCI',aacd_any_domain:'any-domain AACD',ocind_global_cognitive_impairment:'OCIND'},directions:{higher:'Higher',lower:'Lower',mixed:'Mixed',no_clear_pattern:'No clear pattern',equal:'Equal'},evidenceTitle:'Source knowledge and hidden semantics',evidenceNote:'Empirical support requires at least two independent cohorts. This hypothesizes pattern recurrence; replications are not mandatory joint logical premises. No effect size, significance or causality forecast.',metadataTitle:'Preliminary control candidates',metadataNote:'Crossref metadata obtained after sealing. Methods and cohort independence remain unchecked. Partial dates do not establish precise chronological order.',date:'Date as reported',titleColumn:'Title',rulesTitle:'Predeclared evaluation conditions',rules:'Require compatible factor, contrast, phenotype, hazard association, baseline free of MCI/dementia, independent cohort and prospective incidence. Unknown hard conditions block a positive result. Nondetection remains uncertainty; absence of a result is not refutation. Thresholds, norms, age, covariates and attrition are compared separately.',limitsTitle:'Study limits',limits:'Training cutoff: end of 2023. Control publication window: 2024–2025. Sealed now: a historical holdout, not a forecast published before the article. Codex parametric ignorance is not certified. Generator reads only old inputs with network disabled. No models, embeddings or translator; annotations require expert review. Old maps, GOLD and services unchanged.',jsonTitle:'Frozen JSON'}};
function el(tag,text,parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e;}function set(id,text){document.getElementById(id).textContent=text;}
function inspect(id){selected=id;const t=I[lang],root=document.getElementById('evidence');root.replaceChildren();const c=Object.values(P).flat().find(c=>c.id===id);if(!c)return;el('p',t.evidenceNote,root);el('pre',JSON.stringify({signature:c.signature,direction:c.expected_direction,support:c.support_semantics,significance:c.expected_significance,effect_size:c.expected_effect_size,causal:c.causal},null,2),root);for(const claim of c.premises){el('h3',`${claim.id} · ${claim.family_id}`,root);el('pre',JSON.stringify(claim.semantic_frame,null,2),root);el('pre',JSON.stringify(claim.context,null,2),root);for(const proof of claim.provenance){const f=D.seal.inputs.annotation.evidence[proof];el('p',`${f.source_id} · Unicode code points ${f.start}–${f.end}`,root);const pre=el('pre',f.text,root);pre.dataset.proof=proof;}}}
function rows(){const t=I[lang],body=document.getElementById('candidates');body.replaceChildren();for(const c of P[mode]){const s=c.signature,tr=el('tr',undefined,body);tr.dataset.id=c.id;el('td',`${t.factors[s.factor]||s.factor} → ${t.phenotypes[s.phenotype]||s.phenotype} · ${s.estimand}`,tr);el('td',t.directions[c.expected_direction]||c.expected_direction,tr);el('td',c.cohorts.join(', '),tr);const b=el('button',t.inspect,el('td',undefined,tr));b.onclick=()=>inspect(c.id);}inspect(selected);}
function render(){const t=I[lang];document.documentElement.lang=lang;document.title=t.title;set('language',lang==='ru'?'English':'Русский');for(const [id,key]of Object.entries({'title':'title','intro':'intro','status-title':'statusTitle','status':'status','baseline-note':'baselineNote','candidate-title':'candidateTitle','evidence-title':'evidenceTitle','metadata-title':'metadataTitle','metadata-note':'metadataNote','rules-title':'rulesTitle','rules':'rules','limits-title':'limitsTitle','limits':'limits','json-title':'jsonTitle'}))set(id,t[key]);const stats=document.getElementById('stats');stats.replaceChildren();[23,6,2,0].forEach((v,i)=>{const c=el('div',undefined,stats);el('strong',v,c);el('span',t.stats[i],c);});const select=document.getElementById('mode');select.replaceChildren();for(const [k,v]of Object.entries(t.modes)){const o=el('option',v,select);o.value=k;}select.value=mode;const head=document.getElementById('head');head.replaceChildren();const tr=el('tr',undefined,head);[t.relation,t.direction,t.cohorts,''].forEach(v=>el('th',v,tr));rows();const mh=document.getElementById('metadata-head');mh.replaceChildren();const hr=el('tr',undefined,mh);[t.date,t.titleColumn,'DOI'].forEach(v=>el('th',v,hr));const mb=document.getElementById('metadata');mb.replaceChildren();for(const c of D.metadata.candidates){const tr=el('tr',undefined,mb);el('td',c.publication_date_parts.join('-'),tr);el('td',c.title,tr);const a=el('a',c.doi,el('td',undefined,tr));a.href='https://doi.org/'+encodeURIComponent(c.doi);a.rel='noreferrer';}set('ids','run_id: '+D.seal.run_id);set('json',JSON.stringify(D,null,2));}
document.getElementById('mode').onchange=e=>{mode=e.target.value;selected=P[mode][0].id;rows();};document.getElementById('language').onclick=()=>{lang=lang==='ru'?'en':'ru';render();};render();
</script></html>
