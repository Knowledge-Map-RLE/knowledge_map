<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Качественные отношения между исследованиями</title><style>
:root{font:16px/1.55 system-ui;background:#f3f6fa;color:#20324a}*{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:auto;padding:26px}header{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:29px;line-height:1.25}h2{font-size:22px;margin-top:30px}button,select{font:inherit;padding:8px 12px;border:1px solid #a7bbd0;border-radius:7px;background:white;color:#245081;cursor:pointer}button.active{background:#23568e;color:white}button:hover{background:#e5edf7}button:focus-visible,select:focus-visible{outline:3px solid #dba235;outline-offset:2px}.notice{background:#fff3dc;border-left:4px solid #b88a24;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:white;padding:17px;border:1px solid #d5dfeb;border-radius:8px}.stat strong{display:block;font-size:29px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;background:white;font-size:14px}td,th{text-align:left;vertical-align:top;padding:11px;border-bottom:1px solid #dde5ef}th{background:#e7eef7}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,monospace}.source{max-height:420px;overflow:auto;background:#f4f6fa;padding:14px}mark{background:#ffdc89}.muted{color:#61748a}.good{color:#226b4e}.bad{color:#a6373c}details{margin:15px 0}summary{cursor:pointer;font-weight:600}.trace{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px}.trace button{max-width:370px;text-align:left}@media(max-width:720px){main{padding:14px}header{align-items:flex-start}h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr)}}

<script id="data" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent);let lang='ru',selected=null,selectedAudits=[],selectedPatterns=[];
const L={ru:{title:'Качественный результат: направление, обнаружение и контекст',notice:'Это ретроспективный опыт на прочитанных источниках. Три совпадения относятся к переносу известного качественного паттерна, а не к слепому предсказанию нового научного знания. Преимущество над базами не показано. Модельных вызовов — 0.',counts:['Качественных записей','Независимых когорт','Совпадения паттерна','Новых научных прогнозов'],finding:'Содержательный паттерн',findingNote:'Manly (WHICAP), Roberts (Mayo) и Katz (EAS) сообщают связь меньшего образования с более высоким риском неамнестического MCI. При удержании каждой когорты две другие поддерживают то же направление. Пороговые годы обучения и эффект на один год не становятся одинаковыми измерениями: исходные контрасты, нормы, возрастная шкала, поправки и неизвестные поля сохранены.',metrics:'Сравнение трёх режимов на 23 удержанных записях',metricHead:['Режим','Качественные совпадения','Несогласованный перенос','Неопределённость','Неоднозначные известные паттерны','Не охвачено'],metricNote:'На трёх общих совпавших случаях все режимы дали одинаковый ответ. Семантический режим охватывает 3 из 23 записей; отсутствие ошибок при таком охвате не доказывает лучшую точность. Частотная база и поиск известных паттернов находят пять совпадений и одну неудачу переноса. Полное тождество научных фактов не подтверждено ни одним из этих счётчиков.',holdouts:'Просмотр удержанных когорт',caseHead:['Запись','Отношение / фенотип','Прогноз направления','Наблюдение: направление и обнаружение','Оценка','Источник'],detail:'Скрытая семантика и основания',context:'Полный сохранённый контекст',audit:'Сопоставление контекстов с предпосылками',full:'Полный текст с выделенным фрагментом',pairs:'Трудные контрольные пары',pairNote:'Все девять ожидаемых отношений размечены Codex и требуют экспертной проверки. Необнаруженная связь не становится биологическим нулём; разные популяции или методы могут давать разные результаты без логического противоречия. Большее значение частоты само по себе не доказывает значимость скорректированной связи.',pairHead:['Пара','Записи','Отношение','Полная эквивалентность фактов','Просмотр'],next:'Что проверять дальше',nextNote:'Готовый сравнитель допускает качественный результат и сохраняет условия. Следующий научный опыт должен зафиксировать кандидатов до открытия нового контроля и различать репликацию известного паттерна и новое утверждение. Для показанного паттерна нужен новый независимый неамнестический исход, а для цели всей системы — генерация нового сочетания знаний и сравнение с базами. Целевые данные и названия изучаемых когорт не должны подбирать кандидатов. Отдельная польза dependency-графа этим опытом не проверялась.',validation:'Фиксация, версии и ограничения',inspect:'Показать',all:'Все',semantic:'Семантический перенос',known_union:'Известные паттерны',frequency:'Частотная база',factorLabels:{age:'Возраст',sex:'Пол',education:'Образование'},directions:{higher:'Выше',lower:'Ниже',equal:'Равно',mixed:'Смешанный порядок',no_clear_pattern:'Нет ясного порядка',unspecified:'Направление не сообщено'},findings:{detected:'Связь обнаружена',not_detected:'Связь не обнаружена',not_reported:'Тест не сообщён'},statuses:{qualitative_pattern_match:'Совпадение качественного паттерна',inconsistent_transfer:'Перенос не согласуется',uncertain:'Неопределённость',not_addressed:'Не охвачено',ambiguous_known_patterns:'Несколько известных направлений'},relations:{same_pattern:'Одинаковый качественный паттерн',partial_pattern:'Частичное соответствие',different_estimand:'Разные оцениваемые величины',different_phenotype:'Разные фенотипы',different_relation:'Разные отношения',direction_disagreement:'Направления расходятся',statistical_disagreement:'Разные статистические выводы'},no:'Нет',foldNote:'Когорта полностью исключена из обучения. Числа эффектов не передаются прогнозирующему процессу; в исходном фрагменте они сохранены.',premise:'Предпосылка',prediction:'Гипотеза направления'},en:{title:'Qualitative result: direction, detection and context',notice:'This is a retrospective experiment on previously read sources. Three agreements concern transfer of a known qualitative pattern, not blind prediction of new scientific knowledge. No advantage over baselines is shown. Model calls: 0.',counts:['Qualitative records','Independent cohorts','Pattern agreements','New scientific predictions'],finding:'A substantive qualitative pattern',findingNote:'Manly (WHICAP), Roberts (Mayo) and Katz (EAS) report lower education associated with greater risk of nonamnestic MCI. With each cohort withheld, the other two support the same direction. Schooling thresholds and a per-year effect are not identical measurements: native contrasts, norms, age basis, adjustments and unknowns are preserved.',metrics:'Three modes on 23 withheld records',metricHead:['Mode','Pattern agreements','Inconsistent transfers','Uncertain','Ambiguous known patterns','Not addressed'],metricNote:'All modes give the same answer on the three common agreements. Semantic transfer addresses 3 of 23 records; zero errors at this coverage does not establish better accuracy. Known-pattern retrieval and frequency obtain five agreements and one inconsistent transfer. None of these counts establishes full scientific fact equivalence.',holdouts:'Inspect withheld cohorts',caseHead:['Record','Relation / phenotype','Direction forecast','Observed direction and detection','Evaluation','Source'],detail:'Hidden semantics and evidence',context:'Complete preserved context',audit:'Context comparison with premises',full:'Full text with highlighted fragment',pairs:'Difficult source control pairs',pairNote:'All nine expected relations are Codex annotations requiring expert review. Nondetection is not biological absence; distinct populations or methods can give distinct findings without a logical contradiction. A higher descriptive rate alone does not establish significance of an adjusted association.',pairHead:['Pair','Records','Relation','Full scientific fact equivalence','Inspect'],next:'Next evaluation',nextNote:'The comparator supports qualitative outcomes and preserves conditions. The next scientific experiment must freeze candidates before opening a new control and distinguish replication of a known pattern from a novel proposition. This pattern needs another independent nonamnestic outcome; the system goal also needs generation of a new knowledge combination and baseline comparisons. Target findings and cohort names must not select candidates. Dependency-graph value was not tested here.',validation:'Seals, versions and limitations',inspect:'Inspect',all:'All',semantic:'Semantic transfer',known_union:'Known patterns',frequency:'Frequency baseline',factorLabels:{age:'Age',sex:'Sex',education:'Education'},directions:{higher:'Higher',lower:'Lower',equal:'Equal',mixed:'Mixed order',no_clear_pattern:'No clear order',unspecified:'Direction not reported'},findings:{detected:'Association detected',not_detected:'Association not detected',not_reported:'Test not reported'},statuses:{qualitative_pattern_match:'Qualitative pattern agreement',inconsistent_transfer:'Inconsistent transfer',uncertain:'Uncertain',not_addressed:'Not addressed',ambiguous_known_patterns:'Multiple known directions'},relations:{same_pattern:'Same qualitative pattern',partial_pattern:'Partial correspondence',different_estimand:'Different estimands',different_phenotype:'Different phenotypes',different_relation:'Different relations',direction_disagreement:'Direction disagreement',statistical_disagreement:'Different statistical findings'},no:'No',foldNote:'The entire cohort is excluded from training. Numerical effects are not passed to forecasting; the original fragment retains them.',premise:'Premise',prediction:'Direction hypothesis'}};
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function button(text,fn){const b=el('button',text);b.onclick=fn;return b}
function options(id,items){const s=document.getElementById(id),old=s.value;s.replaceChildren(...items.map(([v,t])=>{const o=el('option',t);o.value=v;return o}));if(items.some(([v])=>v===old))s.value=old}
function head(id,items){document.getElementById(id).replaceChildren(...items.map(t=>el('th',t)))}
function proof(id){const p=data.evidence[id],text=data.texts[p.source_id],s=Array.from(text);document.getElementById('fragment').textContent=s.slice(p.start,p.end).join('');document.getElementById('fragment').dataset.proof=id;document.getElementById('proof-meta').textContent=p.source_id+' · PDF '+p.pdf_page+' · Unicode ['+p.start+', '+p.end+') · '+p.source_sha256;document.getElementById('full-text').replaceChildren(document.createTextNode(s.slice(0,p.start).join('')),el('mark',p.text),document.createTextNode(s.slice(p.end).join('')))}
function show(id,audits=[],patterns=[]){selected=id;selectedAudits=audits;selectedPatterns=patterns;const c=data.claims[id],l=L[lang];document.getElementById('detail').hidden=false;document.getElementById('case-title').textContent=id+' · '+c.family_id+' · '+l.factorLabels[c.factor]+' · '+c.phenotype;document.getElementById('frame').textContent=JSON.stringify(c.semantic_frame,null,2);document.getElementById('context').textContent=JSON.stringify(c.context,null,2);document.getElementById('context-audit').textContent=JSON.stringify(audits,null,2);const trace=document.getElementById('trace');trace.replaceChildren();for(const p of patterns){for(const premise of p.premises)trace.append(button(l.premise+': '+premise.id,()=>show(premise.id)),el('span','→'));trace.append(el('span',l.prediction+': '+l.directions[p.expected_direction]))}document.getElementById('proof-buttons').replaceChildren(...c.provenance.map(id=>button(id,()=>proof(id))));proof(c.provenance[0])}
function cases(){const mode=document.getElementById('mode').value,foldId=document.getElementById('fold').value,factor=document.getElementById('factor').value,l=L[lang],body=document.getElementById('cases');body.replaceChildren();document.getElementById('fold-note').textContent=l.foldNote;for(const f of data.evaluation.folds){if(foldId!=='all'&&f.fold_id!==foldId)continue;const sealed=data.sealed.folds.find(v=>v.fold_id===f.fold_id);for(const r of f.modes[mode].rows){const c=data.claims[r.id];if(factor!=='all'&&c.factor!==factor)continue;const tr=el('tr');tr.dataset.case=r.id;tr.dataset.fold=f.fold_id;[r.id+' / '+c.family_id,l.factorLabels[c.factor]+' / '+c.phenotype,r.expected_directions.map(d=>l.directions[d]).join(', ')||'—',l.directions[c.result.direction]+'; '+l.findings[c.result.statistical_finding],l.statuses[r.status]].forEach(t=>tr.append(el('td',t)));tr.children[4].className=r.status==='qualitative_pattern_match'?'good':r.status==='inconsistent_transfer'?'bad':'';const td=el('td');td.append(button(l.inspect,()=>show(r.id,r.context_audits,sealed.predictions[mode].filter(p=>r.pattern_ids.includes(p.id)))));tr.append(td);body.append(tr)}}}
function render(){const l=L[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(n=>n.textContent=l[n.dataset.i]);for(const v of ['ru','en'])document.getElementById(v).classList.toggle('active',v===lang);document.getElementById('stats').replaceChildren(...[23,6,3,0].map((v,i)=>{const n=el('div');n.className='stat';n.append(el('strong',String(v)),el('span',l.counts[i]));return n}));head('metric-head',l.metricHead);document.getElementById('metrics').replaceChildren(...['semantic','known_union','frequency'].map(mode=>{const counts=data.evaluation.totals[mode],tr=el('tr');[l[mode],...['qualitative_pattern_match','inconsistent_transfer','uncertain','ambiguous_known_patterns','not_addressed'].map(k=>counts[k]||0)].forEach(t=>tr.append(el('td',String(t))));return tr}));options('mode',['semantic','known_union','frequency'].map(v=>[v,l[v]]));options('fold',[['all',l.all],...data.sealed.folds.map(f=>[f.fold_id,f.withheld_family])]);options('factor',[['all',l.all],...['age','sex','education'].map(v=>[v,l.factorLabels[v]])]);head('case-head',l.caseHead);cases();head('pair-head',l.pairHead);document.getElementById('pairs').replaceChildren(...data.pairs.map(p=>{const tr=el('tr');[p.id,p.left+' ↔ '+p.right,l.relations[p.result.relation],l.no].forEach(t=>tr.append(el('td',t)));const td=el('td');td.append(button(p.left,()=>show(p.left,[p.result])),button(p.right,()=>show(p.right,[p.result])));tr.append(td);return tr}));document.getElementById('validation').textContent=JSON.stringify(data.validation,null,2);if(selected)show(selected,selectedAudits,selectedPatterns)}
document.getElementById('ru').onclick=()=>{lang='ru';render()};document.getElementById('en').onclick=()=>{lang='en';render()};for(const id of ['mode','fold','factor'])document.getElementById(id).onchange=cases;render();
</script></html>
