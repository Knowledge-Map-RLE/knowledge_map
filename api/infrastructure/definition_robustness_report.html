<script id="data" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent);let lang='ru',selectedProof='table3';
const L={ru:{title:'Какие изменения определения сохраняют порядок?',notice:'Критерий научного предсказания пока не достигнут. Это ретроспективная диагностика первоисточника, а не новый прогноз. Ни один мост переноса не активирован. Модельных вызовов — 0.',counts:['Проверенных возрастных ставок','Определения в одной когорте','Исправленных привязки источника','Новых независимых когорт'],repair:'Восстановлен первоисточник трёх чисел',repairNote:'Обзор связал показатели с Acta Neurol Scand 2003 о распространённости. Числа и CI найдены в другой статье Busse: British Journal of Psychiatry, DOI 10.1192/bjp.182.5.449, таблица 3. Старые файлы сохранены. Это узкое изолированное амнестическое MCI, а не произвольное MCI; возраст задан на исходной волне. Когорта LEILA75+ уже представлена Luck 2010.',repairHead:['Возраст','Ставка / 1000 человеко-лет','95% CI','Проверка'],rates:'Четыре определения, один первоисточник',rateNote:'Каждая строка — отдельное определение с собственным составом группы риска и знаменателями. Числа не объединяются. Контекст, методы, таблица и ограничения доступны ниже.',rateHead:['Определение','Возраст','Случаи / человеко-лет','Ставка','95% CI','Источник'],robustness:'Проверка порядка точечных оценок',robustnessNote:'Удаление жалобы сохраняет все три попарных порядка в каждом из двух диагностических концептов: 6 из 6 сравнений. Между MCI и AACD порядок 80–84 → 85+ противоположен при обоих вариантах жалобы. Кроме фенотипа отличаются другие критерии; причинный эффект отдельного критерия не установлен. Сравнения одной когорты не являются независимыми повторениями.',orderHead:['Возрастной переход','Первое определение','Второе определение','Порядок сохранён?','Источник'],source:'Точные исходные фрагменты',full:'Полный текст с выделением фрагмента',pdf:'Исходный PDF',tableImage:'Изображение таблицы 3',next:'Следующий шаг',nextNote:'Сохранить строгую проверку эквивалентности фактов и отдельно проверять перенос именно порядка. Удаление жалобы — кандидат для последующей независимой проверки, не готовое правило. Нужно получить парные определения в MYHAT, проверить границы возрастов и воспроизвести эффект в другой когорте до проверки будущей статьи. Прежние прогнозы и карты не пересобраны.',access:'Полный текст Ganguli 2013 через выбранный маршрут Europe PMC не получен: два ответа HTTP 503. Для продолжения нужны сама статья и приложение с таблицей e-2. Недоступность маршрута не доказывает отсутствие доступа к статье.',audit:'Версии и техническая проверка',inspect:'Показать',yes:'Да',no:'Нет',all:'Все пары возрастов',adjacent:'Только соседние группы',higher:'Выше',lower:'Ниже',equal:'Одинаково',confirmed:'Число и CI подтверждены',comparisonNames:['MCI: удаление жалобы','AACD: удаление жалобы','MCI ↔ AACD: исходные определения','MCI ↔ AACD: без жалобы']},en:{title:'Which definition changes preserve the order?',notice:'The scientific prediction criterion remains unmet. This is a retrospective primary-source diagnostic, not a new forecast. No transfer bridge has been activated. Model calls: 0.',counts:['Verified age-specific rates','Definitions in one cohort','Repaired source bindings','New independent cohorts'],repair:'The primary source of three numbers was recovered',repairNote:'The review linked the estimates to the Acta Neurol Scand 2003 prevalence paper. Matching numbers and CIs are in a different Busse paper: British Journal of Psychiatry, DOI 10.1192/bjp.182.5.449, table 3. Old files are preserved. The endpoint is isolated amnestic MCI, not arbitrary MCI; age is at the baseline wave. LEILA75+ is already represented by Luck 2010.',repairHead:['Age','Rate / 1000 person-years','95% CI','Audit'],rates:'Four definitions, one primary source',rateNote:'Each definition has its own at-risk population and denominators. Rates are not pooled. Context, methods, table and limitations can be inspected below.',rateHead:['Definition','Age','Cases / person-years','Rate','95% CI','Source'],robustness:'Point-estimate order diagnostic',robustnessNote:'Removing the complaint requirement preserves all three pairwise age orders within each of two diagnostic concepts: 6 of 6 comparisons. MCI and AACD give opposite orders for 80–84 → 85+ with and without the complaint requirement. Other criteria also differ; no causal effect of a single criterion is established. Comparisons within one cohort are not independent replications.',orderHead:['Age comparison','First definition','Second definition','Order preserved?','Source'],source:'Exact source fragments',full:'Full text with highlighted fragment',pdf:'Original PDF',tableImage:'Table 3 image',next:'Next step',nextNote:'Keep fact-equivalence checks strict while evaluating transport of the order separately. Complaint removal is a candidate for independent testing, not an approved rule. Obtain the paired MYHAT definitions, inspect age boundaries and replicate in another cohort before testing a future article. Previous forecasts and maps have not been rebuilt.',access:'The selected Europe PMC route did not deliver Ganguli 2013: two HTTP 503 responses. Both the article and supplementary table e-2 are needed. Route failure does not establish that the article is unavailable elsewhere.',audit:'Versions and technical validation',inspect:'Inspect',yes:'Yes',no:'No',all:'All age pairs',adjacent:'Adjacent age groups only',higher:'Higher',lower:'Lower',equal:'Equal',confirmed:'Estimate and CI confirmed',comparisonNames:['MCI: complaint removal','AACD: complaint removal','MCI ↔ AACD: original definitions','MCI ↔ AACD: without complaint']}};
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function button(text,fn){const b=el('button',text);b.onclick=fn;return b}
function head(id,items){document.getElementById(id).replaceChildren(...items.map(v=>el('th',v)))}
function age(a){return a[1]===null?a[0]+'+':a.join('–')}
function showProof(id){selectedProof=id;const p=data.evidence[id],text=data.texts[p.source_id],s=Array.from(text);document.getElementById('fragment').textContent=s.slice(p.start,p.end).join('');document.getElementById('fragment').dataset.proof=id;document.getElementById('proof-meta').textContent=p.source_id+' · PDF '+p.pdf_page+' · Unicode ['+p.start+', '+p.end+') · '+p.source_sha256;document.getElementById('full-text').replaceChildren(document.createTextNode(s.slice(0,p.start).join('')),el('mark',p.text),document.createTextNode(s.slice(p.end).join('')))}
function orders(){const c=data.result.comparisons[Number(document.getElementById('comparison').value)||0];document.getElementById('changes').textContent=JSON.stringify({varied_fields:c.varied_fields,first:data.spec.series.find(s=>s.id===c.definitions[0]).context,second:data.spec.series.find(s=>s.id===c.definitions[1]).context},null,2);const body=document.getElementById('orders');body.replaceChildren();for(const r of c.rows){if(document.getElementById('age-filter').value==='adjacent'&&!r.adjacent)continue;const tr=el('tr');tr.dataset.comparison=c.id;[r.ages.map(age).join(' → '),c.definitions[0]+': '+L[lang][r.orders[c.definitions[0]]],c.definitions[1]+': '+L[lang][r.orders[c.definitions[1]]],r.point_order_preserved?L[lang].yes:L[lang].no].forEach(t=>tr.append(el('td',t)));tr.children[3].className=r.point_order_preserved?'good':'bad';const td=el('td');td.append(button(L[lang].inspect,()=>showProof('table3')));tr.append(td);body.append(tr)}}
function render(){const l=L[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(n=>n.textContent=l[n.dataset.i]);for(const v of ['ru','en'])document.getElementById(v).classList.toggle('active',v===lang);document.getElementById('stats').replaceChildren(...[12,4,3,0].map((v,i)=>{const n=el('div');n.className='stat';n.append(el('strong',String(v)),el('span',l.counts[i]));return n}));head('repair-head',l.repairHead);document.getElementById('repairs').replaceChildren(...data.repairs.repairs.map(r=>{const tr=el('tr');[age(r.cell.age),r.cell.value,r.cell.interval.join('–'),l.confirmed].forEach(t=>tr.append(el('td',t)));return tr}));head('rate-head',l.rateHead);const rates=document.getElementById('rates');rates.replaceChildren();for(const s of data.spec.series)for(const c of s.cells){const tr=el('tr');tr.dataset.cell=s.id+':'+c.age[0];[s.definition,age(c.age),c.cases+' / '+c.person_years,c.value,c.interval.join('–')].forEach(t=>tr.append(el('td',t)));const td=el('td');td.append(button(l.inspect,()=>showProof(c.evidence_id)));tr.append(td);rates.append(tr)}head('order-head',l.orderHead);const sel=document.getElementById('comparison'),old=sel.value;sel.replaceChildren(...l.comparisonNames.map((v,i)=>{const o=el('option',v);o.value=String(i);return o}));sel.value=old||'0';const filter=document.getElementById('age-filter'),f=filter.value;filter.replaceChildren(...[['all',l.all],['adjacent',l.adjacent]].map(([v,t])=>{const o=el('option',t);o.value=v;return o}));filter.value=f||'all';orders();document.getElementById('proof-buttons').replaceChildren(...Object.keys(data.evidence).map(id=>button(id,()=>showProof(id))));showProof(selectedProof);document.getElementById('validation').textContent=JSON.stringify(data.validation,null,2)}
document.getElementById('ru').onclick=()=>{lang='ru';render()};document.getElementById('en').onclick=()=>{lang='en';render()};document.getElementById('comparison').onchange=orders;document.getElementById('age-filter').onchange=orders;render();
</script></html>
