</main><script id="data" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent);let lang='ru',selected=null;
const L={ru:{title:'Когда шаблон можно переносить между статьями',notice:'Научный критерий успеха не достигнут. Новый допуск проверен ретроспективно; это не слепой будущий контроль и не научное доказательство. Модельных вызовов — 0.',change:'Что изменено',changeNote:'Применимость определяется отдельными семантическими полями, а не совпадением длинных описаний. Разный исход, возрастная шкала, порог диагностики или оценённая величина блокируют перенос этого оператора. Страна, период, срок наблюдения и размер выборки остаются предупреждениями; их совпадение не доказывает переносимость.',result:'Результаты на тех же 30 запросах',resultNote:'Новый режим воздержался во всех случаях. Вместе с 3 прежними ошибками отклонены и 7 прежних совпадений. Это потеря покрытия, а не улучшение точности. Частотная база с тем же допуском также воздержалась.',queries:'Какие данные отсутствуют',queryNote:'21 запрос содержит неизвестные существенные поля. Для остальных 9 область описана, но нет двух допущенных независимых когортных проектов. Отказы помогают диагностике; предсказательный успех ими не измеряется.',detail:'Область и предпосылки запроса',source:'Методы и определение исхода — точный источник',fullText:'Полный сохранённый текст с выделенным фрагментом',rules:'Правила допуска',next:'Практический следующий шаг',nextNote:'Расширять корпус адресно: искать полные первичные статьи с сопоставимым фенотипом, явным способом учёта возраста, правилами диагностики и расчёта ставки; проверять независимость когорт. Либо отдельно обосновывать и проверять мост между различающимися определениями. Простое увеличение числа статей не создаёт сопоставимых свидетельств. Будущий контроль не открывался.',limits:'Ограничения и воспроизводимость',limitNote:'Разметка Codex требует экспертной проверки. Набор существенных полей — консервативная политика этого оператора, а не доказательство невозможности переноса вообще. Совместимость полей не устанавливает эквивалентность знаний, причинность или статистическую значимость. Регистратор входов читает только перечисленные контексты и разбиения; методы для просмотра открываются после фиксации и оценки.',all:'Все запросы',unknown:'Неизвестные существенные поля',complete:'Существенные поля заполнены',inspect:'Открыть',allCandidates:'Все исходные подграфы',sameAge:'Те же возрастные границы',legacy:'Прежний исследовательский',typed_guard:'С семантическим допуском',scope_frequency:'Частотная база с тем же допуском',frequency:'Прежняя частотная база',abstained:'Воздержался',matched:'Совпало',wrong:'Ошибка',counts:['Запросов','С неизвестными полями','С полным существенным контекстом','Выданных гипотез'],metricHead:['Режим','Запросов','Выдано','Совпало','Ошибок','Отказов'],queryHead:['Запрос','Неизвестные поля','Допущенных когорт','Прежний результат','Источник'],candidateHead:['Источник / диапазоны','Несовместимые поля','Неизвестные поля','Различия среды','Допуск / источник'],reason:{different_age_bounds:'Разные возрастные границы',same_cohort:'Та же когорта',incompatible_critical_scope:'Несовместимые существенные поля',unknown_critical_scope:'Неизвестные существенные поля'},ruleText:['Неизвестность остаётся неизвестностью, даже когда поле отсутствует с обеих сторон.','Открытая группа 85+ не приравнивается к 85–89; показатели не делятся и не объединяются автоматически.','Два результата одной когорты не становятся двумя независимыми голосами.','Для гипотезы нужны минимум две допущенные когорты и согласованный порядок оценок.','Направление наблюдённого результата не участвует в решении о допуске.','Нет выдуманных числовых эффектов, клинических или причинных выводов.']},en:{title:'When a pattern may transfer between articles',notice:'The scientific success criterion has not been reached. This is retrospective eligibility development, not a blind future control or scientific proof. Model calls: 0.',change:'What changed',changeNote:'Eligibility uses separate semantic fields rather than matching long descriptions. Different outcomes, age allocation, diagnostic thresholds or estimands block this operator. Country, period, follow-up and sample size remain warnings; matching these fields does not establish transportability.',result:'Results on the same 30 queries',resultNote:'The new mode abstained on every query. It rejected 7 previous matches as well as 3 previous errors. This loses coverage and does not improve demonstrated accuracy. A frequency baseline with identical eligibility also abstained.',queries:'Which inputs are missing',queryNote:'21 queries have unknown critical fields. The remaining 9 have a specified scope but lack two admitted independent cohort projects. Abstention diagnoses scope; it is not predictive success.',detail:'Query scope and premises',source:'Methods and outcome definition — exact source',fullText:'Full saved text with highlighted excerpt',rules:'Eligibility rules',next:'Practical next step',nextNote:'Expand the corpus selectively: primary full texts with comparable phenotypes, explicit age allocation, diagnosis and rate estimation, with cohort independence checked. Alternatively, justify and independently test a bridge between different definitions. More articles alone do not supply comparable witnesses. Future controls remain unopened.',limits:'Limitations and reproducibility',limitNote:'Codex annotation requires expert review. Critical fields define this operator’s conservative policy; they do not prove that transfer is impossible in general. Scope compatibility does not establish knowledge equivalence, causality or statistical significance. The input port reads only listed contexts and folds; source methods are opened for review after sealing and evaluation.',all:'All queries',unknown:'Unknown critical fields',complete:'Critical scope complete',inspect:'Inspect',allCandidates:'All source subgraphs',sameAge:'Identical age bounds',legacy:'Previous exploratory',typed_guard:'Semantic eligibility',scope_frequency:'Frequency with identical eligibility',frequency:'Previous frequency baseline',abstained:'Abstained',matched:'Matched',wrong:'Error',counts:['Queries','Unknown critical scope','Complete critical scope','Issued hypotheses'],metricHead:['Mode','Queries','Issued','Matched','Errors','Abstentions'],queryHead:['Query','Unknown fields','Admitted cohorts','Previous result','Source'],candidateHead:['Source / bands','Different critical fields','Unknown critical fields','Moderator differences','Eligibility / source'],reason:{different_age_bounds:'Different age bounds',same_cohort:'Same cohort',incompatible_critical_scope:'Incompatible critical scope',unknown_critical_scope:'Unknown critical scope'},ruleText:['Unknown remains unknown, including when both sides lack the value.','85+ is not 85-89; no implicit splitting or pooling of rates.','Two publications of one cohort do not create independent votes.','At least two admitted cohorts with a unanimous order are required.','Observed outcome direction is not used to decide eligibility.','No invented numeric effects, clinical claims or causal conclusions.']}};
const fields={population:'Популяция',residence:'Условия проживания',baseline_status:'Исходное состояние',phenotype:'Фенотип',age_basis:'Учёт возраста',sex:'Пол',measure:'Вид показателя',unit:'Единица',threshold_rule:'Диагностический порог',norms:'Нормы тестов',complaint_rule:'Жалоба / беспокойство',function_rule:'Повседневная функция',direct_dementia_policy:'Прямой переход к деменции',estimand:'Оценённая величина',country:'Страна',calendar_period:'Период',followup:'Наблюдение',sample_size:'Размер выборки'};
function label(k){return lang==='ru'?(fields[k]||k):k}
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function button(text,fn){const b=el('button',text);b.onclick=fn;return b}
function options(id,items){const s=document.getElementById(id),v=s.value;s.replaceChildren(...items.map(([val,txt])=>{const o=el('option',txt);o.value=val;return o}));if(items.some(i=>i[0]===v))s.value=v}
function headers(id,names){document.getElementById(id).replaceChildren(...names.map(n=>el('th',n)))}
function viewProof(p){const key=p.source_id+':'+p.start+':'+p.end,t=data.texts[p.source_id],parts=Array.from(t),text=parts.slice(p.start,p.end).join('');document.getElementById('fragment').textContent=text;document.getElementById('fragment').dataset.proof=key;document.getElementById('proof-meta').textContent=p.source_id+' · PDF '+p.pdf_page+' · Unicode ['+p.start+', '+p.end+') · '+p.source_sha256;document.getElementById('full-text').replaceChildren(document.createTextNode(parts.slice(0,p.start).join('')),el('mark',text),document.createTextNode(parts.slice(p.end).join('')))}
function proofButtons(pointers){document.getElementById('proof-buttons').replaceChildren(...pointers.map(p=>button(p.source_id+' / '+p.pdf_page,()=>viewProof(p))));viewProof(pointers[0])}
function candidates(){const p=data.predictions[selected],body=document.getElementById('candidates');body.replaceChildren();for(const a of p.candidate_audits){if(document.getElementById('candidate-filter').value==='sameAge'&&a.reasons.includes('different_age_bounds'))continue;const tr=el('tr');tr.dataset.candidate=a.source_key;[a.source_key+' / '+JSON.stringify(a.ages),a.comparison.different.map(x=>label(x.field)).join(', ')||'—',a.comparison.unknown.map(x=>label(x.field)).join(', ')||'—',a.comparison.moderator_warnings.map(x=>label(x.field)).join(', ')||'—'].forEach(t=>tr.append(el('td',t)));const td=el('td');td.append(el('p',a.reasons.map(r=>L[lang].reason[r]).join('; ')||'Eligible'),button(L[lang].inspect,()=>{document.getElementById('scope').textContent=JSON.stringify(a.comparison,null,2);proofButtons([...a.source_provenance,...a.query_provenance])}));tr.append(td);body.append(tr)}}
function inspect(id){selected=id;const p=data.predictions[id];document.getElementById('detail').hidden=false;document.getElementById('scope').textContent=JSON.stringify(p.semantic_scope,null,2);document.getElementById('context-note').textContent=id;const scope=data.query_scopes[id];proofButtons(scope.provenance);candidates();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function queries(){const body=document.getElementById('queries');body.replaceChildren();for(const [id,p] of Object.entries(data.predictions)){const unknown=Object.entries(p.semantic_scope.critical).filter(([k,v])=>v===null).map(([k])=>k),filter=document.getElementById('filter').value;if(filter==='unknown'&&!unknown.length||filter==='complete'&&unknown.length)continue;const old=data.previous_rows[id],tr=el('tr');tr.dataset.query=id;[id,unknown.map(label).join(', ')||'—',String(Object.keys(p.family_votes).length),!old.issued?L[lang].abstained:old.matched?L[lang].matched:L[lang].wrong].forEach(t=>tr.append(el('td',t)));const td=el('td');td.append(button(L[lang].inspect,()=>inspect(id)));tr.append(td);body.append(tr)}}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(n=>n.textContent=L[lang][n.dataset.i]);for(const l of ['ru','en'])document.getElementById(l).classList.toggle('active',l===lang);document.getElementById('stats').replaceChildren(...[30,21,9,0].map((v,i)=>{const n=el('div');n.className='stat';n.append(el('strong',String(v)),el('span',L[lang].counts[i]));return n}));headers('metrics-head',L[lang].metricHead);document.getElementById('metrics').replaceChildren(...[['legacy',data.previous.modes.exploratory],['frequency',data.previous.modes.frequency],['typed_guard',data.evaluation.modes.typed_guard],['scope_frequency',data.evaluation.modes.scope_frequency]].map(([mode,m])=>{const tr=el('tr');[L[lang][mode],m.queries,m.issued,m.matched,m.wrong_order,m.abstained].forEach(t=>tr.append(el('td',String(t))));return tr}));options('filter',[['all',L[lang].all],['unknown',L[lang].unknown],['complete',L[lang].complete]]);options('candidate-filter',[['sameAge',L[lang].sameAge],['all',L[lang].allCandidates]]);headers('query-head',L[lang].queryHead);headers('candidate-head',L[lang].candidateHead);queries();document.getElementById('rules').replaceChildren(...L[lang].ruleText.map(t=>el('li',t)));document.getElementById('validation').textContent=JSON.stringify(data.validation,null,2);if(selected)inspect(selected)}
document.getElementById('ru').onclick=()=>{lang='ru';render()};document.getElementById('en').onclick=()=>{lang='en';render()};document.getElementById('filter').onchange=queries;document.getElementById('candidate-filter').onchange=()=>{if(selected)candidates()};render();
</script></html>
