<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Предметный фундамент — MCI</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1b2840;background:#f1f5fa}body{max-width:1250px;margin:0 auto;padding:28px}h1{font-size:30px}h2{font-size:22px}p{line-height:1.6}button,select,input{font:inherit}button{padding:9px 15px;border:1px solid #a2b3cb;border-radius:8px;background:white;color:#234c80;cursor:pointer}button:hover{background:#e9f0fd}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1983f5}header{display:flex;justify-content:space-between;gap:20px;align-items:start}.card{background:white;padding:22px;border:1px solid #d4deea;border-radius:12px;margin:16px 0}.warning{background:#fff5e4;border-color:#ebd2a0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:30px}.muted{color:#50637b}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#edf2f8;padding:14px;max-height:350px;overflow:auto}svg{width:100%;height:auto;background:#f6f9fe;border-radius:8px}.node{cursor:pointer}.node rect{fill:#e8f0ff;stroke:#4b6c9c;stroke-width:1.5}.node:focus-visible rect{stroke:#f28a19;stroke-width:4}.node text{fill:#183757;font-size:14px}.edge{stroke:#627890;stroke-width:2;fill:none}.edge-label{font-size:11px;fill:#53657a}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #d9e3ef;vertical-align:top}ul{padding-left:22px}li{margin:7px 0}a{color:#2169ab}.formula{font-family:monospace;font-size:16px}label{display:block;padding:7px 0}input{width:90px;padding:5px}#model-result{font-weight:600}.badge{display:inline-block;padding:5px 9px;background:#fff0ca;border-radius:6px}#ids{font-size:11px;overflow-wrap:anywhere}@media(max-width:800px){body{padding:14px}.columns{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
<header><div><h1 id="title"></h1><p id="subtitle" class="muted"></p></div><button id="language" aria-label="Language">English</button></header>
<div class="stats card" id="stats"></div>
<section class="card warning"><span class="badge" id="status"></span><p id="hypothesis"></p><p id="caveat"></p></section>
<section class="card"><h2 id="chain-title"></h2><p id="chain-note"></p><button id="background"></button><svg id="graph" viewBox="0 0 1050 340" role="img" aria-label="Joint premise graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627890"/></marker></defs><g id="edges"></g><g id="nodes"></g></svg><div id="detail" aria-live="polite"></div></section>
<div class="columns"><section class="card"><h2 id="model-title"></h2><p id="model-note"></p><p class="formula">P(D,Δ) = min(1,D/Δ)</p><p class="formula">R(Δ) = P(H,Δ) / P(L,Δ)</p><label id="label-low"></label><label id="label-high"></label><label id="label-long"></label><label id="label-short"></label><button id="calculate"></button><p id="model-result" aria-live="polite"></p></section><section class="card warning"><h2 id="counter-title"></h2><p id="counter-text"></p><p class="formula">L: (0.1, 0.5), (100, 0.5)<br>H: (1, 0.5), (100, 0.5)</p><p class="formula">Δ: 50 → 2<br>R: 170/167 → 10/7<br>≈ 1.018 → 1.429</p><p id="counter-note"></p></section></div>
<section class="card"><h2 id="profiles-title"></h2><p id="profiles-note"></p><table><thead id="profiles-head"></thead><tbody id="profiles"></tbody></table></section>
<section class="card"><h2 id="known-title"></h2><ul id="known"></ul><p id="novelty"></p><h2 id="next-title"></h2><p id="next"></p></section>
<section class="card"><h2 id="audit-title"></h2><p id="audit"></p><p id="ids"></p><details><summary id="json-title"></summary><pre id="json"></pre></details></section>
<script type="application/json" id="data">__DATA__</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent),C=DATA.seal.generation.candidates[0];let lang='ru',selected='duration-hypothesis';const modelValues={low:2,high:4,long:4,short:2};
const I={ru:{title:'Предметный фундамент: механизм обнаружения MCI',subtitle:'Один условный кандидат. Проверка границ вывода, не подтверждение нового научного знания.',stats:['Условная гипотеза','Нерешённая задача','Профили источников','Подтверждённые новые знания'],status:'Требует измерений и экспертной проверки',caveat:'Это отношение вероятностей обнаружения среди истинных эпизодов. Оно не является инцидентностью, hazard ratio или причинным эффектом образования.',chainTitle:'Цепочка совместных посылок',chainNote:'Все четыре посылки нужны совместно. Нажмите блок для семантики и источника. Обзор когнитивного резерва остаётся отдельным фоном: перенос из болезни Альцгеймера в MCI автоматически запрещён.',labels:['Гипотеза длительности','Пропущенная стадия','Модель обнаружения','Математический порядок','Условное взаимодействие'],modelTitle:'Иллюстрация фиксированных окон',modelNote:'Все числа здесь вымышлены. Регулярная сетка, равномерная фаза, полное наблюдение, идеальное обнаружение и один непрерывный эпизод обязательны.',low:'Короткое окно L',high:'Длинное окно H',long:'Исходный интервал Δ',short:'Новый интервал Δ',calculate:'Рассчитать',invalid:'Нужны H≥L>0 и 0<новый интервал<исходного.',attenuate:'Отношение уменьшилось',same:'Отношение не изменилось',counterTitle:'Контрпример для неоднородных длительностей',counterText:'Синтетические распределения: пары означают (длительность, вероятность). H стохастически доминирует L, однако более частые визиты увеличивают отношение обнаружения.',counterNote:'Ни большего среднего, ни стохастического доминирования недостаточно для переноса результата фиксированных окон. Это не измерения пациентов.',profilesTitle:'Применимость к семи ранее прочитанным источникам',profilesNote:'Это аудит доступности условий, не сравнение с новыми исходами. Неизвестные поля остаются неизвестными; полный аудит остальных протоколов не заявлен.',source:'Источник',phenotype:'Фенотип',limitations:'Ограничения / неизвестные условия',notTestable:'По выбранным данным проверить нельзя',knownTitle:'Что уже известно и не считается предсказанием',known:['Резерв как объяснение различий клинических проявлений.','Позднее начало и более быстрое последующее снижение.','Влияние диагностических поправок на образование.','Гипотеза большей длительности MCI при высоком образовании.','Пропуск стадии MCI между визитами.','Большая длительность повышает шанс попасть на промежуточный визит.'],novelty:'Взаимодействие интервала и образования отсутствует в выбранных утверждениях; новизна относительно всей литературы не установлена. Оператор задан вручную, а не обучен по независимым когортам. Биологическая посылка поддержана одной когортой PAQUID как гипотеза авторов.',nextTitle:'Следующий проверяемый шаг',next:'Нужны распределения длительности эпизодов по образованию, переходы и возвраты, расписание визитов, пропуски и ошибки диагностики. Затем проверить устойчивость взаимодействия в модели этих данных, сравнить с базой известных знаний и зафиксировать кандидаты до независимого контроля.',auditTitle:'Происхождение и ограничения опыта',audit:'Codex; экспертной проверки нет. Предыдущий фундамент из 12 блоков сохранён. Добавлено пять явных посылок; четыре входят в вывод. Опыт ретроспективный, тексты ранее прочитаны. В CLI сеть отключена; LLM, эмбеддинги и переводчик не вызваны. Расход токенов сессии Codex не измерен. Production-карты, GOLD и сервисы не изменены.',jsonTitle:'Зафиксированный JSON',semantics:'Скрытая семантика',sources:'Происхождение',task:'Нерешённая задача',sourceNote:'Фрагмент полного текста; координаты — Unicode code points. В PDF две колонки, выделение сохраняет обе.',unknown:'Не установлено',violated:'Условие нарушено'},en:{title:'Subject foundation: MCI ascertainment mechanism',subtitle:'One conditional candidate. Testing inference boundaries, not confirming new scientific knowledge.',stats:['Conditional hypothesis','Unresolved task','Source profiles','Confirmed new knowledge'],status:'Requires measurements and expert review',caveat:'The estimand is relative ascertainment probability among true episodes, not incidence, a hazard ratio, or a causal effect of education.',chainTitle:'Joint-premise chain',chainNote:'All four premises are jointly required. Select a block to inspect semantics and provenance. Reserve review remains separate background: Alzheimer disease does not automatically transfer to MCI.',labels:['Duration hypothesis','Missed stage','Capture model','Mathematical order','Conditional interaction'],modelTitle:'Fixed-window illustration',modelNote:'All values are synthetic. Regular visits, uniform phase, complete observation, perfect detection and one continuous episode are required.',low:'Shorter window L',high:'Longer window H',long:'Original interval Δ',short:'New interval Δ',calculate:'Calculate',invalid:'Require H≥L>0 and 0<new interval<original interval.',attenuate:'Ratio decreased',same:'Ratio unchanged',counterTitle:'Counterexample for heterogeneous durations',counterText:'Synthetic distributions: pairs are (duration, probability). H first-order stochastically dominates L, yet shorter visit intervals increase the ascertainment ratio.',counterNote:'Neither a larger mean nor stochastic dominance licenses the fixed-window result. These are not patient measurements.',profilesTitle:'Applicability to seven previously read sources',profilesNote:'This audits available conditions, not new outcomes. Unknown fields remain unknown; a complete audit of other protocols is not claimed.',source:'Source',phenotype:'Phenotype',limitations:'Limitations / unknown conditions',notTestable:'Not testable from selected data',knownTitle:'Known statements excluded from prediction counts',known:['Reserve as an explanation for differing clinical expression.','Delayed onset and faster subsequent decline.','Education adjustments affecting ascertainment.','Longer MCI duration hypothesis with higher education.','MCI stages may be missed between visits.','Longer duration can increase interim detection.'],novelty:'The interval-by-education interaction is absent from selected statements; literature novelty is not established. This operator is manually specified, not learned across independent cohorts. The biological premise is a PAQUID author hypothesis.',nextTitle:'Next testable step',next:'Obtain education-stratified episode-duration distributions, transitions and reversions, visit schedules, missingness and diagnostic errors. Test model robustness, compare with known-knowledge baselines, then freeze candidates before an independent control.',auditTitle:'Provenance and limits',audit:'Codex annotations, not expert reviewed. Previous 12-block foundation retained; five explicit premises added, four used. Retrospective development; papers previously read. CLI network disabled, no LLM, embeddings or translator. Codex session token consumption unmeasured. Production maps, GOLD and services unchanged.',jsonTitle:'Frozen JSON',semantics:'Hidden semantics',sources:'Provenance',task:'Unresolved task',sourceNote:'Full-text fragment with Unicode code-point offsets. PDF lines preserve both columns.',unknown:'Not established',violated:'Condition violated'}};
const fields={ru:{regular_grid:'регулярная сетка',uniform_phase:'равномерная фаза',fixed_group_durations:'фиксированные длительности',perfect_detection:'идеальная диагностика',complete_followup:'полное наблюдение',education_duration_order_measured:'измеренный порядок длительностей',matched_protocol_interval_comparison:'сопоставимое изменение интервала'},en:{regular_grid:'regular grid',uniform_phase:'uniform phase',fixed_group_durations:'fixed durations',perfect_detection:'perfect detection',complete_followup:'complete follow-up',education_duration_order_measured:'measured duration ordering',matched_protocol_interval_comparison:'matched interval comparison'}};
function el(tag,text,parent){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(parent)parent.append(x);return x;}
function set(id,text){document.getElementById(id).textContent=text;}
function showDetail(id){selected=id;const t=I[lang],root=document.getElementById('detail');root.replaceChildren();let b=DATA.seal.inputs.knowledge.find(x=>x.knowledge_id===id)||C;el('h3',lang==='ru'?b.text_ru:b.text,root);el('h4',t.semantics,root);el('pre',JSON.stringify(b.frame,null,2),root);if(b===C){el('h4',t.task,root);el('p',lang==='ru'?C.measurement_task.text_ru:C.measurement_task.text,root);return;}el('h4',t.sources,root);for(const key of b.provenance){const f=DATA.evidence.fragments[key];if(f){el('p',`${f.source_id}: ${f.start}–${f.end} · ${t.sourceNote}`,root);el('pre',f.text,root);}else{const a=DATA.evidence.authored_sources[key];el('p',a.title,root);if(a.url){const link=el('a',a.doi||a.url,root);link.href=a.url;link.rel='noreferrer';}el('pre',a.text,root);}}}
function drawGraph(){const t=I[lang],ns='http://www.w3.org/2000/svg',nodes=document.getElementById('nodes'),edges=document.getElementById('edges');nodes.replaceChildren();edges.replaceChildren();const ids=['duration-hypothesis','missed-stage','sampling-model','relative-order','hypothesis:'+C.id];ids.forEach((id,i)=>{const g=document.createElementNS(ns,'g');g.setAttribute('class','node');g.setAttribute('data-id',id);g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',t.labels[i]);const x=i<4?20:685,y=i<4?15+i*80:130;const r=document.createElementNS(ns,'rect');for(const [k,v]of Object.entries({x,y,width:340,height:54,rx:8}))r.setAttribute(k,v);g.append(r);const label=document.createElementNS(ns,'text');label.setAttribute('x',x+14);label.setAttribute('y',y+33);label.textContent=t.labels[i];g.append(label);g.onclick=()=>showDetail(id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(id);}};nodes.append(g);if(i<4){const line=document.createElementNS(ns,'path');line.setAttribute('class','edge');line.setAttribute('data-source',id);line.setAttribute('data-target',ids[4]);line.setAttribute('d',`M360 ${y+27} L685 157`);line.setAttribute('marker-end','url(#arrow)');edges.append(line);}});}
function model(){const t=I[lang],v=['low','high','long','short'].map(k=>Number(document.getElementById(k).value)),[L,H,A,B]=v;if(!v.every(Number.isFinite)||L<=0||H<L||B<=0||B>=A){set('model-result',t.invalid);return;}const ratio=d=>Math.min(1,H/d)/Math.min(1,L/d),before=ratio(A),after=ratio(B);set('model-result',`${before.toFixed(6)} → ${after.toFixed(6)} · ${after<before-1e-12?t.attenuate:t.same}`);}
function render(){const t=I[lang];document.documentElement.lang=lang;document.title=t.title;set('title',t.title);set('subtitle',t.subtitle);set('language',lang==='ru'?'English':'Русский');const stats=document.getElementById('stats');stats.replaceChildren();[1,1,7,0].forEach((v,i)=>{const c=el('div',undefined,stats);c.className='stat';el('strong',v,c);el('span',t.stats[i],c);});for(const [id,key]of Object.entries({'status':'status','caveat':'caveat','chain-title':'chainTitle','chain-note':'chainNote','model-title':'modelTitle','model-note':'modelNote','calculate':'calculate','counter-title':'counterTitle','counter-text':'counterText','counter-note':'counterNote','profiles-title':'profilesTitle','profiles-note':'profilesNote','known-title':'knownTitle','novelty':'novelty','next-title':'nextTitle','next':'next','audit-title':'auditTitle','audit':'audit','json-title':'jsonTitle'}))set(id,t[key]);set('hypothesis',lang==='ru'?C.text_ru:C.text);for(const [id,value]of [['low',2],['high',4],['long',4],['short',2]]){const label=document.getElementById('label-'+id);label.replaceChildren();el('span',t[id]+' ',label);const input=el('input',undefined,label);input.type='number';input.min='0.001';input.step='0.1';input.id=id;input.value=modelValues[id];input.oninput=()=>{modelValues[id]=input.value;model();};}set('background',lang==='ru'?'Отдельный фон: когнитивный резерв':'Separate background: cognitive reserve');drawGraph();showDetail(selected);const head=document.getElementById('profiles-head');head.replaceChildren();const tr=el('tr',undefined,head);[t.source,t.phenotype,t.limitations].forEach(x=>el('th',x,tr));const body=document.getElementById('profiles');body.replaceChildren();for(const row of DATA.evaluation.rows[0].profiles){const tr=el('tr',undefined,body);tr.dataset.source=row.source_id;el('td',row.source_id,tr);const phenotype=el('td',row.reasons.includes('different_phenotype')?(lang==='ru'?'Другой фенотип':'Different phenotype'):(lang==='ru'?'Изолированное нарушение памяти':'Isolated-memory MCI'),tr);const cell=el('td',undefined,tr);el('strong',t.notTestable,cell);const list=el('ul',undefined,cell);for(const reason of row.reasons){if(reason==='different_phenotype')continue;const unknown=reason.startsWith('unknown_'),field=reason.replace(/^(unknown|violated)_/,'');el('li',`${unknown?t.unknown:t.violated}: ${fields[lang][field]||field}`,list);}}
const known=document.getElementById('known');known.replaceChildren();t.known.forEach(x=>el('li',x,known));set('ids',`run_id: ${DATA.seal.run_id}\nevaluation_id: ${DATA.evaluation.evaluation_id}`);set('json',JSON.stringify(DATA,null,2));model();}
document.getElementById('background').onclick=()=>showDetail('reserve-background');document.getElementById('language').onclick=()=>{lang=lang==='ru'?'en':'ru';render();};document.getElementById('calculate').onclick=model;render();
</script></html>
