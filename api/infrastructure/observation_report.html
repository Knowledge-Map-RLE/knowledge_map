<style>body{font-family:system-ui,sans-serif;color:#20334c;background:#eff4fa;max-width:1180px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;gap:18px}h1{font-size:29px}h2{font-size:22px}p{line-height:1.6}.card{background:white;border:1px solid #d4deeb;border-radius:12px;padding:22px;margin:18px 0}.warning{background:#fff5e6;border-color:#edcd99}.stats{display:flex;gap:24px;flex-wrap:wrap}.stats strong{display:block;font-size:30px}button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid #92a9c7;background:white;cursor:pointer;color:#24568a}button:hover{background:#e7f0fd}button:focus-visible{outline:3px solid #237bdb}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #d6e0ee;vertical-align:top;text-align:left}pre{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;background:#f1f5fa;padding:12px}svg{width:100%;height:auto;background:#f6f9fe;border-radius:8px}.muted{color:#4d637d}#ids{font-size:11px;overflow-wrap:anywhere}.scroll{overflow:auto}li{margin:8px 0}@media(max-width:750px){body{padding:12px}.card{padding:14px}table{font-size:13px}}</style>

<script type="application/json" id="data">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),CAT=D.inputs.catalog,E=D.inputs.evidence;let lang='ru',world=0,selected='larrieu2002';
const I={ru:{title:'Наблюдения на визитах и скрытые эпизоды MCI',intro:'Расписания установлены. Длительность эпизода и её порядок между группами не восстановлены.',stats:['Источники','Фрагменты','Совместимые миры','Новые подтверждённые знания'],findingTitle:'Почему таблицы переходов не проверяют прежнюю гипотезу',finding:'Одни состояния на визитах допускают противоположные порядки длительности MCI между группами образования. Это ограничение информации даже при идеальной диагностике, а не отсутствие нужной формулы.',protocolTitle:'Что действительно написано в семи статьях',protocolNote:'Плановые интервалы, среднее наблюдение и длительность MCI — разные величины. Ни один источник по выбранным данным не готов к проверке эффекта изменения интервала.',source:'Источник / когорта',schedule:'Описание расписания',open:'Открыть фрагменты',tableTitle:'PAQUID: состояние на следующем визите',tableNote:'Таблица 3 визуально сверена с исходным PDF. Проценты относятся ко всей указанной исходной группе, включая смерть и пропуски.',group:'Исходная группа',interval:'Интервал, лет',columns:['Норма','MCI','OCIND','Деменция','Смерть','Пропуски'],tableLimit:'Строки n=58 и n=37 не образуют одну траекторию эпизода. Их нельзя перемножать как выживание. Длительность по образованию здесь не измерена; напечатанные проценты не исправляются.',witnessTitle:'Одинаковые посещения — разные скрытые истории',witnessNote:'Все эпизоды вымышлены. На визитах в 0, 2 и 5 лет во всех строках наблюдается норма → MCI → норма. Полосы показывают ненаблюдаемые интервалы, точки — одинаковые наблюдения.',worlds:['Мир A: у высокого образования длиннее','Мир B: у высокого образования короче'],high:'Высокое образование',low:'Низкое образование',hidden:'Дополнительный скрытый эпизод',duration:'Длительность',years:'лет',witnessLimit:'Оба направления совместимы с теми же посещениями. Один непрерывный эпизод даёт лишь 0<D<5 лет. Дополнительный эпизод тоже может остаться невидимым.',baselineLimit:'При MCI уже на исходном визите начало неизвестно. Исчезновение к году 2 не ограничивает полную длительность двумя годами: синтетические длительности 2 и 101 год дают те же посещения. Это демонстрация отсутствия верхней границы, не реалистичная оценка болезни.',semanticTitle:'Ограничение для скрытой семантики',semantic:'Нужно хранить измеряемую величину, процесс наблюдения, цензурирование, условность реконструкции, допущения и идентифицируемость. Интервал визитов не подменяет длительность, а одинаковый диагноз на двух визитах не доказывает непрерывность эпизода. Проверка добавлена отдельным экспериментальным модулем.',nextTitle:'Что делать дальше',next:'Получить индивидуальные времена и состояния, группы образования, интервалы начала и восстановления, пропуски, смерть и ошибки диагностики. Проверять направление по всем допустимым скрытым историям; при изменении направления выдавать неопределённость. Либо выбрать оператор, для которого опубликованных измерений достаточно.',sourceTitle:'Исходные фрагменты',auditTitle:'Границы и воспроизводимость',audit:'Codex, без экспертной проверки. Ретроспективный аудит семи ранее прочитанных статей; будущие контролы не открывались. Сеть в CLI отключена, LLM, эмбеддинги и переводчик не вызваны. Старые результаты, GOLD, Neo4j и сервисы этим шагом не менялись. Основной научный критерий пока не достигнут.',jsonTitle:'Зафиксированный JSON',offset:'Unicode code points',page:'Страница PDF'},en:{title:'Visit observations and hidden MCI episodes',intro:'Schedules documented. Episode durations and their group ordering remain unidentified.',stats:['Sources','Fragments','Compatible worlds','Confirmed new knowledge'],findingTitle:'Why transition tables do not test the earlier hypothesis',finding:'Identical visit states allow opposite education-specific MCI duration orders. This is an information limit even with perfect diagnosis, not a missing formula.',protocolTitle:'What the seven papers actually report',protocolNote:'Planned intervals, mean follow-up and MCI episode duration are different quantities. Selected published data do not establish readiness for the interval-effect test.',source:'Source / cohort',schedule:'Reported schedule',open:'Inspect fragments',tableTitle:'PAQUID: status at the next visit',tableNote:'Table 3 visually checked against the source PDF. Percentages refer to the specified initial group, including death and missingness.',group:'Initial group',interval:'Interval, years',columns:['Normal','MCI','OCIND','Demented','Dead','Missing'],tableLimit:'The n=58 and n=37 rows are not one episode trajectory. Do not multiply them as survival. Education-specific durations are not measured here; printed percentages are retained.',witnessTitle:'Identical visits, different hidden histories',witnessNote:'Every episode is synthetic. At visits 0, 2 and 5 years, every row has normal → MCI → normal. Bars show hidden episodes; dots show identical observations.',worlds:['World A: higher education has longer duration','World B: higher education has shorter duration'],high:'Higher education',low:'Lower education',hidden:'Additional hidden episode',duration:'Duration',years:'years',witnessLimit:'Both orders fit the same visits. A single continuous episode yields only 0<D<5 years. Additional episodes can remain invisible.',baselineLimit:'MCI at baseline leaves onset unknown. Disappearance by year 2 does not bound total duration by two years: synthetic durations of 2 and 101 years yield the same visits. This illustrates the absence of an upper bound, not a realistic disease estimate.',semanticTitle:'Guard for hidden semantics',semantic:'Represent the estimand, observation process, censoring, reconstruction status, assumptions and identifiability. Visit spacing is not duration; matching diagnoses at two visits do not establish episode continuity. Added as a separate experimental module.',nextTitle:'Next step',next:'Obtain individual times and states, education definitions, onset/recovery intervals, missingness, death and diagnostic errors. Check the direction across compatible hidden histories; abstain when it changes. Alternatively select an operator supported by available measurements.',sourceTitle:'Source fragments',auditTitle:'Scope and reproducibility',audit:'Codex, not expert reviewed. Retrospective audit of seven previously read papers; no future controls opened. CLI network disabled, no LLM, embeddings or translator. Prior results, GOLD, Neo4j and services unchanged by this step. The main scientific criterion remains unmet.',jsonTitle:'Frozen JSON',offset:'Unicode code points',page:'PDF page'}};
function el(tag,text,parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e;}function set(id,text){document.getElementById(id).textContent=text;}
function showSource(id){selected=id;const t=I[lang],root=document.getElementById('source');root.replaceChildren();el('h3',id,root);for(const [key,f]of Object.entries(E.fragments)){if(f.source_id!==id)continue;el('p',`${key} · ${t.offset}: ${f.start}–${f.end} · ${t.page}: ${f.pdf_page}`,root);const p=el('pre',f.text,root);p.dataset.proof=key;}}
function rational(v){const p=v.split('/').map(Number);return p.length===2?p[0]/p[1]:p[0];}
function timeline(){const t=I[lang],svg=document.getElementById('timeline'),ns='http://www.w3.org/2000/svg';svg.replaceChildren();svg.setAttribute('aria-label',t.witnessTitle);const w=D.audit.witnesses,index=Object.fromEntries(w.histories.map(h=>[h.id,h])),chosen=w.education_worlds[world],rows=[[t.high,index[chosen.higher_education]],[t.low,index[chosen.lower_education]],[t.hidden,index.hidden_extra]];const x=v=>260+v*140;
function item(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;svg.append(e);return e;}
for(let i=0;i<rows.length;i++){const [label,h]=rows[i],y=60+i*95;item('text',{x:14,y:y+6,'font-size':15},label);item('line',{x1:x(0),x2:x(5),y1:y,y2:y,stroke:'#8fa1b8'});for(const episode of h.episodes)item('rect',{x:x(rational(episode.start)),y:y-14,width:140*(rational(episode.end)-rational(episode.start)),height:28,fill:'#f0b55a',rx:4,'data-history':h.id});w.visits.forEach((time,j)=>{item('circle',{cx:x(rational(time)),cy:y,r:7,fill:h.visit_states[j]==='MCI'?'#b33b51':'white',stroke:'#294766','stroke-width':2,'data-observation':h.visit_states[j]});});item('text',{x:260,y:y+36,'font-size':13,fill:'#425a75'},`${t.duration}: ${h.durations.map(v=>rational(v).toFixed(2)).join(' + ')} ${t.years}`);}for(const time of w.visits)item('text',{x:x(rational(time))-5,y:335,'font-size':14},`${time}`);set('world',t.worlds[world]);}
function render(){const t=I[lang];document.documentElement.lang=lang;document.title=t.title;set('language',lang==='ru'?'English':'Русский');for(const [id,key]of Object.entries({'title':'title','intro':'intro','finding-title':'findingTitle','finding':'finding','protocol-title':'protocolTitle','protocol-note':'protocolNote','table-title':'tableTitle','table-note':'tableNote','table-limit':'tableLimit','witness-title':'witnessTitle','witness-note':'witnessNote','witness-limit':'witnessLimit','baseline-limit':'baselineLimit','semantic-title':'semanticTitle','semantic':'semantic','next-title':'nextTitle','next':'next','source-title':'sourceTitle','audit-title':'auditTitle','audit':'audit','json-title':'jsonTitle'}))set(id,t[key]);const stats=document.getElementById('stats');stats.replaceChildren();[7,12,2,0].forEach((n,i)=>{const c=el('div',undefined,stats);el('strong',n,c);el('span',t.stats[i],c);});const head=document.getElementById('protocol-head');head.replaceChildren();const hr=el('tr',undefined,head);[t.source,t.schedule,''].forEach(v=>el('th',v,hr));const body=document.getElementById('protocols');body.replaceChildren();for(const s of CAT.sources){const tr=el('tr',undefined,body);tr.dataset.source=s.source_id;el('td',`${s.source_id} · ${s.cohort}`,tr);el('td',lang==='ru'?s.text_ru:s.text,tr);const b=el('button',t.open,el('td',undefined,tr));b.onclick=()=>showSource(s.source_id);}const th=document.getElementById('table-head');th.replaceChildren();const ht=el('tr',undefined,th);[t.group,t.interval,...t.columns].forEach(v=>el('th',v,ht));const tb=document.getElementById('table-rows');tb.replaceChildren();for(const row of CAT.paquid_table.rows){const tr=el('tr',undefined,tb);el('td',`MCI · n=${row.initial_n}`,tr);el('td',row.interval_years,tr);for(const k of ['normal','MCI','OCIND','demented','dead','missing_and_withdrawals'])el('td',row.percent[k]+'%',tr);}timeline();showSource(selected);set('ids','run_id: '+D.run_id);set('json',JSON.stringify(D,null,2));}
document.getElementById('world').onclick=()=>{world=1-world;timeline();};document.getElementById('language').onclick=()=>{lang=lang==='ru'?'en':'ru';render();};render();
</script></html>
