<script id="payload" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('payload').textContent);let lang='ru';
const words={ru:{title:'Независимый источник: результат пока непроверяем',lead:'Полный текст ROSMAP и его приложение проверены. Обе зафиксированные гипотезы не получили сопоставимого опубликованного результата. Это не опровержение и не два совпадения. Критерий успеха пока не достигнут.',metrics:['Метаданных в реестре','Зафиксировано гипотез','Проверяемых результатов','Новых совпадений'],hyp:'Две прежние гипотезы',age:'Больший возраст → больший hazard возникновения MCI любого домена',education:'Меньшее образование → больший hazard возникновения немнестического MCI',status:'Результат не опубликован в нужной форме',support:'Обучающие когорты',details:'Проверить семантический контраст и причины',modeTitle:'Три режима на одном зафиксированном входе',modeNote:'Число кандидатов означает объём прогнозного списка, а не число совпадений. При нулевом числе проверяемых результатов доля верных ответов не определена.',modeNames:{semantic:'Семантический перенос',known_union:'Известные знания',frequency:'Частотная база'},modeCols:['Режим','Кандидаты','Проверяемые результаты','Совпадения','Доля верных'],sourceTitle:'Что проверено в источнике',source:'ROSMAP: 1255 участников без исходного MCI/деменции и паркинсонизма; ежегодные оценки и модель Cox с несколькими состояниями. Возраст и образование используются как поправки. В тексте, трёх таблицах и приложении нет нужных коэффициентов; немнестический MCI отдельно не выделен. Приложение содержит только схему с числом переходов.',anchors:'Происхождение: Unicode-координаты и хеши',screenTitle:'Отбор и исключения',screenNote:'19 исходных и 39 дополнительных записей дают 55 уникальных метаданных. Поиск инцидентности расширен после фиксации; направление прогнозов не менялось. Метаданные не означают пригодность. Остаются нерешённые возрастные подгруппы, доступ и даты; окончательный первый оцениваемый контроль не выбран.',filter:'Показать',screenCols:['Дата','Статья / DOI','Статус и основание'],nextTitle:'Следующий необходимый материал',next:'Нужен полный текст TARCC с DOI 10.1176/appi.neuropsych.20230180. По аннотации есть подходящий Cox-анализ инцидентного MCI, но сервер выдал 403. Без текста нельзя утверждать наличие нужных коэффициентов. Писать авторам не будем.',integrity:'Старый прогноз, GOLD, карты и сервисы не изменены. Модельных вызовов: 0. Разметка Codex требует экспертной проверки. Это исторический контроль после публикации; параметрическое незнание источника не удостоверено. Преимущество графа над базовыми режимами не измерено.',frozen:'Открыть прежний зафиксированный прогноз'},en:{title:'Independent source: predictions remain unassessable',lead:'The ROSMAP full text and supplement have been reviewed. Neither frozen hypothesis has a compatible reported result. This is neither refutation nor two matches. The success criterion has not been met.',metrics:['Metadata records','Frozen hypotheses','Assessable results','New matches'],hyp:'Two unchanged hypotheses',age:'Older age → higher hazard of incident any-domain MCI',education:'Less education → higher hazard of incident nonmemory MCI',status:'Required result not reported',support:'Training cohorts',details:'Inspect semantic contrast and reasons',modeTitle:'Three modes on the same frozen input',modeNote:'Candidate counts describe forecast lists, not matches. Accuracy is undefined when there are no assessable results.',modeNames:{semantic:'Semantic transfer',known_union:'Known knowledge union',frequency:'Frequency baseline'},modeCols:['Mode','Candidates','Assessable results','Matches','Accuracy'],sourceTitle:'Source review',source:'ROSMAP: 1255 participants without baseline MCI/dementia or parkinsonism; annual assessments and a multistate Cox model. Age and education are covariates. The body, three tables and supplement do not report the required coefficients; nonmemory MCI is not separated. The supplement contains only a transition-count diagram.',anchors:'Provenance: Unicode coordinates and hashes',screenTitle:'Screening and exclusions',screenNote:'19 initial and 39 additional records yield 55 unique metadata entries. The neutral incidence search was expanded after sealing, without altering predicted directions. Metadata do not establish eligibility. Older subgroups, access and dates remain unresolved; a first assessable target has not been finalized.',filter:'Show',screenCols:['Date','Article / DOI','Status and basis'],nextTitle:'Next required material',next:'The TARCC full text is needed: DOI 10.1176/appi.neuropsych.20230180. Its abstract describes incident MCI and a Cox model, but the publisher returned HTTP 403. Compatible coefficients cannot be assumed. No author contact is planned.',integrity:'The forecast, GOLD, maps and services are unchanged. Model calls: 0. Codex annotations require expert review. This is a post-publication historical holdout; parametric ignorance is not certified. Incremental graph advantage has not been measured.',frozen:'Open the original frozen forecast'}};
const el=id=>document.getElementById(id);const put=(id,text)=>el(id).textContent=text;
function table(target,headers,rows){const t=el(target);t.replaceChildren();const head=document.createElement('thead'),hr=document.createElement('tr');headers.forEach(h=>{const c=document.createElement('th');c.textContent=h;hr.append(c)});head.append(hr);t.append(head);const body=document.createElement('tbody');rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(value=>{const td=document.createElement('td');if(value instanceof window.Node)td.append(value);else td.textContent=String(value);tr.append(td)});body.append(tr)});t.append(body)}
function render(){const w=words[lang];document.documentElement.lang=lang;document.title=w.title;put('title',w.title);put('lead',w.lead);put('language',lang==='ru'?'English':'Русский');const a=data.audit;el('metrics').replaceChildren();[data.screening.unique_metadata_entries,a.modes.semantic.candidate_count,a.decisive_semantic_candidates,a.independent_pattern_matches].forEach((v,i)=>{const d=document.createElement('div');d.className='metric';const strong=document.createElement('strong');strong.textContent=v;d.append(strong,document.createTextNode(w.metrics[i]));el('metrics').append(d)});put('hyp-title',w.hyp);el('hypotheses').replaceChildren();a.modes.semantic.rows.forEach(r=>{const c=document.createElement('article');c.className='card';c.dataset.candidateId=r.candidate_id;const h=document.createElement('h3');h.textContent=w[r.signature.factor];const p=document.createElement('p');p.textContent=r.reporting?(lang==='ru'?r.reporting.explanation_ru:r.reporting.explanation_en):w.status;const support=document.createElement('p');support.className='muted';support.textContent=w.support+': '+r.support_cohorts.join(', ');const detail=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent=w.details;pre.textContent=JSON.stringify({signature:r.signature,status:r.status,reporting:r.reporting,premise_ids:r.premise_ids},null,2);detail.append(summary,pre);c.append(h,p,support,detail);el('hypotheses').append(c)});put('mode-title',w.modeTitle);put('mode-note',w.modeNote);table('modes',w.modeCols,['semantic','known_union','frequency'].map(m=>{const r=a.modes[m];return[w.modeNames[m],r.candidate_count,r.decisive_candidates,r.counts.qualitative_pattern_match||0,r.direction_accuracy===null?'—':r.direction_accuracy]}));put('source-title',w.sourceTitle);const link=document.createElement('a');link.href=data.control.url;link.textContent=data.control.doi;el('source').replaceChildren(document.createTextNode(w.source+' '),link);el('limits').replaceChildren();(lang==='ru'?a.context_limits:data.context_limits_en).forEach(s=>{const li=document.createElement('li');li.textContent=s;el('limits').append(li)});put('anchors-title',w.anchors);put('anchors',JSON.stringify(data.control.anchors,null,2));put('screen-title',w.screenTitle);put('screen-note',w.screenNote);put('filter-label',w.filter);const filter=el('filter').value;const rows=data.screening.records.filter(r=>filter==='all'||(filter==='unresolved'?r.status.includes('unresolved'):r.status!=='not_screened_further'));table('screening',w.screenCols,rows.map(r=>{const link=document.createElement('a');link.href=r.url;link.textContent=r.title+' — '+(r.doi||r.pmcid);return[r.verified_date||((r.metadata_date||'—')+' (?)'),link,r.status+'\n'+(lang==='ru'?r.reason_ru:r.reason_en)]}));put('next-title',w.nextTitle);put('next',w.next);put('integrity',w.integrity);put('frozen',w.frozen)}
el('language').onclick=()=>{lang=lang==='ru'?'en':'ru';render()};el('filter').onchange=render;render();
</script></html>
