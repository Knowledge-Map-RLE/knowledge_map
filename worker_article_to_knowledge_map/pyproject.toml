[tool.poetry]
name = "worker-article-to-knowledge-map"
version = "0.1.0"
description = "Batch worker: PMC articles → annotations → actions → knowledge map"
authors = []
packages = [{include = "."}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
httpx = "^0.27.0"
neo4j = "^5.20.0"
pydantic = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
