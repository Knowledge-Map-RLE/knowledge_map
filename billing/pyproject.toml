[tool.poetry]
name = "billing"
version = "0.1.0"
description = "Billing microservice - подписки и платежи (ЮKassa), кредиты"
authors = ["Dobrosvet <dimaprokofev@yandex.ru>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
neomodel = "5.3.1"
fastapi = "0.104.1"
uvicorn = "0.24.0"
python-dotenv = "1.1.0"
pydantic = "2.11.7"
pydantic-settings = "2.9.1"
httpx = "^0.27.0"
grpcio = "1.74.0"
grpcio-tools = "1.74.0"
protobuf = "6.31.1"
python-multipart = "0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
