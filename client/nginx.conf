server {
    listen 80;
    server_name localhost;
    
    # Расположение статических файлов React приложения
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Настройка для SPA (Single Page Application)
    # Перенаправляем все запросы на index.html для React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Настройки для API проксирования
    # API_HOST задаётся через переменную окружения (Railway: api.railway.internal, Docker: knowledge_map_api)
    resolver RESOLVER_PLACEHOLDER valid=5s ipv6=off;

    location /api/ {
        set $api_upstream https://${API_PUBLIC_HOST};
        proxy_pass $api_upstream;
        proxy_set_header Host ${API_PUBLIC_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_PUBLIC_HOST};
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 100m;
    }

    # Проксирование запросов к микросервису billing
    # BILLING_PUBLIC_HOST задаётся через переменную окружения
    # (Railway: billing.railway.internal, Docker: knowledge_map_billing)
    location /billing/ {
        set $billing_upstream https://${BILLING_PUBLIC_HOST};
        proxy_pass $billing_upstream;
        proxy_set_header Host ${BILLING_PUBLIC_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name ${BILLING_PUBLIC_HOST};
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 10m;
    }
    
    # Отключаем логирование для favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}